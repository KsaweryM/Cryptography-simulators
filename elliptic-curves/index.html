<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elliptic-curve explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  --key-b:#E2A60E;   --key-bg:#FDF3DC;
  --ctr-b:#2FA84F;   --ctr-bg:#E3F4E8;
  --non-b:#2F6FDB;   --non-bg:#E5EDFB;
  --ct-b:#8A5CD8;   --ct-bg:#F1EAFD;
  --eve-b:#E5484D;  --eve-bg:#FDE9E9;
  --cip-b:#A8642A;  --cip-bg:#F7ECE0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
    --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
    --ct-b:#B596F5; --ct-bg:#2A2142;
    --eve-b:#FF6B6F; --eve-bg:#3A1A1C; --cip-b:#D99A5E; --cip-bg:#33241A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
  --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
  --ct-b:#B596F5; --ct-bg:#2A2142;
  --eve-b:#FF6B6F; --eve-bg:#3A1A1C; --cip-b:#D99A5E; --cip-bg:#33241A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea,select{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.row>.card{flex:1 1 auto}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.schwrap{overflow-x:auto}

/* roles: one colour per role, the same in every step */
.role-priv{border-color:var(--key-b);background:var(--key-bg)}
.role-pub{border-color:var(--ct-b);background:var(--ct-bg)}
.role-ali{border-color:var(--non-b);background:var(--non-bg)}
.role-bob{border-color:var(--ctr-b);background:var(--ctr-bg)}
.role-eve{border-color:var(--eve-b);background:var(--eve-bg)}
.role-cip{border-color:var(--cip-b);background:var(--cip-bg)}
.role-msg{border-color:var(--const-b);background:var(--const-bg)}
.role-chg{border-color:var(--chg);background:var(--chg-bg)}

/* step 1: the schematic */
.sch{position:relative;width:900px;color:var(--ink);margin:0 auto}
.sch .arrows{position:absolute;left:0;top:0;overflow:visible}
.sch .abs{position:absolute}
.who{position:absolute;top:0;width:250px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.who svg{width:22px;height:22px}
.chip{position:absolute;border-radius:8px;padding:6px 10px;border:1.5px solid;font-weight:600;font-size:13px}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chip .val{display:block;font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.3}
.chip select{margin-top:4px;font-size:15px}
.ctrline{display:flex;gap:5px;align-items:center;margin-top:4px}
.ctrline button{padding:3px 10px}
.ctrline input[type=number]{width:5.2em;font-size:15px}
.icon-btn{padding:3px 6px;line-height:0}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:8px 14px;font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono)}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:11.5px;font-weight:400;opacity:.8;font-family:var(--sans)}
.box.abs{position:absolute}
.pubbox{position:absolute;left:310px;top:0;width:280px;border:1.5px solid;border-radius:8px;padding:6px 12px;text-align:center}
.pubbox b{display:block;font-size:13px}
.pubbox .mono{font-size:14.5px;display:block}
.evebox{position:absolute;border:1.5px solid;border-radius:8px;padding:6px 10px;font-size:13px;text-align:center}
.evebox .nh{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.evebox .nh svg{width:20px;height:20px;color:var(--eve-b)}
.evebox .mono{font-size:13.5px}
.eqc{position:absolute;width:46px;height:46px;border-radius:50%;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.eqc.ok{background:var(--ok)} .eqc.bad{background:var(--bad)}
.alab{position:absolute;font-size:12.5px;font-weight:600;white-space:nowrap}
.tries{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.try{font-family:var(--mono);font-size:12.5px;padding:3px 7px;border-radius:5px;border:1.5px solid var(--rule);background:var(--sunken)}
.try.hit{border-color:var(--eve-b);background:var(--eve-bg);font-weight:700}
.calc{font-family:var(--mono);font-size:14.5px;line-height:2}
.calc .c{padding:1px 6px;border-radius:4px;border:1.5px solid}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigc{border:1.5px solid;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;min-width:0}
.bigc input{width:100%;font-size:12px;margin-top:3px}
.hexv{font-family:var(--mono);font-size:12.5px;font-weight:400;word-break:break-all;line-height:1.45;margin-top:2px}
.hexv i{font-style:normal;color:var(--muted);font-family:var(--sans);font-size:12px}
.bigout{grid-column:1 / span 2}

/* step 2: the real curve */
.row>.plotwrap{flex:0 1 600px;min-width:0}
.plotwrap svg{display:block;width:100%;height:auto;max-width:560px;touch-action:none;user-select:none}
.plot .axis{stroke:var(--muted);stroke-width:1.2}
.plot .gl{stroke:var(--rule);stroke-width:1}
.plot .tick{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.plot .curve{fill:none;stroke:var(--ink);stroke-width:2.6}
.plot .ln{stroke:var(--muted);stroke-width:2}
.plot .refl{stroke:var(--chg);stroke-width:2;stroke-dasharray:6 4}
.plot .h{cursor:grab}
.plot .h:active{cursor:grabbing}
.plot .lbl{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--ink)}
.plot .lblc{font-family:var(--sans);font-size:13px;font-weight:600;fill:var(--chg)}
.plot .lblr{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--ct-b)}
.plot .num{font-family:var(--sans);font-size:12px;font-weight:700;fill:#fff}
.row>.readout{flex:1 1 300px;min-width:280px}
.rd{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:6px 0 4px}
.rd .k{color:var(--muted)}
.rd .v{font-family:var(--mono)}
.nums{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.nums li{display:flex;gap:8px;align-items:center}
.nwhy{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.nb{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chg);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* step 3 and 4: the grid of dots */
.grid17 .gd{fill:var(--rule)}
.grid17 .tick{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.grid17 .pt{fill:var(--ink)}
.grid17 .hit{fill:transparent;cursor:pointer}
.grid17 .hit:hover{fill:var(--sunken)}
.grid17 .sel{fill:none;stroke:var(--focus);stroke-width:2}
.grid17 .mlab{font-family:var(--sans);font-size:12px;font-weight:700}
.grid17 .halo{stroke:var(--surface);stroke-width:4;paint-order:stroke}
.chk{font-size:14px;margin:8px 0 0;min-height:3em}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.mchip{display:flex;flex-direction:column;align-items:center;padding:3px 7px;border-radius:6px;font-family:var(--mono);font-size:12.5px;line-height:1.3;min-width:58px}
.mchip b{font-family:var(--sans);font-size:12px}
.mchip.fut{opacity:.4}
.mchip.cur{background:var(--chg);border-color:var(--chg);color:#fff}
.bigline{font-family:var(--mono);font-size:22px;font-weight:600;margin:6px 0}
.bits{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.bit{display:inline-block;width:20px;height:26px;line-height:26px;text-align:center;font-family:var(--mono);font-size:13px;border-radius:3px;background:var(--sunken);color:var(--muted)}
.bit.one{background:var(--ink);color:var(--surface)}
.bit.chg{box-shadow:inset 0 0 0 2.5px var(--chg)}
.dtable{border-collapse:collapse;font-size:13.5px;margin-top:8px}
.dtable th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:2px 8px;border-bottom:1px solid var(--rule)}
.dtable td{padding:3px 8px;font-family:var(--mono);border-bottom:1px solid var(--rule)}
.dtable td.op{cursor:pointer;border-radius:4px}
.dtable td.op:hover{background:var(--sunken)}
.dtable td.cur{outline:2.5px solid var(--chg);outline-offset:-2px;background:var(--chg-bg)}
.dtable td.done{color:var(--ink)}
.dtable td.todo{color:var(--muted);opacity:.45}
.dtable td.bit1{font-weight:700}
.opnow{font-family:var(--mono);background:var(--chg);color:#fff;border-radius:5px;padding:2px 8px}
.opline{margin:10px 0 0;font-size:14px}
.sm-in{width:8em;font-size:15px}

/* step 4: the formulas */
.formbox{display:inline-grid;grid-template-columns:auto auto;gap:4px 18px;font-family:var(--mono);font-size:15px;padding:10px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sunken)}
.formbox .hl{background:var(--chg-bg);outline:2px solid var(--chg);border-radius:4px;padding:0 4px}
.formbox .lb{font-family:var(--sans);font-weight:600;font-size:13.5px}
.stepsf{display:grid;grid-template-columns:34px auto;gap:2px 10px;align-items:start;margin-top:6px}
.stepsf .mk{width:26px;height:26px;border-radius:50%;background:var(--sunken);color:var(--muted);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:5px}
.stepsf .mk.on{background:var(--chg);color:#fff}
.stepsf .lines{font-family:var(--mono);font-size:15px;line-height:1.9;padding:2px 0 8px}
.stepsf .lines .t{font-family:var(--sans);font-weight:600;font-size:14px}
.stepsf .later{visibility:hidden}
.res{font-weight:700;color:var(--chg)}
.invrow{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:4px 0 2px}
.invrow td{border:1px solid var(--rule);padding:2px 5px;text-align:center;min-width:2.1em}
.invrow td.h{font-family:var(--sans);font-weight:600;color:var(--muted);text-align:right;border:0;padding-right:8px}
.invrow td.one{background:var(--chg);color:#fff;font-weight:700;border-color:var(--chg)}
.pick{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pick label{font-weight:600;font-size:14px}
.pick select{font-size:14px;margin-left:4px}
.calcwrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.calcwrap .left{flex:1 1 460px;min-width:0}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" aria-label="Steps">
      <div id="steps"></div>
      <div class="sidefoot"><div id="selftest"></div><div id="keys"></div></div>
    </nav>
    <main class="main">
      <div class="modhead"><span id="mhGrp"></span><h2 id="mhTitle"></h2><p id="mhSub"></p></div>
      <div class="content" id="view"></div>
      <button id="more" class="more" hidden><span id="moreTxt"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v10M3 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </main>
  </div>
</div>

<script>
"use strict";

/* ===================== elliptic-curve core ===================== */
// CORE-BEGIN
// Points are {x, y} with BigInt coordinates; the point at infinity O is null.
// A curve is y^2 = x^3 + a x + b mod p, with a base point G of order n.

function mod(v, p) { const r = v % p; return r < 0n ? r + p : r; }

// the modular inverse by the extended Euclid algorithm: v * inv(v) = 1 mod p
function inv(v, p) {
  let r0 = p, r1 = mod(v, p), t0 = 0n, t1 = 1n;
  if (r1 === 0n) throw new Error("0 has no inverse");
  while (r1 !== 0n) {
    const q = r0 / r1;
    const r2 = r0 - q * r1; r0 = r1; r1 = r2;
    const t2 = t0 - q * t1; t0 = t1; t1 = t2;
  }
  if (r0 !== 1n) throw new Error("no inverse");
  return mod(t0, p);
}

// the small curve of the slides: y^2 = x^3 + 2x + 2 mod 17, G = (5, 1), 19 points with O
const TOY = { a: 2n, b: 2n, p: 17n, n: 19n, G: { x: 5n, y: 1n } };

// P-256 (FIPS 186-4, appendix D.1.2.3; SEC 2: secp256r1)
const P256 = {
  p: 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn,
  a: 0xffffffff00000001000000000000000000000000fffffffffffffffffffffffcn,   // a = -3 mod p
  b: 0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604bn,
  n: 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n,

function onCurve(C, P) {

// ops lists every step: "double" (D -> 2D), "add" (R + D), "take" (R was O, so R = D).
function mulTrace(C, k, P) {
  const ops = [];

  while (k > 0n) {

      R = add(C, R, D);

      ops.push({ t: "double", i: i, P: D, Q: D, R: D2 });

function ecdh(C, a, b) {
  const A = mul(C, a, C.G), B = mul(C, b, C.G);
  return { A: A, B: B, SA: mul(C, a, B), SB: mul(C, b, A) };

// ElGamal on a curve: C1 = kG, C2 = M + kQ; decrypt: M = C2 - d C1
function egEncrypt(C, M, Q, k) {

function egDecrypt(C, C1, C2, d) {
  const S = mul(C, d, C1);
  return { S: S, negS: neg(C, S), M: add(C, C2, neg(C, S)) };

    const x3 = s * s - 2 * P.x, y3 = s * (P.x - x3) - P.y;

function selfTest() {
  const fails = [];

  const C = TOY;

  const pts = curvePoints(C).map(P => P.x + "," + P.y).join(" ");
  if (pts !== SLIDE_POINTS) fails.push("the 18 points");
  // 1G .. 19G, step by step and by double and add
  let R = null;
  for (let k = 1; k <= 19; k++) {
    R = add(C, R, C.G);
    const want = k === 19 ? null : pt(SLIDE_MULT[k - 1][0], SLIDE_MULT[k - 1][1]);
    if (!samePoint(R, want)) { fails.push(k + "G"); break; }
    if (!samePoint(mul(C, BigInt(k), C.G), want)) { fails.push("double and add " + k + "G"); break; }
  }
  // doubling G on the slides: s = 13, 2G = (6, 3); the paper exercise: G + 2G = (10, 6) with s = 2
  const d = addInfo(C, C.G, C.G);
  if (d.numM !== 9n || d.denInv !== 9n || d.s !== 13n || d.x3Raw !== 159n || d.y3Raw !== -14n || !samePoint(d.R, pt(6, 3))) fails.push("2G step by step");

  if (t.s !== 2n || !samePoint(t.R, pt(10, 6))) fails.push("G + 2G");
  // the slide "double and add": 100G = 4G + 32G + 64G = (9, 16), 6 doublings and 2 additions
  const tr = mulTrace(C, 100n, C.G);
  if (!samePoint(tr.R, pt(9, 16)) || tr.ops.filter(o => o.t === "double").length !== 6 || tr.ops.filter(o => o.t === "add").length !== 2) fails.push("100G");
  // ECDH on the slide: a = 3, b = 10: A = (10, 6), B = (7, 11), shared (13, 10)
  const e = ecdh(C, 3n, 10n);
  if (!samePoint(e.A, pt(10, 6)) || !samePoint(e.B, pt(7, 11)) || !samePoint(e.SA, pt(13, 10)) || !samePoint(e.SB, pt(13, 10))) fails.push("ECDH a = 3, b = 10");
  // ElGamal on the slide: d = 7, Q = (0, 6), M = (13, 10), k = 4: C1 = (3, 1), C2 = (5, 1), dC1 = (7, 6)
  const Q = mul(C, 7n, C.G), en = egEncrypt(C, pt(13, 10), Q, 4n), de = egDecrypt(C, en.C1, en.C2, 7n);
  if (!samePoint(Q, pt(0, 6)) || !samePoint(en.C1, pt(3, 1)) || !samePoint(en.C2, pt(5, 1)) || !samePoint(de.S, pt(7, 6)) || !samePoint(de.M, pt(13, 10))) fails.push("ElGamal example");
  // invariants on the small curve: every sum is on the curve, P + Q = Q + P, all ECDH pairs agree
  const all = curvePoints(C).concat([null]);
  outer: for (const P1 of all) for (const P2 of all) {
    const s1 = add(C, P1, P2);
    if (!onCurve(C, s1) || !samePoint(s1, add(C, P2, P1))) { fails.push("a sum off the curve"); break outer; }
  }
  for (let a = 1n; a < 19n; a++) for (let b = 1n; b < 19n; b++) {
    const x = ecdh(C, a, b);
    if (!samePoint(x.SA, x.SB) || x.SA === null) { fails.push("ECDH " + a + ", " + b); a = 19n; break; }
  }

  const rp = x => ({ x: x, y: Math.sqrt(realF(x)) });
  const ra = realAdd(rp(-0.7), rp(0.2));
  if (Math.abs(ra.third.x - 1.848) > 0.001 || Math.abs(ra.third.y - 3.465) > 0.001) fails.push("the real curve");
  // P-256: G on the curve, 2G and 3G from OpenSSL, nG = O, RFC 5903 section 8.1
  const P = P256;
  if (!onCurve(P, P.G)) fails.push("P-256 G");
  if (!samePoint(mul(P, 2n, P.G), P256_2G) || !samePoint(mul(P, 3n, P.G), P256_3G)) fails.push("P-256 2G, 3G");

  return fails;
}

// the multiples of G on the small curve: MULT[k] = kG for k = 1..19 (MULT[19] = O)
const MULT = [null];
for (let k = 1; k <= 19; k++) MULT.push(mulSlow(TOY, k, TOY.G));
const multOf = P => { for (let k = 1; k <= 19; k++) if (samePoint(MULT[k], P)) return k; return -1; };

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
const MINUS = "−";
const fmt = v => (v < 0 ? MINUS + String(-v) : String(v));               // numbers with a real minus sign
const ps = P => P === null ? "O" : "(" + P.x + ", " + P.y + ")";          // a point as text
const psH = P => P === null ? '<span style="font-family:var(--sans);font-weight:700">O</span>' : ps(P);   // the same in HTML (O is not a zero)
const fr = v => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(3);            // a real number
const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* the 17 x 17 grid of the small curve. o: { c: cell size, marks: [{P, col, label, big}], path: [points], vline: x, mirror, click, sel } */
function gridSVG(o) {
  const c = o.c, ML = 26, MT = 12, MR = 12, MB = 24;
  const W = ML + 16 * c + MR, H = MT + 16 * c + MB;
  const gx = x => ML + Number(x) * c, gy = y => MT + (16 - Number(y)) * c;
  let s = '<svg class="grid17" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="y^2 = x^3 + 2x + 2 mod 17">' +
    "<defs>" + mk("gm_chg", "var(--chg)") + "</defs>";
  for (let i = 0; i <= 16; i++) {
    if (c >= 20 || i % 2 === 0) {
      s += '<text class="tick" x="' + gx(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + i + "</text>";
      s += '<text class="tick" x="' + (ML - 9) + '" y="' + (gy(i) + 3.5) + '" text-anchor="end">' + i + "</text>";
    }
  }
  if (o.click) for (let x = 0; x <= 16; x++) for (let y = 0; y <= 16; y++)
    s += '<rect class="hit" data-action="cell" data-x="' + x + '" data-y="' + y + '" x="' + (gx(x) - c / 2) + '" y="' + (gy(y) - c / 2) + '" width="' + c + '" height="' + c + '" rx="3"/>';
  if (o.sel) s += '<rect class="sel" x="' + (gx(o.sel.x) - c / 2 + 1) + '" y="' + (gy(o.sel.y) - c / 2 + 1) + '" width="' + (c - 2) + '" height="' + (c - 2) + '" rx="3"/>';
  for (let x = 0; x <= 16; x++) for (let y = 0; y <= 16; y++)
    s += '<circle class="gd" cx="' + gx(x) + '" cy="' + gy(y) + '" r="1.5" pointer-events="none"/>';
  if (o.mirror) s += '<line x1="' + (gx(0) - 6) + '" y1="' + (MT + 7.5 * c) + '" x2="' + (gx(16) + 6) + '" y2="' + (MT + 7.5 * c) + '" stroke="var(--chg)" stroke-width="1.6" stroke-dasharray="6 4" pointer-events="none"/>';
  if (o.vline !== undefined) s += '<line x1="' + gx(o.vline) + '" y1="' + (MT - 4) + '" x2="' + gx(o.vline) + '" y2="' + (gy(0) + 6) + '" stroke="var(--chg)" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>';
  if (o.path && o.path.length > 1) {
    for (let i = 1; i < o.path.length; i++) {
      const A = o.path[i - 1], B = o.path[i], last = i === o.path.length - 1;
      s += '<line x1="' + gx(A.x) + '" y1="' + gy(A.y) + '" x2="' + gx(B.x) + '" y2="' + gy(B.y) + '" stroke="var(--chg)" stroke-width="' + (last ? 2.6 : 1.4) + '" opacity="' + (last ? 1 : 0.55) + '"' + (last ? ' marker-end="url(#gm_chg)"' : "") + ' pointer-events="none"/>';
    }
  }
  for (const P of curvePoints(TOY)) s += '<circle class="pt" cx="' + gx(P.x) + '" cy="' + gy(P.y) + '" r="' + (c * 0.24) + '" pointer-events="none"/>';
  for (const m of (o.marks || [])) {
    if (m.P === null) continue;
    const r = c * (m.big ? 0.42 : 0.34);
    s += '<circle cx="' + gx(m.P.x) + '" cy="' + gy(m.P.y) + '" r="' + r + '" fill="' + (m.fill || "var(--surface)") + '" stroke="' + m.col + '" stroke-width="' + (m.big ? 3 : 2.4) + '" pointer-events="none"/>';
    if (m.label) {
      const right = Number(m.P.x) < 12, up = m.up !== undefined ? m.up : true;
      s += '<text class="mlab halo" x="' + (gx(m.P.x) + (right ? r + 3 : -r - 3)) + '" y="' + (gy(m.P.y) + (up ? -r + 1 : r + 10)) + '" text-anchor="' + (right ? "start" : "end") + '" fill="' + m.col + '" pointer-events="none">' + esc(m.label) + "</text>";
    }
  }
  return s + "</svg>";
}

function realPoints() {

}

/* the address: #N is a step, #N.M a tab or a card of the step

  } else {

window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });

function setSmall(f, v) {
  if (!Number.isFinite(v)) return;
  app[f] = clampInt(Math.round(v), 1, 18);
  const inp = view.querySelector('input[data-field="' + f + '"]');
  if (inp && +inp.value !== app[f]) inp.value = app[f];
  updateL0();
}
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "zoom") zoomIn();
  else if (a === "tab1") { app.tab1 = el.dataset.t; render(); }
  else if (a === "eve-show") { app.eveOpen = true; updateL0(); }
  else if (a === "dec" || a === "inc") setSmall(el.dataset.f, app[el.dataset.f] + (a === "inc" ? 1 : -1));
  else if (a === "rand") { const r = new Uint32Array(1); crypto.getRandomValues(r); setSmall(el.dataset.f, 1 + r[0] % 18); }
  else if (a === "bigrand") {
    const b = new Uint8Array(32); let v;
    do { crypto.getRandomValues(b); v = BigInt("0x" + Array.from(b, x => x.toString(16).padStart(2, "0")).join("")); } while (v < 1n || v >= P256.n);
    app[el.dataset.f] = v.toString(16).padStart(64, "0");
    const inp = view.querySelector('input[data-field="' + el.dataset.f + '"]'); if (inp) inp.value = app[el.dataset.f];
    updateBig();
  }
  else if (a === "rmode") {
    app.rmode = el.dataset.m;
    const st = MODE_START[app.rmode]; app.rP = Object.assign({}, st[0]); if (st[1]) app.rQ = Object.assign({}, st[1]);
    render();
  }
  else if (a === "mode3") { app.mode3 = el.dataset.m; render(); }
  else if (a === "cell") { app.cell = { x: +el.dataset.x, y: +el.dataset.y }; renderL2Body(); }
  else if (a === "mk-reset") { app.mk = 1; renderL2Body(); }
  else if (a === "mk-prev") { app.mk = Math.max(1, app.mk - 1); renderL2Body(); }
  else if (a === "mk-next") { app.mk = Math.min(19, app.mk + 1); renderL2Body(); }
  else if (a === "mk-set") { app.mk = +el.dataset.k; renderL2Body(); }
  else if (a === "ds-reset") { app.dstep = 0; renderL2Body(); }
  else if (a === "ds-prev") { app.dstep = Math.max(0, app.dstep - 1); renderL2Body(); }
  else if (a === "ds-next" || a === "ds-all") {
    const n = mulTrace(TOY, BigInt(app.dk), TOY.G).ops.length;
    app.dstep = a === "ds-all" ? n : Math.min(n, app.dstep + 1); renderL2Body();
  }
  else if (a === "dop") { app.dstep = +el.dataset.q + 1; originFromStep3(); goTo(3); }
  else if (a === "pre") { app.p4 = +el.dataset.p; app.q4 = +el.dataset.q; app.s4 = 1; app.origin4 = null; render(); }
  else if (a === "s4-reset") setS4(1);
  else if (a === "s4-prev") setS4(app.s4 - 1);
  else if (a === "s4-next") setS4(app.s4 + 1);
  else if (a === "s4-all") setS4(4);
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = e.target.value;
  if (f === "a" || f === "b" || f === "d" || f === "k") { const n = parseInt(v, 10); if (n >= 1 && n <= 18) { app[f] = n; updateL0(); } }
  else if (f === "bigA" || f === "bigB") { app[f] = v; updateBig(); }
  else if (f === "dk") { const n = parseInt(v, 10); if (n >= 1 && n <= 1048575) setDk(n); }
});
view.addEventListener("change", e => {
  const f = e.target.dataset.field;
  if (f === "m") { app.m = +e.target.value; updateL0(); }
  else if (f === "p4" || f === "q4") { app[f] = +e.target.value; app.s4 = 1; app.origin4 = null; render(); }
  else if (f === "a" || f === "b" || f === "d" || f === "k") setSmall(f, parseInt(e.target.value, 10));
  else if (f === "dk") { setDk(parseInt(e.target.value, 10)); e.target.value = app.dk; }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Enter" && tag === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
  else if (app.level === 2 && app.mode3 !== "pts" && (e.key === "n" || e.key === " ")) {
    e.preventDefault();
    if (app.mode3 === "mult") app.mk = Math.min(19, app.mk + 1);
    else app.dstep = Math.min(mulTrace(TOY, BigInt(app.dk), TOY.G).ops.length, app.dstep + 1);
    renderL2Body();
  }
  else if (app.level === 2 && app.mode3 !== "pts" && e.key === "p") {
    if (app.mode3 === "mult") app.mk = Math.max(1, app.mk - 1); else app.dstep = Math.max(0, app.dstep - 1);
    renderL2Body();
  }
  else if (app.level === 3 && (e.key === "n" || e.key === " ")) { e.preventDefault(); setS4(app.s4 + 1); }
  else if (app.level === 3 && e.key === "p") setS4(app.s4 - 1);
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
// the menus of steps 1 and 4: each of the 18 points once, sorted by x and y
if (BY_XY.length !== 18 || new Set(BY_XY).size !== 18 || BY_XY.indexOf(-1) >= 0) SELF_FAILS.push("the point menus");
readHash();
render();
window.addEventListener("hashchange", () => { if (location.hash !== hashStr() || app.scrollTo) { readHash(); render(); } });
</script>
</body>
