<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hash function explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#C62828;
  --flip:#E53935; --flip-bg:#FDE3E2;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  /* role colours = the slide colours of the hash lecture: Alice sIndigo, Mallory/Eve sPink, message sViolet,
     secret value sAmber, Bob/server sTeal, digest sBrown; the end marker 0x80 orange as on the slides */
  --alice:#5C6BC0; --alice-bg:#E6E8F6;
  --eve:#EC407A; --eve-ink:#C2185B; --eve-bg:#FCE2EB;
  --msg-b:#7E57C2; --msg-bg:#EBE5F5;
  --sec-b:#FFB300; --sec-bg:#FFE8B2;
  --bob:#26A69A; --bob-ink:#00796B; --bob-bg:#DEF2F0;
  --dg-b:#8D6E63; --dg-bg:#EEE9E7;
  --mark-b:#EB5A14; --mark-bg:#FCE3D6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E; --flip:#FF6F61; --flip-bg:#4A1D1B;
    --const-b:#4A5663; --const-bg:#222C37;
    --alice:#9FA8DA; --alice-bg:#23284A; --eve:#F48FB1; --eve-ink:#F48FB1; --eve-bg:#3A1A26;
    --msg-b:#B39DDB; --msg-bg:#2A2142; --sec-b:#FFCA28; --sec-bg:#3A2E10;
    --bob:#4DB6AC; --bob-ink:#80CBC4; --bob-bg:#12302D; --dg-b:#BCAAA4; --dg-bg:#2E2522;
    --mark-b:#FF8A50; --mark-bg:#3D2414;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=text]{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:6px;padding:6px 9px;font-size:15px}
input[type=range]{accent-color:var(--chg)}
.mono{font-family:var(--mono)}

/* frame (the same as the other explorers) */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h3{margin:0}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btns button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.gate{border:2px dashed var(--chg);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--surface)}
.gate b{display:block;font-size:15px;margin-bottom:4px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}

/* roles */
.r-msg{border-color:var(--msg-b)!important;background:var(--msg-bg)}
.r-dg{border-color:var(--dg-b)!important;background:var(--dg-bg)}
.r-sec{border-color:var(--sec-b)!important;background:var(--sec-bg)}
.r-bob{border-color:var(--bob)!important;background:var(--bob-bg)}
.r-alice{border-color:var(--alice)!important;background:var(--alice-bg)}
.r-eve{border-color:var(--eve)!important;background:var(--eve-bg)}
.r-mark{border-color:var(--mark-b)!important;background:var(--mark-bg)}
.r-neu{border-color:var(--const-b)!important;background:var(--const-bg)}
.who-a{color:var(--alice);font-weight:700} .who-b{color:var(--bob-ink);font-weight:700} .who-m{color:var(--eve-ink);font-weight:700}

/* the black box row */
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}
.vbox{border:1.5px solid;border-radius:8px;padding:6px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.vbox small{font-size:12px;color:var(--muted);font-weight:600}
.vbox .v{font-family:var(--mono);font-size:14px;font-weight:600;word-break:break-all}
.mech{background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex:none}
.arr{font-size:20px;color:var(--muted);flex:none}

/* bit grids */
.bytes{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:6px}
.byte{display:flex;flex-direction:column;align-items:center;gap:2px}
.byte .ch{font-family:var(--mono);font-size:12.5px;font-weight:600;min-height:18px}
.byte .bits{display:flex;gap:1px}
.bc{width:15px;height:20px;border:1px solid var(--msg-b);background:var(--msg-bg);font-family:var(--mono);font-size:11px;line-height:18px;text-align:center;padding:0;border-radius:2px;color:var(--ink)}
.bc:hover{box-shadow:0 0 0 2px var(--chg)}
.bc.fl{background:var(--flip);border-color:var(--flip);color:#fff;font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(32,16px);gap:2px;margin-top:6px}
.dgrid span{width:16px;height:16px;border:1px solid var(--dg-b);background:var(--dg-bg);font-family:var(--mono);font-size:10px;line-height:14px;text-align:center;border-radius:2px;color:var(--muted)}
.dgrid span.d{background:var(--flip);border-color:var(--flip);color:#fff;font-weight:700}
.count{font-size:22px;font-weight:700;font-family:var(--mono)}
.count b{color:var(--flip)}
.hist{display:flex;align-items:flex-end;gap:3px;height:200px;margin-top:30px;border-bottom:1.5px solid var(--const-b);position:relative;max-width:760px}
.hist .bar{flex:1;background:var(--dg-b);border-radius:3px 3px 0 0;position:relative;min-height:0}
.hist .bar i{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-style:normal;font-size:10.5px;color:var(--muted)}
.hlab{display:flex;gap:3px;max-width:760px}
.hlab span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.half{position:absolute;top:0;bottom:0;border-left:2px dashed var(--chg)}
.half em{position:absolute;top:-22px;left:-30px;font-size:11.5px;font-weight:700;color:var(--chg);font-style:normal;white-space:nowrap}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.stats b{font-family:var(--mono)}

/* padding */
.padrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.padrow input[type=range]{width:420px}
.blk{margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.blk .lbl{width:70px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:3px}
.cells{display:grid;grid-template-columns:repeat(16,30px);gap:2px}
.cells span{height:22px;border:1.2px solid var(--const-b);background:var(--surface);font-family:var(--mono);font-size:11.5px;line-height:20px;text-align:center;border-radius:3px}
.cells span.m{border-color:var(--msg-b);background:var(--msg-bg)}
.cells span.e{border-color:var(--mark-b);background:var(--mark-bg);font-weight:700}
.cells span.z{color:var(--muted)}
.cells span.l{border-color:var(--const-b);background:var(--const-bg);font-weight:600}
.sum{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:8px}
.sum .jump{color:var(--chg)}
.chain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-top:6px}
.st{border:1.5px solid;border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:12px;line-height:1.35;min-width:96px}
.st small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--muted)}
.st b{font-size:13px}
.fbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fbox .mech{padding:6px 12px}
.fbox .vbox{padding:3px 8px;font-size:12px}

/* update() */
.feed{display:flex;height:26px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden;max-width:760px;margin-top:6px}
.feed span{height:100%;border-right:1px solid var(--surface)}
.feed .p0{background:var(--msg-b)} .feed .p1{background:var(--msg-bg)}
.feed .rest{flex:1;background:var(--sunken)}
.bufcells{display:grid;grid-template-columns:repeat(32,18px);gap:2px;margin-top:6px}
.bufcells span{height:18px;border:1px dashed var(--const-b);border-radius:2px}
.bufcells span.f{border:1px solid var(--msg-b);background:var(--msg-bg)}
.log{font-family:var(--mono);font-size:13px;line-height:1.6;margin-top:8px;max-height:220px;overflow:auto;background:var(--sunken);border-radius:8px;padding:8px 12px}
.log .fx{color:var(--chg);font-weight:700}
.words{font-family:var(--mono);font-size:14px;font-weight:600}
.words span{display:inline-block;margin-right:8px}
.words span.new{background:var(--chg-bg);box-shadow:0 0 0 2px var(--chg);border-radius:3px}

/* rounds */
.two{display:flex;gap:22px;flex-wrap:wrap}
.run h4{margin:0 0 4px;font-size:13.5px}
.wrow{display:flex;align-items:center;gap:6px;margin:1px 0}
.wrow b{width:14px;font-family:var(--mono);font-size:12.5px}
.wrow .ws{display:grid;grid-template-columns:repeat(32,11px);gap:1px}
.wrow .ws span{width:11px;height:13px;border-radius:1.5px;background:var(--const-bg);border:1px solid var(--const-b)}
.wrow .ws span.o{background:var(--ink);border-color:var(--ink)}
.wrow .ws span.d{background:var(--flip);border-color:var(--flip)}
.wrow .hx{font-family:var(--mono);font-size:12px;color:var(--muted);width:66px}
.blockbits{display:grid;grid-template-columns:repeat(64,10px);gap:1px;margin-top:6px}
.blockbits button{width:10px;height:12px;padding:0;border-radius:1.5px;border:1px solid var(--msg-b);background:var(--msg-bg)}
.blockbits button.one{background:var(--msg-b)}
.blockbits button.pad{border-color:var(--const-b);background:var(--const-bg)}
.blockbits button.pad.one{background:var(--muted)}
.blockbits button.fl{outline:2.5px solid var(--flip);outline-offset:0;z-index:1}
.rctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.rctl input[type=range]{width:420px}
.rlab{font-family:var(--mono);font-weight:700;font-size:16px;min-width:13em}
svg.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}

/* Merkle tree, length extension, sponge */
svg.tree text{font-size:11px}
.cells span.s{border-color:var(--sec-b);background:var(--sec-bg);font-weight:600}
.sgrid{display:grid;gap:2px;margin-top:4px}
.sgrid.rate{grid-template-columns:repeat(17,26px)}
.sgrid.cap{grid-template-columns:repeat(8,26px)}
.sgrid span{height:20px;font-family:var(--mono);font-size:10.5px;line-height:18px;text-align:center;border-radius:3px;border:1.2px solid}
.sgrid.rate span{border-color:var(--msg-b);background:var(--surface)}
.sgrid.cap span{border-color:var(--const-b);background:var(--const-bg);color:var(--muted)}
.sgrid span.c{background:var(--chg-bg);border-color:var(--chg)}
.sgrid span.o{background:var(--dg-bg);border-color:var(--dg-b);border-width:2.5px;font-weight:700}
.ratel{color:var(--msg-b)} .capl{color:var(--muted)}

/* guessing */
.prog{height:12px;border-radius:6px;background:var(--sunken);overflow:hidden;max-width:560px;margin:8px 0 4px}
.prog span{display:block;height:100%;background:var(--eve)}
.big{font-family:var(--mono);font-size:20px;font-weight:700}
.estrow{font-family:var(--mono);font-size:14.5px;font-weight:600;line-height:1.8}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" aria-label="Steps">
      <div id="steps"></div>
      <div class="sidefoot"><div id="selftest"></div><div id="keys"></div></div>
    </nav>
    <main class="main">
      <div class="modhead"><span id="mhGrp"></span><h2 id="mhTitle"></h2><p id="mhSub"></p></div>
      <div class="content" id="view"></div>
      <button id="more" class="more" hidden><span id="moreTxt"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v10M3 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </main>
  </div>
</div>

<script>
"use strict";

/* ===================== SHA-256 (FIPS 180-4), 32-bit words with >>> 0 ===================== */
// CORE-BEGIN
const K = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
// the start state: the first 32 bits of the fractional parts of the square roots of the first 8 primes
const IV = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }

// the compression function f: state (8 words) + one 64-byte block at data[off] -> new state.
// trace (optional) gets the 8 words A..H after every one of the 64 rounds, before the old state is added.
function compress(state, data, off, trace) {
  const W = new Array(64);
  for (let t = 0; t < 16; t++) {
    const i = off + 4 * t;
    W[t] = ((data[i] << 24) | (data[i + 1] << 16) | (data[i + 2] << 8) | data[i + 3]) >>> 0;
  }
  for (let t = 16; t < 64; t++) {
    const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
    const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);

/* ---------- small helpers for drawing ---------- */
function gateHTML(i) {
  const t = L();
  if (app.open[i] || !t.gate[i]) return "";
  return '<div class="gate"><b>' + t.gate[i] + '</b><button class="dark" data-action="opengate">' + t.gateBtn + "</button></div>";
}
function vbox(role, label, value, id) {
  return '<div class="vbox ' + role + '"><small>' + label + '</small><span class="v"' + (id ? ' id="' + id + '"' : "") + ">" + value + "</span></div>";
}
function digestGridHTML(d, ref) {
  let s = '<div class="dgrid">';
  for (let i = 0; i < 256; i++) {
    const bit = (d[i >> 3] >> (7 - (i & 7))) & 1;
    const diff = ref && (((ref[i >> 3] >> (7 - (i & 7))) & 1) !== bit);
    s += '<span class="' + (diff ? "d" : "") + '">' + bit + "</span>";
  }
  return s + "</div>";
}

/* ---------- step 1: the black box ---------- */
function fmtBytes(n) {
  const sp = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return sp + (lang === "pl" ? " B" : (n === 1 ? " byte" : " bytes"));
}

// the snapshots of the SHA3-256 sponge: after every XOR of a block, after every permutation, and the squeeze
function spongeSteps(msg) {
  const st = new Uint8Array(200), p = sha3Pad(msg, 0x06), steps = [{ st: st.slice(), ch: new Set(), kind: "start" }];
  for (let off = 0, b = 1; off < p.length; off += RATE, b++) {
    const ch = new Set();
    for (let i = 0; i < RATE; i++) { const v = st[i] ^ p[off + i]; if (v !== st[i]) ch.add(i); st[i] = v; }
    steps.push({ st: st.slice(), ch: ch, kind: "xor", b: b });
    const before = st.slice(); keccakF(st);
    const ch2 = new Set(); for (let i = 0; i < 200; i++) if (st[i] !== before[i]) ch2.add(i);
    steps.push({ st: st.slice(), ch: ch2, kind: "perm", b: b });
  }
  steps.push({ st: st.slice(), ch: new Set(), kind: "squeeze" });
  return { steps: steps, blocks: p.length / RATE, padded: p };
}

  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "bbx10") { if (app.bbA.length * 10 <= 1e7) app.bbA = app.bbA.repeat(10); updateBB(); }
  else if (a === "bbbook") { app.bbA = "All work and no play. ".repeat(47663).slice(0, 1048576); updateBB(); }
  else if (a === "bbreset") { app.bbA = "Pay Bob 100 GBP"; updateBB(); }
  else if (a === "opengate") { app.open[app.level] = true; render(); }
  else if (a === "flip") { const k = +el.dataset.k; if (app.flips.has(k)) app.flips.delete(k); else app.flips.add(k); update0(); }
  else if (a === "unflip") { app.flips.clear(); update0(); }
  else if (a === "flipex") {
    app.msg = "Pay Bob 100 GBP"; app.flips = new Set([8 * 8 + 4]);
    const inp = view.querySelector('input[data-field="msg1"]'); if (inp) inp.value = app.msg; update0();
  }
  else if (a === "histrun") { app.histRun = !app.histRun; drawHist(); if (app.histRun) histLoop(); }
  else if (a === "hist1000") { histAdd(1000); drawHist(); }
  else if (a === "histreset") { app.histRun = false; histReset(); drawHist(); }
  else if (a === "pabc") { app.padCustom = "abc"; update1(); }
  else if (a === "pfox") { app.padCustom = null; app.padLen = 79; const inp = view.querySelector('input[data-field="len"]'); if (inp) inp.value = 79; update1(); }
  else if (a === "piece") piece3(el.dataset.n);
  else if (a === "dig3") {
    const buf = app.h3.bufLen, r = app.h3.digest();
    app.dig3 = hex(r.digest);
    app.log3.push('<span class="fx">' + esc(L().logDig(buf, r.runs)) + "</span>");
    update2();
  }
  else if (a === "reset3") { reset3(); update2(); }
  else if (a === "pick") { app.flipByte = +el.dataset.b; app.flipBit = +el.dataset.j; update3(); }
  else if (a === "play4") play4();
  else if (a === "search") startSearch();
  else if (a === "k2") { app.k2 = +el.dataset.k; view.querySelectorAll('[data-action="k2"]').forEach(b => b.classList.toggle("on", +b.dataset.k === app.k2)); drawHundred(); }
  else if (a === "hundred") startHundred();
  else if (a === "mkleaf") { app.mkSel = +el.dataset.i; app.mkEdit = null; update6(); }
  else if (a === "mkundo") { app.mkEdit = null; update6(); }
  else if (a === "leshow") { app.leShow = !app.leShow; update7(); }
  else if (a === "splong") { app.spMsg = "Alice's long message. ".repeat(10).slice(0, 200); app.spPhase = 0; const inp = view.querySelector('input[data-field="spmsg"]'); if (inp) inp.value = app.spMsg; update8(); }
  else if (a === "spnext") { app.spPhase++; update8(); }
  else if (a === "spprev") { if (app.spPhase > 0) app.spPhase--; update8(); }
  else if (a === "spreset") { app.spPhase = 0; update8(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = e.target.value;
  if (f === "bbA") { if (!e.target.readOnly) { app.bbA = v; updateBB(); } }
  else if (f === "bbB") { app.bbB = v; updateBB(); }
  else if (f === "msg1") { if (utf8(v).length <= 32) { app.msg = v; app.flips.clear(); update0(); } }
  else if (f === "len") { app.padCustom = null; app.padLen = +v; update1(); }
  else if (f === "msg4") { app.msg4 = v; if (app.flipByte > 63) app.flipByte = 0; update3(); }
  else if (f === "round") { app.round = +v; update3(); }
  else if (f === "k") { app.k = +v; searchRun++; app.search = null; update4(); }
  else if (f === "mkedit") { app.mkEdit = v; update6(); }
  else if (f === "leextra") { app.leExtra = v; update7(); }
  else if (f === "spmsg") { app.spMsg = v; app.spPhase = 0; update8(); }
  else if (f === "shlen") { app.shLen = +v; update8(); }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && tag === "BUTTON") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); if (app.level < NSTEPS - 1) goTo(app.level + 1); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); if (app.level > 0) goTo(app.level - 1); }
});

/* ---------- start ---------- */
// #4 opens step 4; #5.2 opens step 5 scrolled to its 2nd card
function readHash() {
  const hm = /^#(\d)(?:\.(\d+))?$/.exec(location.hash);
  if (hm && +hm[1] >= 1 && +hm[1] <= NSTEPS) { app.level = +hm[1] - 1; app.card = hm[2] ? Math.max(1, +hm[2]) : 1; }
}
// a link from a slide opens the right step even in a tab that is already open
window.addEventListener("hashchange", () => { if (location.hash !== hashStr()) { readHash(); render(); view.scrollTop = 0; scrollToCard(); } });
readHash();
render();
requestAnimationFrame(scrollToCard);
setTimeout(() => slowTests(f => { SELF_FAILS = SELF_FAILS.concat(f); SLOW_DONE = true; selfLine(); }), 300);
</script>
