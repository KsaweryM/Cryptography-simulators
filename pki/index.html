<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificates and PKI explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B; --ok-bg:#E3F4E8; --bad-bg:#FBE7E5;
  --exec:#43A047;
  /* roles, the same as on the slides of Lectures 9 to 12 */
  --alice-b:#5C6BC0; --alice-bg:#E8EAF6;
  --mal-b:#EC407A;   --mal-bg:#FCE4EC;
  --bob-b:#26A69A;   --bob-bg:#E0F2F1;
  --ca-b:#8D6E63;    --ca-bg:#EFEBE9;
  --pub-b:#7E57C2;   --pub-bg:#EDE7F6;
  --prv-b:#FFB300;   --prv-bg:#FFF5D6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E; --ok-bg:#15301E; --bad-bg:#3A1A1C; --exec:#66BB6A;
    --alice-b:#8C9EFF; --alice-bg:#1F2340; --mal-b:#F06292; --mal-bg:#3A1A26; --bob-b:#4DB6AC; --bob-bg:#12302D;
    --ca-b:#BCAAA4; --ca-bg:#2E2522; --pub-b:#B39DDB; --pub-bg:#2A2142; --prv-b:#FFCA28; --prv-bg:#3A2E10;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E; --ok-bg:#15301E; --bad-bg:#3A1A1C; --exec:#66BB6A;
  --alice-b:#8C9EFF; --alice-bg:#1F2340; --mal-b:#F06292; --mal-bg:#3A1A26; --bob-b:#4DB6AC; --bob-bg:#12302D;
  --ca-b:#BCAAA4; --ca-bg:#2E2522; --pub-b:#B39DDB; --pub-bg:#2A2142; --prv-b:#FFCA28; --prv-bg:#3A2E10;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea,select{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}

/* frame: the same as the other explorers */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards, explanation box, buttons */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h3{margin:0}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button{font-size:13.5px;padding:5px 11px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btns button{font-size:13.5px;padding:5px 11px}
.schwrap{overflow-x:auto}
.v{font-family:var(--mono);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.mark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:700;font-size:14px;flex:none}
.mark.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.mark.bad{background:var(--bad-bg);color:var(--bad);border:1.5px solid var(--bad)}
.mark.na{background:var(--sunken);color:var(--muted);border:1.5px solid var(--rule)}
.mark.wait{background:var(--sunken);color:var(--muted);border:1.5px dashed var(--muted)}
.ul{margin:4px 0 0;padding-left:20px}
.ul li{margin:3px 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two>.card{margin-bottom:0}
.gap{height:14px}
a.inl{color:var(--focus)}

/* roles: one colour per role in every step; a box in a role colour has a border in that colour */
.r-alice.r-alice{border-color:var(--alice-b);background:var(--alice-bg)}
.r-mal.r-mal{border-color:var(--mal-b);background:var(--mal-bg)}
.r-bob.r-bob{border-color:var(--bob-b);background:var(--bob-bg)}
.r-ca.r-ca{border-color:var(--ca-b);background:var(--ca-bg)}
.r-pub.r-pub{border-color:var(--pub-b);background:var(--pub-bg)}
.r-prv.r-prv{border-color:var(--prv-b);background:var(--prv-bg)}
.r-neu.r-neu{border-color:var(--rule);background:var(--surface)}

/* step 1: the story */
.story{border-left-color:var(--chg)}
.storyhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.storyk{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;border:1.5px solid var(--muted);background:none}
.dots button.on{background:var(--chg);border-color:var(--chg)}
.dots button.past{background:var(--muted)}
.storyhead .btns{margin:0}
.sttext{min-height:3.2em}
.sch{position:relative;width:900px;height:452px}
.zone{position:absolute;border-radius:14px;background:var(--sunken);border:1.5px solid var(--rule)}
.zone.net{background:none;border:2px dashed var(--muted)}
.zh{position:absolute;left:12px;top:8px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.zone.net .zh{top:auto;bottom:8px;left:0;right:0;justify-content:center;font-size:13.5px;color:var(--muted);flex-direction:column;gap:0;text-align:center;line-height:1.25}
.zone.net .zh small{font-weight:500;font-size:12px}
.obj{position:absolute;border:1.5px solid;border-radius:10px;padding:7px 11px;color:var(--ink);font-size:13px}
.obj .nh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.obj .kv{font-family:var(--mono);font-size:14px;font-weight:600;word-break:break-all;line-height:1.3}
.obj small{display:block;font-size:12px;color:var(--muted)}
.obj.new{outline:3px solid var(--chg);outline-offset:3px}
.obj.dim{opacity:.35}
.ncard{background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:8px 11px;font-size:13px}
.ncard .line{font-family:var(--mono);font-size:13px;word-break:break-all}
.seal{display:flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:8px;border:1.5px solid;font-size:12px;font-weight:600}
.seal .mono{font-weight:500;font-size:11.5px}
.vres{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.arrowsvg{position:absolute;left:0;top:0;pointer-events:none}
.bigp{position:absolute;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.bigp svg{display:block;margin:0 auto 2px}
.tryrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tryrow textarea{width:100%;height:48px;resize:vertical;font-size:13px}
.sigbox{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--muted)}
.diffc{background:var(--chg-bg);color:var(--chg);font-weight:700;border-radius:2px}

/* step 2: the certificate viewer */
.cv{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.tree{font-size:13.5px}
.trow{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;border-radius:6px;background:none;padding:3px 8px;line-height:1.35}
.trow:hover{background:var(--sunken)}
.trow .tl{font-weight:600;white-space:nowrap}
.trow .tv{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow.sel{background:var(--chg-bg);box-shadow:inset 3px 0 0 var(--chg)}
.trow.sel .tv{color:var(--ink)}
.trow .crit{font-size:10.5px;font-weight:700;color:var(--chg);border:1px solid var(--chg);border-radius:4px;padding:0 4px;margin-left:2px}
.part{border:1.5px solid var(--rule);border-radius:10px;padding:6px 6px 8px;margin-bottom:8px}
.part>.ph{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 2px;display:flex;justify-content:space-between;gap:8px}
.part.r-ca{border-width:1.5px}
.cv>.card{position:sticky;top:0}
.fdet td.mono{word-break:break-word}
.fdet h4{margin:0 0 4px;font-size:16px}
.fdet .what{font-size:14px;margin:6px 0 10px}
.fdet table{border-collapse:collapse;font-size:13px;width:100%}
.fdet td{padding:3px 8px 3px 0;vertical-align:top}
.fdet td:first-child{color:var(--muted);font-weight:600;white-space:nowrap;width:1%}
.fdet td.mono{word-break:break-all;overflow-wrap:anywhere}
.hexd{font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow:auto;max-height:420px;background:var(--sunken);border-radius:8px;padding:8px 10px;white-space:pre}
.hexd .off{color:var(--muted);user-select:none}
.hexd span.h{background:var(--chg-bg);color:var(--ink);border-radius:2px}
.hexd span.hh{background:var(--chg);color:#fff;border-radius:2px}
.hexd span.fl{outline:2px solid var(--bad);outline-offset:-1px;border-radius:2px}
.fprow{font-family:var(--mono);font-size:13.5px;word-break:break-all;line-height:1.6}
.fprow .d{color:var(--bad);font-weight:700;background:var(--bad-bg);border-radius:2px}
.inlin{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.inlin input{width:70px}

/* step 3 and 4: chains and checks */
.chainwrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.pile .mini{border:1.5px solid;border-radius:8px;padding:5px 9px;margin-bottom:6px;font-size:12.5px}
.mini b{font-size:13px}
.mini .mono{font-size:11.5px;color:var(--muted)}
.mini.unused{opacity:.55;border-style:dashed}
.mini.inpath{box-shadow:0 0 0 2px var(--chg)}
.store{border:1.5px solid var(--ca-b);border-radius:10px;padding:8px;margin-top:10px}
.store h4,.pile h4{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ccard{border:1.5px solid;border-radius:10px;padding:8px 12px;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;max-width:640px}
.ccard .ch{grid-column:1/3;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard .k{color:var(--muted);font-weight:600;white-space:nowrap}
.ccard .x{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.ccard .x.hl{background:var(--chg-bg);border-radius:3px;padding:0 3px}
.ccard .x.badx{background:var(--bad-bg);color:var(--bad);border-radius:3px;padding:0 3px}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1.5px solid}
.link{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 6px 26px;padding:4px 0 4px 16px;border-left:3px solid var(--rule)}
.link .up{font-size:18px;color:var(--muted);margin-left:-28px;width:16px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 3px;border-radius:999px;border:1.5px solid var(--rule);background:var(--surface)}
.chk .mark{width:18px;height:18px;font-size:12px}
.chk.cur{border-color:var(--exec);box-shadow:0 0 0 2px var(--exec)}
.chk.bad{border-color:var(--bad)}
.anchor{border:2px solid var(--ca-b);border-radius:10px;padding:6px 12px;font-size:13.5px;display:flex;align-items:center;gap:8px;max-width:640px}
.anchor.bad{border-color:var(--bad);background:var(--bad-bg)}
.anchor.cur{box-shadow:0 0 0 3px var(--exec)}
.verdict{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict .mono{font-weight:500;font-size:13px}
.scn{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.scn button{font-size:13px;padding:4px 10px}
.scn button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctab{border-collapse:collapse;width:100%;font-size:13.5px}
.ctab td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.ctab td.n{width:32px;font-family:var(--mono);font-weight:700;color:var(--muted)}
.ctab td.m{width:34px}
.ctab td.t{width:200px;font-weight:600}
.ctab tr.first td{background:var(--bad-bg)}
.ctab tr.cur td{box-shadow:inset 0 0 0 9999px rgba(67,160,71,.10)}
.ctab .det{font-size:13px}
.ctab .det .mono{font-size:12.5px}
.sanl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sanl span{font-family:var(--mono);font-size:12.5px;padding:1px 7px;border-radius:5px;border:1.5px solid}
.sanl span.yes{border-color:var(--ok);background:var(--ok-bg)}
.sanl span.no{border-color:var(--rule)}
.inputs{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted)}
.inputs input{font-size:14.5px;width:220px}
.inputs input[type=date]{width:170px}

/* step 5: revocation */
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.rstep{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.rstep:last-child{border-bottom:0}
.rstep .mark{margin-top:1px}
.rstep.skip{opacity:.45}
.doc{border:1.5px solid;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0}
.doc table{border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.doc td{padding:1px 10px 1px 0}
.doc tr.hit td{background:var(--chg-bg);font-weight:700}
.ctl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.ctl .grp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:5px 11px}
.tgl[aria-pressed="true"]{background:var(--mal-bg);border-color:var(--mal-b)}
.wire{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;flex-wrap:wrap}
.wire .ln{flex:1;min-width:40px;height:0;border-top:2.5px solid var(--muted)}
.wire .ln.cut{border-top:2.5px dashed var(--mal-b)}
.res{border-collapse:collapse;font-size:13.5px;margin-top:6px}
.res th{font-size:12px;color:var(--muted);text-align:left;padding:4px 10px;border-bottom:1px solid var(--rule)}
.res td{padding:5px 10px;border-bottom:1px solid var(--rule)}
.res tr.cur td{background:var(--chg-bg)}

/* step 6: the handshake */
.hs{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;row-gap:5px;max-width:860px}
.hs .who{font-weight:700;text-align:center;border:1.5px solid;border-radius:10px;padding:6px 4px;font-size:13.5px}
.hs .life{border-left:2px solid var(--rule);margin:0 auto;width:0;height:100%}
.msg{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;width:100%;text-align:left}
.msg .bar{flex:1;height:0;border-top:2px solid var(--muted);position:relative}
.msg .lbl{border:1.5px solid var(--rule);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.msg .lbl small{font-weight:500;color:var(--muted);font-size:12px}
.msg.l2r .bar::after{content:"";position:absolute;right:-2px;top:-6px;border:5px solid transparent;border-left:8px solid var(--muted)}
.msg.r2l .bar::before{content:"";position:absolute;left:-2px;top:-6px;border:5px solid transparent;border-right:8px solid var(--muted)}
.msg:hover .lbl{box-shadow:0 0 0 2px var(--chg)}
.msg.on .lbl{border-color:var(--chg);box-shadow:0 0 0 2px var(--chg);background:var(--chg-bg)}
.msg.dim{opacity:.35}
.msg.cert .lbl{border-color:var(--bob-b)}
.msg.ccert .lbl{border-color:var(--alice-b)}
.enc{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;justify-content:center}
.cvbytes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cvbytes .seg{border:1.5px solid;border-radius:8px;padding:5px 9px;font-size:12.5px}
.cvbytes .seg b{display:block;font-size:12px}
.cvbytes .seg .mono{font-size:12px;word-break:break-all}

/* step 7: pinning */
.ptab{border-collapse:collapse;width:100%;font-size:13.5px}
.ptab th{font-size:12px;color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule)}
.ptab td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ptab td.mono{font-size:12px;word-break:break-all}
.pinbox{display:flex;flex-direction:column;gap:4px;border:1.5px solid;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
.pinbox .mono{font-size:12.5px;word-break:break-all}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
  .cv,.two,.rv,.chainwrap{grid-template-columns:1fr}
}
</style>
</head>

    story: [

      "A third party that Alice already trusts, the certificate authority Trusty CA, checks that the key is really Bob's and signs the bytes <span class=\"mono\">name=bob.example;key=2fa8…3c40</span> with its private key. Alice got the public key of Trusty CA earlier, not over this network (step 3 shows how).",

/* ---------- step 6: certificates in TLS 1.3 ---------- */

}

function update5() {
  const t = L(), g = renderGen;

      '<div class="sigbox" style="margin-top:8px">openssl x509 -in leaf.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | base64</div>';

  const v = e.target.value;
  if (f === "card") { app.tryCard = v; update0(); }
  else if (f === "fbyte") { app.flipByte = Math.max(0, +v || 0); const hd = document.getElementById("hexd"); if (hd) hd.innerHTML = bytesView(CERT[CERTS2[app.c2]], fieldsOf(CERT[CERTS2[app.c2]]).find(x => x.id === app.f2).node); update1(); }
  else if (f === "fbit") { app.flipBit = Math.max(0, Math.min(7, +v || 0)); update1(); }
  else if (f === "host") { app.host4 = v; update3(); }
  else if (f === "date") { app.date4 = v; update3(); }
  else if (f === "rev") { app.rev4 = e.target.checked; update3(); }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && tag === "BUTTON") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (app.level === 0 && (e.key === "n" || e.key === "N" || e.key === " ")) { e.preventDefault(); storyGo(app.story + 1); return; }
  if (app.level === 0 && (e.key === "p" || e.key === "P")) { e.preventDefault(); storyGo(app.story - 1); return; }
  if (app.level === 5 && (e.key === "n" || e.key === "N" || e.key === " ")) { e.preventDefault(); hsGo(app.hs + 1); return; }
  if (app.level === 5 && (e.key === "p" || e.key === "P")) { e.preventDefault(); hsGo(app.hs - 1); return; }
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
});
function readHash() {
  const m = /^#(\d)(?:\.(\d+))?(?:\.([a-z_0-9]+))?$/.exec(location.hash);
  if (!m || +m[1] < 1 || +m[1] > NSTEPS) return;
  app.level = +m[1] - 1;
  const s = m[2] ? +m[2] : null;
  if (s !== null) {
    if (app.level === 0) app.story = Math.max(1, Math.min(STORY_N, s));
    else if (app.level === 1) app.c2 = Math.max(0, Math.min(CERTS2.length - 1, s - 1));
    else if (app.level === 2) app.s3 = Math.max(0, Math.min(SCN3.length - 1, s - 1));
    else if (app.level === 3) { app.s4 = Math.max(0, Math.min(SCN4.length - 1, s - 1)); app.host4 = null; }
    else if (app.level === 5) app.hs = Math.max(1, Math.min(HS_N, s));
    else if (app.level === 6) app.pin = s === 1 ? "cert" : "key";
  }
  if (app.level === 1 && m[3]) {
    app.f2 = m[3];
    // a field Bob's Lecture 9 certificate does not have: show it in the first certificate that has it
    if (!fieldsOf(CERT[CERTS2[app.c2]]).find(f => f.id === app.f2)) {
      const i = CERTS2.findIndex(k => fieldsOf(CERT[k]).find(f => f.id === app.f2));
      if (i >= 0) app.c2 = i; else app.f2 = "subject";
    }
  }
}
window.addEventListener("hashchange", () => { if (location.hash !== hashStr()) { readHash(); render(); } });

/* ---------- start: render first, then the self-test (WebCrypto is asynchronous) ---------- */
readHash();
render();
setTimeout(() => selfTest().then(f => { SELF = f; showSelf(); }, e => { SELF = ["exception: " + e.message]; showSelf(); }), 0);
</script>
