<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diffie-Hellman explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  /* role colours = the slides of the Diffie-Hellman lecture (Beamer colours in brackets) */
  --pub-b:#90A4AE; --pub-bg:#ECEFF1; --pub-t:#37474F;   /* public values: neutral (nLine, nFill, nInk) */
  --sec-b:#FFB300; --sec-bg:#FFECBF; --sec-t:#A06A00;   /* secrets a, b, x, k, m (sAmber, sAmber!25, sAmberText) */
  --sh-b:#FFB300;  --sh-bg:#FFDB80;                     /* the shared secret: the same amber, stronger fill */
  --msg-b:#7E57C2; --msg-bg:#ECE6F6;                    /* the message (sViolet) */
  --mal-b:#EC407A; --mal-bg:#FCE2EB; --mal-t:#C2185B;   /* the attackers, Eve and Mallory (sPink, sPinkText) */
  --ctx-b:#8D6E63; --ctx-bg:#EEE9E7;                    /* ciphertext C1, C2 (sBrown) */
  --al:#5C6BC0; --al-t:#5C6BC0; --bo:#26A69A; --bo-t:#00796B;   /* Alice (sIndigo), Bob (sTeal, sTealText) */
  --good-b:#2FA84F; --good-bg:#E3F4E8;                  /* "it worked" banners, not a role */
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --pub-b:#B0BEC5; --pub-bg:#263238; --pub-t:#CFD8DC; --sec-b:#FFCA28; --sec-bg:#3A2E10; --sec-t:#FFCA28;
    --sh-b:#FFCA28; --sh-bg:#5A4410; --msg-b:#B39DDB; --msg-bg:#2A2142;
    --mal-b:#F48FB1; --mal-bg:#3B1828; --mal-t:#F48FB1; --ctx-b:#BCAAA4; --ctx-bg:#2E2522;
    --al:#7986CB; --al-t:#9FA8DA; --bo:#26A69A; --bo-t:#80CBC4; --good-b:#4CC877; --good-bg:#15301E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --pub-b:#B0BEC5; --pub-bg:#263238; --pub-t:#CFD8DC; --sec-b:#FFCA28; --sec-bg:#3A2E10; --sec-t:#FFCA28;
  --sh-b:#FFCA28; --sh-bg:#5A4410; --msg-b:#B39DDB; --msg-bg:#2A2142;
  --mal-b:#F48FB1; --mal-bg:#3B1828; --mal-t:#F48FB1; --ctx-b:#BCAAA4; --ctx-bg:#2E2522;
  --al:#7986CB; --al-t:#9FA8DA; --bo:#26A69A; --bo-t:#80CBC4; --good-b:#4CC877; --good-bg:#15301E;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px 7px;font-size:14px}
input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.mono{font-family:var(--mono)}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.schwrap{overflow-x:auto}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btns .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rnd{position:absolute;top:5px;right:6px;padding:2px 5px;line-height:0;border-radius:5px;color:var(--ink)}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:8px 14px;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:11.5px;font-weight:400;opacity:.8}
.opnow{font-family:var(--mono);background:var(--chg);color:#fff;border-radius:5px;padding:2px 8px}

/* roles: one colour per role, the same in every step */
.role-pub{border-color:var(--pub-b);background:var(--pub-bg)}
.role-sec{border-color:var(--sec-b);background:var(--sec-bg)}
.role-sh{border-color:var(--sh-b);background:var(--sh-bg)}
.role-msg{border-color:var(--msg-b);background:var(--msg-bg)}
.role-mal{border-color:var(--mal-b);background:var(--mal-bg)}
.role-ctx{border-color:var(--ctx-b);background:var(--ctx-bg)}
.half.good{border-color:var(--good-b)}

/* the schematics */
.sch{position:relative;color:var(--ink)}
.sch .arrows{position:absolute;left:0;top:0;pointer-events:none}
.ab{position:absolute}
.chip{position:absolute;border:1.5px solid;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden}
.chip small{font-weight:400;color:var(--muted);font-size:12px}
.chip .v{display:block;font-family:var(--mono);font-size:15px;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v b{font-size:17px}
.chip label{display:block}
.chip input{display:block;margin-top:3px;width:100%}
.chip .inrow{display:flex;gap:6px;align-items:center;margin-top:3px}
.chip .inrow input{margin-top:0;flex:1 1 auto;min-width:0}
.chip.tiny .v{font-size:14px}
.person{position:absolute;display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.ava{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.ava.mal{background:var(--mal-b);color:#fff}
.ava.al{background:var(--al);color:#fff}
.ava.bo{background:var(--bo);color:#fff}
.person.al{color:var(--al-t)}
.person.bo{color:var(--bo-t)}
.person.mal{color:var(--mal-t)}
.person small{font-weight:400;font-size:12.5px;color:var(--muted)}
.sbox{position:absolute}
.wlbl{position:absolute;font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:4px}
.evecard{position:absolute;border:1.5px solid var(--mal-b);background:var(--surface);border-radius:8px;overflow:hidden;font-size:13px}
.evecard .eh{background:var(--mal-b);color:#fff;font-weight:600;padding:3px 10px;display:flex;align-items:center;gap:6px}
/* dark theme: the light pink header and avatar need dark text */ @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evecard .eh,:root:not([data-theme="light"]) .ava.mal{color:#2B0A18}} :root[data-theme="dark"] .evecard .eh,:root[data-theme="dark"] .ava.mal{color:#2B0A18}
.evecard .eb{padding:0 12px 4px;font-family:var(--mono);font-size:13.5px;line-height:22px;background:repeating-linear-gradient(var(--surface) 0 21px,var(--rule) 21px 22px)}
.evecard .eb .no{color:var(--muted)}
.banner{margin-top:8px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:14.5px;border:1.5px solid}
.banner.good{border-color:var(--good-b);background:var(--good-bg)}
.banner.bad{border-color:var(--mal-b);background:var(--mal-bg)}
.banner.neutral{border-color:var(--rule);background:var(--sunken)}
.todo{opacity:.22;transition:opacity .25s}
.mfaded{opacity:1;transition:opacity .25s}
.pgfield{display:flex;gap:10px;align-items:flex-end;margin-top:4px}
.pgfield label{font-size:12.5px;font-weight:600}
.pgfield input{display:block;margin-top:2px}
.stamp{display:inline-block;font-size:11px;font-weight:700;color:var(--mal-b);border:1.5px solid var(--mal-b);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.stamp.ok{color:var(--ok);border-color:var(--ok)}

/* step 2: the clock and the table of powers */
.clockrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.clock{display:block;flex:none}
.clock .ring{fill:none;stroke:var(--rule);stroke-width:2}
.clock .nd{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}
.clock .nd.on{fill:var(--pub-bg);stroke:var(--pub-b);stroke-width:2}
.clock .nd.cur{fill:var(--chg);stroke:var(--chg)}
.clock .nt{font-family:var(--mono);font-size:12.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.clock .nt.on{fill:var(--ink);font-weight:600}
.clock .nt.cur{fill:#fff;font-weight:700}
.clock .ch{stroke:var(--muted);stroke-width:1.4;fill:none;opacity:.55}
.clock .ch.last{stroke:var(--chg);stroke-width:2.6;opacity:1}
.clock .ctr{font-family:var(--mono);font-size:22px;font-weight:700;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round}
.clock .ctrs{font-family:var(--sans);font-size:12.5px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:5px}
.clock .aring{fill:none;stroke:var(--pub-t);stroke-width:2.5;stroke-dasharray:4 3}
.clockside{flex:1 1 380px;min-width:340px}
.bigeq{font-family:var(--mono);font-size:22px;margin:6px 0}
.bigeq b{color:var(--chg)}
.ptable{border-collapse:collapse;font-family:var(--mono);font-size:13px;margin-top:6px}
.ptable td{border:1px solid var(--rule);padding:2px 0;text-align:center;min-width:2.6em}
.ptable td.lbl{font-family:var(--sans);font-weight:600;font-size:12.5px;text-align:right;padding:2px 8px;border:0;min-width:0;white-space:nowrap}
.ptable tr.ex td{color:var(--muted);font-size:12px}
.ptable td.on{background:var(--pub-bg)}
.ptable td.cur{background:var(--chg);color:#fff;font-weight:700}
.ptable td.rep{background:var(--chg-bg)}
.ptable td.isA{box-shadow:inset 0 0 0 2px var(--pub-t)}
.ptable td.click{cursor:pointer}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ctl input[type=range]{width:220px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.half{border:1.5px solid var(--rule);border-radius:9px;padding:10px 14px}
.half h4{margin:0 0 6px;font-size:14.5px}
.tries{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-family:var(--mono);font-size:12.5px}
.try{padding:1px 6px;border-radius:4px;background:var(--sunken)}
.try.hit{background:var(--good-bg);outline:1.5px solid var(--good-b);font-weight:700}
.rtable{border-collapse:collapse;font-size:13.5px;margin-top:6px}
.rtable th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:3px 12px 3px 0;border-bottom:1px solid var(--rule)}
.rtable td{padding:4px 12px 4px 0;font-family:var(--mono);border-bottom:1px solid var(--rule)}
.rtable td.r{text-align:right}
.rtable td.x{color:var(--chg);font-weight:700}
.bar{display:inline-block;height:10px;background:var(--pub-b);border-radius:3px;vertical-align:middle}

/* step 4: ElGamal */
.eg{display:grid;grid-template-columns:300px minmax(44px,1fr) 270px minmax(44px,1fr) 300px;align-items:start;min-width:958px;max-width:1150px}
.harr{height:2.4px;background:var(--ctx-b);position:relative;margin:342px 10px 0 4px}
.harr::after{content:"";position:absolute;right:-2px;top:-5.5px;border:6.5px solid transparent;border-left:10px solid var(--ctx-b);border-right:0}
.egcol{display:flex;flex-direction:column;gap:0}
.egcol .chip,.egcol .person,.egcol .evecard{position:relative}
.egcol .box{width:100%}
.down{text-align:center;color:var(--muted);font-size:17px;line-height:22px;height:22px}
.pair{font-family:var(--mono);font-size:22px;font-weight:600}
.ctx{border:1.5px solid var(--ctx-b);background:var(--ctx-bg);border-radius:8px;padding:8px 12px;margin-top:290px}
.calc{font-family:var(--mono);font-size:14px;line-height:1.9}
.calc .cr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.calc .cn{font-family:var(--sans);font-weight:600;color:var(--muted);font-size:12.5px;width:1.5em}
.mark{padding:0 5px;border-radius:4px;border:1.5px solid}
.inl{display:inline-flex;gap:6px;align-items:center}
.inl input{width:7em}
.realbox{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--muted)}

/* step 5: square-and-multiply */
.bits{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}
.bit{display:inline-block;width:20px;height:26px;line-height:26px;text-align:center;font-family:var(--mono);font-size:13px;border-radius:3px;background:var(--sunken);color:var(--muted)}
.bit.one{background:var(--ink);color:var(--surface)}
.bit.cur{box-shadow:0 0 0 2.5px var(--chg)}
.bit.done{opacity:.45}
.optable{border-collapse:collapse;font-size:13.5px;margin-top:8px}
.optable th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:3px 14px 3px 0;border-bottom:1px solid var(--rule)}
.optable td{padding:3px 14px 3px 0;font-family:var(--mono);border-bottom:1px solid var(--rule);white-space:nowrap}
.optable tr.todo2 td{color:var(--muted);opacity:.45}
.optable tr.cur td{background:var(--chg-bg)}
.optable tr.cur td.opc{color:var(--chg);font-weight:700}
.optable td.ell{text-align:center;color:var(--muted)}
.pwin{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pwin label{font-size:12.5px;font-weight:600}
.pwin input{display:block;margin-top:2px;width:12em}
.cmp{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px;margin-top:6px}
.cmp b{font-family:var(--mono)}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
  .two{grid-template-columns:1fr}
}
/* every box filled with a role colour has a border in that role colour (doubled class: wins over .chip, .half, .mark, .legend span) */
.role-pub.role-pub{border-color:var(--pub-b)}
.role-sec.role-sec{border-color:var(--sec-b)}
.role-sh.role-sh{border-color:var(--sh-b)}
.role-msg.role-msg{border-color:var(--msg-b)}
.role-mal.role-mal{border-color:var(--mal-b)}
.role-ctx.role-ctx{border-color:var(--ctx-b)}
.ptable td.on{border:1.5px solid var(--pub-b)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">

function modPow(base, exp, m) {

function selfTest() {

  d = dhExchange(RFC3526_P, RFC3526_G, bigA, bigB);

  const r6 = reuseAttack(RFC3526_P, textToNumber(T6_FIRST), T6_C2_FIRST, T6_C2_SECOND);

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function parseNum(s) { s = String(s).trim(); return /^[0-9]+$/.test(s) ? BigInt(s) : null; }
/* a big number: the first digits, then the length */
function fmt(v) {
  if (v === null || v === undefined) return "?";
  const s = v.toString();
  return s.length <= 14 ? s : s.slice(0, 8) + "…" + " (" + L().digits(s.length) + ")";
}
const small = v => v.toString().length <= 6;
/* "5<sup>6</sup> mod 23 = 8" with numbers when they are small, with the names when they are big */
function powEq(bn, en, b, e, m, r) {
  if (small(b) && small(e) && small(m)) return b + "<sup>" + e + "</sup> mod " + m + " = <b>" + fmt(r) + "</b>";
  return bn + "<sup>" + en + "</sup> mod p = <b>" + fmt(r) + "</b>";
}
const supTxt = s => esc(s).replace(/\^(-?1|[a-zA-Z0-9]+)/g, "<sup>$1</sup>");

/* the public numbers and secrets of step 1, checked */
function params() {
  const t = L(), f = app.f, er = {};
  const p = parseNum(f.p), g = parseNum(f.g), a = parseNum(f.a), b = parseNum(f.b);
  if (p === null) er.p = t.errNum;
  else if (p !== RFC3526_P) {
    if (p < 5n) er.p = t.errPsmall;
    else if (p > SMALL_P_MAX) er.p = t.errPbig;
    else if (!isPrimeSmall(p)) er.p = t.errPrime(p.toString());
  }
  const ok = !er.p;
  const hi = ok ? p - 2n : null;
  if (g === null) er.g = t.errNum; else if (ok && (g < 2n || g > hi)) er.g = t.errG(fmt(hi));
  const chk = (k, v, name) => { if (v === null) er[k] = t.errNum; else if (ok && (v < 1n || v > hi)) er[k] = t.errRange(name, fmt(hi)); };
  chk("a", a, "a"); chk("b", b, "b");
  return { p: p, g: g, a: a, b: b, er: er, bad: Object.keys(er).length > 0 };
}
/* a secret in 1 .. p-2 (or a message in 1 .. p-1) */
function extra(name, P, msg) {
  const t = L(), v = parseNum(app.f[name]);
  if (v === null) return { v: null, er: t.errNum };
  if (P.bad) return { v: v, er: null };
  const hi = msg ? P.p - 1n : P.p - 2n;
  if (v < 1n || v > hi) return { v: v, er: t.errRange(name === "k2" ? "k'" : name, fmt(hi)) };
  return { v: v, er: null };
}
function randBelow(n) {   // a random number in 1 .. n
  const bytes = new Uint8Array(Math.ceil(n.toString(2).length / 8) + 8);
  crypto.getRandomValues(bytes);
  let r = 0n;
  for (const x of bytes) r = r * 256n + BigInt(x);
  return r % n + 1n;
}

  const c2 = egEncrypt(P.p, P.g, y, M2.v, kSecond);
  const at = reuseAttack(P.p, M.v, c.C2, c2.C2);
  const ss = small(P.p);
  const pr = cc => "(" + esc(fmt(cc.C1)).replace(/ \(.*/, "") + ", " + esc(fmt(cc.C2)).replace(/ \(.*/, "") + ")";
  let h = '<div class="cr"><span class="cn"></span><span>M = ' + esc(fmt(M.v)) + ' <span class="note">(known)</span> → <span class="mark role-ctx">' + pr(c) + "</span></span></div>" +
    '<div class="cr"><span class="cn"></span><span>M2 = ? → <span class="mark role-ctx">' + pr(c2) + "</span> " + '<span class="note">(' + t.second + ")</span></span></div>" +
    (c2.C1 === c.C1 ? '<div class="cr"><span class="cn"></span><span class="badline" style="font-family:var(--sans)">' + t.sameC1 + "</span></div>" : "") +
    '<div class="cr"><span class="cn">1.</span><span>' + supTxt(t.rs1) + " = " + (ss ? c.C2 + " × " + at.M1inv + " mod " + P.p + " = " : "") + "<b>" + esc(fmt(at.mask)) + "</b></span></div>" +
    '<div class="cr"><span class="cn">2.</span><span>' + supTxt(t.rs2) + " = " + (ss ? c2.C2 + " × " + at.maskInv + " mod " + P.p + " = " : "") + '<b class="mark role-msg">' + esc(fmt(at.M2)) + "</b></span></div>";
  const ok = at.M2 === M2.v;
  h += '<div class="cr"><span class="cn"></span><span class="' + (ok ? "badline" : "okline") + '" style="font-family:var(--sans)">' + (ok ? t.rsOk : t.rsBad) + "</span></div>";
  if (lang === "pl") h = h.replace("(known)", "(znana)");
  setHTML("e_reuse", h);
}

/* ---------- frame, navigation ---------- */
const RENDER = [render0, render1, render2, render3, render4, render5];
const UPDATE = [update0, update1, update2, update3, update4, update5];
function buildSide() {
  const t = L();
  document.getElementById("steps").innerHTML = t.steps.map((s, i) =>
    '<button class="step' + (i < app.level ? " past" : "") + '" data-step="' + i + '" aria-pressed="' + (i === app.level) + '">' +
    '<span class="gnum">' + (i + 1) + "</span><span><b>" + s[0] + "</b><small>" + s[1] + "</small></span></button>").join("");
}
function stopTimers() {
  if (app.playing) { clearInterval(app.playing); app.playing = null; }
  if (app.eve && app.eve.timer) { clearTimeout(app.eve.timer); app.eve.running = false; }
}
function render() {
  const t = L();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("home").textContent = "← " + t.home;
  document.getElementById("keys").textContent = t.keys;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const st = document.getElementById("selftest");
  st.textContent = SELF_FAILS.length ? t.selfBad(SELF_FAILS.join(", ")) : t.selfOk;
  st.className = SELF_FAILS.length ? "badt" : "okt";
  buildSide();
  document.getElementById("mhGrp").textContent = t.stepOf(app.level + 1);
  document.getElementById("mhTitle").textContent = t.steps[app.level][0];
  document.getElementById("mhSub").textContent = t.steps[app.level][1];
  const ex = t.explain[app.level];
  view.innerHTML = '<div class="fade"><div class="explain"><b>' + ex[0] + "</b>" + supTxt(ex[1]) + "</div>" + RENDER[app.level]() + "</div>";
  UPDATE[app.level]();
  fitSch();
  if (app.level === 1) renderT3(-1);
  if (app.level === 5 && app.real6) showReal6();
  document.getElementById("moreTxt").textContent = t.moreBelow;
  updateMore();
  if (location.hash !== hashStr()) { try { history.replaceState(null, "", hashStr()); } catch (e) {} }
}
/* the address of the current view: #N, #2.2 for step 2 with the four searches open, #4.2 for step 4 with "the same message twice" open */
function hashStr() { return "#" + (app.level + 1) + ((app.level === 1 && app.t3open) || (app.level === 3 && app.twiceOpen) ? ".2" : ""); }
function goTo(level) {
  stopTimers();
  if (app.level === 1 && level !== 1) app.t3 = app.t3 && app.t3.every(r => r.tries) ? app.t3 : null;
  if (level === 4 && app.level !== 4) setPowFrom(app.pw.origin || "gA");
  app.level = level;
  render();
  view.scrollTop = 0;
}
function zoomIn() { if (app.level < 5) { if (app.level + 1 === 4) app.pw.origin = "gA"; goTo(app.level + 1); } }
function zoomOut() { if (app.level > 0) goTo(app.level - 1); }

/* ---------- events ---------- */
const view = document.getElementById("view");
/* "more below" button: shown while part of the page is still below the screen */
function scroller() { return view.scrollHeight > view.clientHeight + 1 ? view : document.scrollingElement; }
function updateMore() {
  const b = document.getElementById("more");
  if (!b) return;
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => {
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", () => { fitSch(); updateMore(); });
/* the fixed-width schematics shrink to fit a narrow screen (no horizontal scrollbar) */
function fitSch() {
  view.querySelectorAll(".schwrap > .sch, .schwrap > .eg").forEach(el => {
    const natural = el.classList.contains("eg") ? 958 : parseInt(el.style.width, 10);
    const avail = el.parentElement.clientWidth;
    el.style.zoom = avail > 0 && avail < natural ? (avail / natural).toFixed(3) : "";
  });
}
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });

const PRESETS = {
  slides: { p: "23", g: "5", a: "6", b: "15" },
  book: { p: "353", g: "3", a: "97", b: "233" },   // Stallings, the Diffie-Hellman example
};
function setField(f, v) {
  app.f[f] = v;
  const i = view.querySelector('input[data-field="' + f + '"]');
  if (i) i.value = v;
}
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (a === "zoom") goTo(+el.dataset.to);
  else if (a === "pow") { setPowFrom(el.dataset.k); stopTimers(); app.level = 4; render(); view.scrollTop = 0; }
  else if (a === "preset") {
    const pr = el.dataset.p;
    if (pr === "real") { app.f.p = RFC3526_P.toString(); app.f.g = "2"; app.f.a = rand256(); app.f.b = rand256(); }
    else Object.assign(app.f, PRESETS[pr]);
    render();
  }
  else if (a === "rand") {
    const P = params();
    if (P.er.p) return;
    const f = el.dataset.f;
    setField(f, (P.p === RFC3526_P ? BigInt(rand256()) : randBelow(P.p - 2n)).toString());
    UPDATE[app.level]();
  }
  else if (a === "setg") { setField("g", el.dataset.g); UPDATE[app.level](); }
  else if (a === "ce") { app.clockE += +el.dataset.d; update1(); }
  else if (a === "setE") { app.clockE = +el.dataset.e; update1(); }
  else if (a === "play") {
    if (app.playing) { clearInterval(app.playing); app.playing = null; el.textContent = L().play; return; }
    const P = params(); if (P.bad) return;
    const maxE = Math.min(Number(P.p) - 1, 60);
    if (app.clockE >= maxE) app.clockE = 0;
    el.textContent = L().stop;
    app.playing = setInterval(() => {
      app.clockE++; update1();
      if (app.clockE >= maxE) { clearInterval(app.playing); app.playing = null; const b = document.getElementById("c_play"); if (b) b.textContent = L().play; }
    }, 450);
  }
  else if (a === "eve1") eveStep();
  else if (a === "eveall") eveAll();
  else if (a === "evereset") { if (app.eve && app.eve.timer) clearTimeout(app.eve.timer); app.eve = null; renderEve(); }
  else if (a === "t3run") runTask3();
  else if (a === "t3open") { app.t3open = true; render(); scrollToT3(); }
  else if (a === "twiceopen") { app.twiceOpen = true; render(); scrollToTwice(); }
  else if (a === "malsend") { app.malSend = el.dataset.v; render(); }
  else if (a === "mal") { app.malStep = Math.max(1, Math.min(4, app.malStep + +el.dataset.d)); render(); }
  else if (a === "reuse") { app.reuseSame = el.dataset.v === "1"; view.querySelectorAll('[data-action="reuse"]').forEach(b => b.setAttribute("aria-pressed", String(b === el))); update5(); }
  else if (a === "real6") { app.real6 = true; showReal6(); }
  else if (a === "pw0") { app.pw.step = 0; update4(); }
  else if (a === "pwd") { app.pw.step += +el.dataset.d; update4(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  if (f === "seal") { app.seal = e.target.checked; update2(); return; }
  if (f === "check") { app.check = e.target.checked; update2(); return; }
  if (f === "mmsg") { app.mmsg = e.target.value; update2(); return; }
  if (f === "clockE") { app.clockE = +e.target.value; update1(); return; }
  if (f === "pwb" || f === "pwe" || f === "pwm") { app.pw[f.slice(2)] = e.target.value; app.pw.origin = null; app.pw.step = 0; update4(); return; }
  if (f in app.f) {
    app.f[f] = e.target.value;
    if (app.level === 1) { if (app.playing) { clearInterval(app.playing); app.playing = null; } }
    UPDATE[app.level]();
  }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Enter" && tag === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
  else if (app.level === 4 && (e.key === "n" || e.key === " ")) { e.preventDefault(); app.pw.step++; update4(); }
  else if (app.level === 4 && e.key === "p") { app.pw.step--; update4(); }
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
function scrollToT3() { const c = document.getElementById("t3card"); if (c) c.scrollIntoView({ block: "start" }); }
function scrollToTwice() { const c = document.getElementById("twicecard"); if (c) c.scrollIntoView({ block: "start" }); }
/* #N opens step N; #2.2 opens step 2 with the four searches; #4.2 opens step 4 with "the same message twice" */
function readHash() {
  const m = /^#(\d)(?:\.(\d+))?$/.exec(location.hash);
  if (!m) return false;
  const n = +m[1];
  if (n < 1 || n > 6) return false;
  stopTimers();
  app.level = n - 1;
  app.t3open = app.level === 1 && m[2] === "2";
  app.twiceOpen = app.level === 3 && m[2] === "2";
  if (app.level === 4) setPowFrom("gA");
  return true;
}
window.addEventListener("hashchange", () => {
  if (location.hash !== hashStr() && readHash()) { render(); view.scrollTop = 0; if (app.t3open) scrollToT3(); if (app.twiceOpen) scrollToTwice(); }
});
readHash();
render();
if (app.t3open) scrollToT3();
if (app.twiceOpen) scrollToTwice();
</script>
</body>
