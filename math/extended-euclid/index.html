<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The extended Euclidean algorithm</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --a-b:#2F6FDB; --a-bg:#E5EDFB;
  --b-b:#2FA84F; --b-bg:#E3F4E8;
  --g-b:#E2A60E; --g-bg:#FDF3DC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --a-b:#7FA8F0; --a-bg:#1A2740; --b-b:#4CC877; --b-bg:#15301E; --g-b:#F5C044; --g-bg:#3A2E10;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --a-b:#7FA8F0; --a-bg:#1A2740; --b-b:#4CC877; --b-bg:#15301E; --g-b:#F5C044; --g-bg:#3A2E10;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
a{color:var(--focus)}

/* frame: the same as the simulators */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.v{font-family:var(--mono);font-weight:600}
.why{margin-top:12px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
a.btnlink{display:inline-block;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;font-weight:500}
.tablewrap{overflow-x:auto}

/* inputs */
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.presets button{font-size:13px;padding:4px 10px}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.inrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.chip{display:flex;flex-direction:column;border-radius:8px;padding:6px 10px;border:1.5px solid;font-weight:600;font-size:13.5px}
.chip input{margin-top:4px;width:27em;max-width:100%;font-size:16px;font-weight:600}
.role-a{border-color:var(--a-b);background:var(--a-bg)}
.role-b{border-color:var(--b-b);background:var(--b-bg)}
.role-g{border-color:var(--g-b);background:var(--g-bg)}

/* the table */
.etab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:4px}
.etab th{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:4px 22px 4px 0;border-bottom:1.5px solid var(--rule)}
.etab td{padding:4px 22px 4px 0;white-space:nowrap;border-bottom:1px solid var(--rule)}
.etab tr.start td{color:var(--muted)}
.etab tr.cur td{background:var(--chg-bg)}
.etab tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--chg)}
.etab tr.one td{background:var(--g-bg)}
.etab tr.one td:first-child{box-shadow:inset 3px 0 0 var(--g-b)}
.etab tr.hide td{opacity:.35}
.etab tr.hide td:nth-child(n+4){visibility:hidden}
.etab .ca{color:var(--a-b);font-weight:700}
.etab .cb{color:var(--b-b);font-weight:700}
.etab .tcoef{color:var(--chg);font-weight:700}
.etab td.rr{font-weight:700}
.result{margin-top:12px;font-size:14.5px;line-height:1.8}
.big{font-family:var(--mono);font-size:22px;font-weight:600;margin:4px 0;word-break:break-all}
.bigs{font-size:20px;font-weight:600}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
}
</style>
</head>

<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html#2"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" aria-label="Steps">

    </nav>

    </main>

<script>
"use strict";

/* ===================== the algorithm (BigInt) ===================== */
// CORE-BEGIN
// Euclid's table: a = q * b + r, then (a, b) <- (b, r) until r = 0. The last non-zero remainder is gcd(a, b).
// (The same code as the RSA explorer had in its step 2.)
function euclidRows(a, b) {
  const rows = [];
  while (b !== 0n) {
    const q = a / b, r = a % b;
    rows.push({ a: a, b: b, q: q, r: r });
    a = b; b = r;
  }
  return rows;
}
// extended Euclid: every remainder is written as r = s * a + t * b.
// The two start rows: a = 1 * a + 0 * b and b = 0 * a + 1 * b.
// Each next row = (the row two above) - q * (the row above).
// At the end gcd(a, b) = s * a + t * b (Bezout's identity), and if the gcd is 1,
// t mod a is the inverse of b modulo a.
function extEuclid(a, b) {
  const rows = euclidRows(a, b);
  const mix = [{ r: a, s: 1n, t: 0n }, { r: b, s: 0n, t: 1n }];
  for (const row of rows) {
    const A = mix[mix.length - 2], B = mix[mix.length - 1];
    mix.push({ r: row.r, s: A.s - row.q * B.s, t: A.t - row.q * B.t });
  }
  const last = mix[mix.length - 2];          // the row with the last non-zero remainder
  const g = last.r;
  let d = null;
  if (g === 1n && a > 1n) { d = last.t % a; if (d < 0n) d += a; }
  return { rows: rows, mix: mix, g: g, t: last.t, s: last.s, d: d, lastRow: mix.length - 2 };
}
function modInverse(b, a) { return extEuclid(a, b).d; }
// the slow way, only for the self-test: try d = 0, 1, 2, ... (null if there is none)
function bruteInverse(b, a) {
  for (let d = 0n; d < a; d++) if ((b * d) % a === 1n % a && a > 1n) return d;
  return null;
}
function gcdSlow(a, b) {   // the greatest number that divides both, by trying all of them
  let g = 1n;
  for (let k = 1n; k <= (a > b ? a : b); k++) if (a % k === 0n && b % k === 0n) g = k;
  return g;
}

/* Test values and where they come from (each also recomputed with Python 3.12 pow(b, -1, a) and math.gcd):
   1. Lecture 3 (RSA), the inverse on the slides (formerly the slides "Euclid's algorithm" and "Extended Euclid"):
      gcd(160, 7): 160 = 22*7 + 6, 7 = 1*6 + 1, 6 = 6*1 + 0; 1 = -1*160 + 23*7, the inverse of 7 mod 160 is 23.
   2. The earlier Lecture 3 exercise: the inverse of 23 mod 120 is 47, 1 = -9*120 + 47*23, 5 rows.
   3. Wikipedia "RSA (cryptosystem)", the worked example with Euler's phi: phi = 3120, e = 17, d = 2753.
   4. Lecture 3, the task with two 20-digit primes (Task 5): p = 37908704904578413183, q = 58606630333925820283, e = 65537,
      phi = 2221701454780507748434219819189271757324, d = 1367151349159148221410861819858768950381 (self-test only);
      the preset uses e = 65539: its inverse mod phi is 542111562044734889347717288156286088331.
   5. gcd(18, 12) = 6: no inverse. Fibonacci numbers 89 and 55: 9 rows, the slowest case for their size.
   6. For every 2 <= a <= 100 and 0 <= b < a: the gcd equals the slow gcd, s*a + t*b = gcd, and the inverse
      equals the one found by trying every d (or both say there is none). */
const T4_PHI = 2221701454780507748434219819189271757324n;
const T4_D = 1367151349159148221410861819858768950381n;
const PRESETS = [   // [a, b]
  [160n, 7n],        // the RSA slides
  [120n, 23n],       // inverse 47
  [3120n, 17n],      // Wikipedia: d = 2753
  [T4_PHI, 65539n],  // Lecture 3, phi of Task 5 but e = 65539: the task's d (e = 65537) stays hidden
  [89n, 55n],        // Fibonacci: the most rows
  [18n, 12n],        // gcd 6: no inverse
];

function selfTest() {
  const fails = [];
  // 1. the slides
  const er = euclidRows(160n, 7n).map(r => [r.a, r.b, r.q, r.r].join(" ")).join("|");
  if (er !== "160 7 22 6|7 6 1 1|6 1 6 0") fails.push("Euclid 160, 7");
  const x1 = extEuclid(160n, 7n);
  if (x1.g !== 1n || x1.s !== -1n || x1.t !== 23n || x1.d !== 23n) fails.push("extended Euclid 160, 7");
  // 2. 23 mod 120
  const x2 = extEuclid(120n, 23n);
  if (x2.d !== 47n || x2.t !== 47n || x2.s !== -9n || x2.rows.length !== 5) fails.push("23 mod 120");
  // 3. Wikipedia
  if (modInverse(17n, 3120n) !== 2753n) fails.push("17 mod 3120");
  // 4. the 20-digit key
  if ((37908704904578413183n - 1n) * (58606630333925820283n - 1n) !== T4_PHI || modInverse(65537n, T4_PHI) !== T4_D) fails.push("20-digit key: d");
  if (modInverse(65539n, T4_PHI) !== 542111562044734889347717288156286088331n) fails.push("20-digit key: preset 65539");
  // 5. no inverse; Fibonacci
  const x5 = extEuclid(18n, 12n);
  if (x5.g !== 6n || x5.d !== null || x5.s * 18n + x5.t * 12n !== 6n) fails.push("gcd(18, 12)");
  if (euclidRows(89n, 55n).length !== 9 || modInverse(55n, 89n) !== 34n) fails.push("89, 55");
  // 6. every small pair against the slow way
  outer:
  for (let a = 2n; a <= 100n; a++) {
    for (let b = 0n; b < a; b++) {
      const x = extEuclid(a, b);
      if (x.g !== gcdSlow(a, b) || x.s * a + x.t * b !== x.g) { fails.push("Bezout " + a + ", " + b); break outer; }
      if (x.d !== bruteInverse(b, a)) { fails.push("inverse of " + b + " mod " + a); break outer; }
      if (x.d !== null && (b * x.d) % a !== 1n) { fails.push("check " + b + " mod " + a); break outer; }
    }
  }
  return fails;
}
// CORE-END

/* ===================== texts (EN and PL) ===================== */
const T = {
  en: {
    title: "The extended Euclidean algorithm", home: "Mathematics",
    intro: "Section 7 of the maths contents. Pick a step on the left; step through the rows of the table.",
    stepOf: n => "Step " + n + " of 3 · Mathematics, section 7",
    steps: [["The gcd by repeated division", "Euclid's algorithm, row by row"], ["Keeping s and t", "gcd = s × a + t × b (Bézout)"],
            ["The modular inverse", "read it from the last row"]],
    explain: [
      ["Divide, keep the remainder, repeat", "The greatest common divisor gcd(a, b) is the biggest number that divides both a and b. Euclid's idea: gcd(a, b) = gcd(b, a mod b). Divide a by b, keep the remainder r, and do the same with b and r, until the remainder is 0. The last non-zero remainder is the gcd. Step through the rows."],
      ["Write every remainder as a mix of a and b", "Next to each row we also keep two numbers s and t with r = s × a + t × b. The first two rows are free: a = 1 × a + 0 × b and b = 0 × a + 1 × b. Every next row is the row two above minus q times the row above, the same q as in the division. In the row with the gcd we get gcd(a, b) = s × a + t × b. This is Bézout's identity."],
      ["The inverse of b modulo a", "If gcd(a, b) = 1, the last row says 1 = s × a + t × b. Modulo a the part s × a is 0, so t × b mod a = 1: t is the inverse of b modulo a. In RSA, a is phi, b is e, and the inverse is the private exponent d."]],
    selfOk: "✓ checked against the RSA slides, Wikipedia and a brute-force search", selfBad: f => "✗ self-test failed: " + f,
    moreBelow: "More below", keys: "← / →: step · n / p: next / previous row",
    cardIn: "The two numbers", presets: "examples:",
    preNames: ["160, 7 (the RSA slides)", "120, 23", "3120, 17 (Wikipedia, RSA)", "phi of two 20-digit primes, 65539", "89, 55 (Fibonacci)", "18, 12 (gcd 6)"],
    inA: "a", inB: "b", inLimit: "whole numbers, up to 60 digits",
    errNum: "Type whole numbers from 1 to 60 digits, a ≥ 2 and b ≥ 1.",
    cardEuclid: (a, b) => "Euclid's algorithm: gcd(" + a + ", " + b + ")",
    cardExt: (a, b) => "The extended table: every remainder as s × " + a + " + t × " + b,
    cardInv: (b, a) => "The inverse of " + b + " modulo " + a,
    thRow: "row", thA: "a", thB: "b", thDiv: "a = q × b + r", thR: "r", thMix: "r = s × a + t × b",
    start: "start", stopRow: "remainder 0: stop",
    bReset: "⏮ reset", bPrev: "◀ previous", bNext: "next ▶", bAll: "all rows",
    rowK: (k, N) => "row " + k + " of " + N,
    gcdRes: (a, b, g) => "The last non-zero remainder is " + g + ", so <span class=\"v\">gcd(" + a + ", " + b + ") = " + g + "</span>.",
    gcdOne: "The gcd is 1: a and b are coprime, and b has an inverse modulo a (step 3).",
    gcdNot: g => "The gcd is " + g + ", not 1: b has no inverse modulo a.",
    rowsCount: N => "That took " + N + " " + (N === 1 ? "division" : "divisions") + ".",
    whyGcd: "<b>Why it works.</b> Every number that divides a and b also divides r = a - q × b, and every number that divides b and r also divides a = q × b + r. So the pairs (a, b) and (b, r) have the same common divisors, and the same gcd. <b>Why it is fast.</b> The remainder at least halves every two rows, so two numbers with 617 digits (2048 bits) need at most about 2950 rows; in practice about 1200.",
    bezout: (g, s, a, t, b) => "gcd = " + g + " = <span class=\"ca\">" + s + "</span> × " + a + " + <span class=\"tcoef\">" + t + "</span> × " + b,
    bezoutCheck: (sa, tb, g) => "Check: " + sa + " + " + tb + " = " + g + " ✓",
    whyExt: "<b>Why the rule works.</b> Each row of the division says r = (a of that row) - q × (b of that row), and those two are the remainders of the two rows above. If both are already written as s × a + t × b, then so is their difference. Nothing else is needed: one pass from the top.",
    readT: (t) => "In the row with remainder 1 the number in front of b is <b>" + t + "</b>.",
    resNeg: (t, a, d) => t + " is negative, so we add the modulus a: " + t + " + " + a + " = <b>" + d + "</b>. (Any multiple of a can be added: it does not change anything mod a.)",
    resD: (b, a, d) => "The inverse of " + b + " modulo " + a + " is <b>" + d + "</b>.",
    resCheck: (b, d, bd, k, a) => "Check: " + b + " × " + d + " = " + bd + " = " + k + " × " + a + " + 1, so " + b + " × " + d + " mod " + a + " = 1 ✓",
    resPy: (b, a, d) => "In Python: <span class=\"v\">pow(" + b + ", -1, " + a + ")</span> gives " + d + ".",
    resBad: (g, a, b) => "The last non-zero remainder is " + g + ", not 1. Every multiple of " + b + " is also a multiple of " + g + ", and so is a = " + a + ", so b × d mod a can never be 1: there is no inverse.",
    whyInv: "<b>In RSA.</b> Bob picks e with gcd(e, phi) = 1, so this table always ends with 1, and the inverse is his private exponent d. That is all the “d = the inverse of e mod phi” step of the RSA explorer does. Python's pow(e, -1, phi) runs exactly this algorithm.",
    toRsa: "Back to the RSA explorer ▶",
  },
  pl: {
    title: "Rozszerzony algorytm Euklidesa", home: "Matematyka",
    intro: "Punkt 7 spisu treści matematyki. Wybierz krok po lewej i przejdź po wierszach tabeli.",
    stepOf: n => "Krok " + n + " z 3 · Matematyka, punkt 7",
    steps: [["NWD przez kolejne dzielenia", "algorytm Euklidesa, wiersz po wierszu"], ["Zapamiętujemy s i t", "NWD = s × a + t × b (Bézout)"],
            ["Odwrotność modulo", "odczytana z ostatniego wiersza"]],
    explain: [
      ["Dziel, zostaw resztę, powtarzaj", "Największy wspólny dzielnik gcd(a, b) (po polsku NWD) to największa liczba, która dzieli a i b. Pomysł Euklidesa: gcd(a, b) = gcd(b, a mod b). Dzielimy a przez b, zostawiamy resztę r i robimy to samo z b i r, aż reszta będzie 0. Ostatnia niezerowa reszta to NWD. Przejdź po wierszach."],
      ["Każda reszta jako mieszanka a i b", "Przy każdym wierszu zapamiętujemy też dwie liczby s i t, takie że r = s × a + t × b. Dwa pierwsze wiersze są za darmo: a = 1 × a + 0 × b oraz b = 0 × a + 1 × b. Każdy następny to wiersz dwa wyżej minus q razy wiersz wyżej, z tym samym q co w dzieleniu. W wierszu z NWD dostajemy gcd(a, b) = s × a + t × b. To tożsamość Bézouta."],
      ["Odwrotność b modulo a", "Jeśli gcd(a, b) = 1, ostatni wiersz mówi 1 = s × a + t × b. Modulo a część s × a to 0, więc t × b mod a = 1: t to odwrotność b modulo a. W RSA a to phi, b to e, a odwrotność to prywatny wykładnik d."]],
    selfOk: "✓ sprawdzone z przykładami ze slajdów RSA, Wikipedii i z przeszukaniem wszystkich d", selfBad: f => "✗ samotest nie przeszedł: " + f,
    moreBelow: "Niżej jest więcej", keys: "← / →: krok · n / p: następny / poprzedni wiersz",
    cardIn: "Dwie liczby", presets: "przykłady:",
    preNames: ["160, 7 (slajdy o RSA)", "120, 23", "3120, 17 (Wikipedia, RSA)", "phi dwóch 20-cyfrowych liczb pierwszych, 65539", "89, 55 (Fibonacci)", "18, 12 (NWD 6)"],
    inA: "a", inB: "b", inLimit: "liczby całkowite, do 60 cyfr",
    errNum: "Wpisz liczby całkowite od 1 do 60 cyfr, a ≥ 2 i b ≥ 1.",
    cardEuclid: (a, b) => "Algorytm Euklidesa: gcd(" + a + ", " + b + ")",
    cardExt: (a, b) => "Rozszerzona tabela: każda reszta jako s × " + a + " + t × " + b,
    cardInv: (b, a) => "Odwrotność " + b + " modulo " + a,
    thRow: "wiersz", thA: "a", thB: "b", thDiv: "a = q × b + r", thR: "r", thMix: "r = s × a + t × b",
    start: "start", stopRow: "reszta 0: koniec",
    bReset: "⏮ od nowa", bPrev: "◀ poprzedni", bNext: "następny ▶", bAll: "wszystkie wiersze",
    rowK: (k, N) => "wiersz " + k + " z " + N,
    gcdRes: (a, b, g) => "Ostatnia niezerowa reszta to " + g + ", więc <span class=\"v\">gcd(" + a + ", " + b + ") = " + g + "</span>.",
    gcdOne: "NWD to 1: a i b są względnie pierwsze, więc b ma odwrotność modulo a (krok 3).",
    gcdNot: g => "NWD to " + g + ", a nie 1: b nie ma odwrotności modulo a.",
    rowsCount: N => "To " + N + " " + (N === 1 ? "dzielenie" : (N % 10 >= 2 && N % 10 <= 4 && !(N % 100 >= 12 && N % 100 <= 14)) ? "dzielenia" : "dzieleń") + ".",
    whyGcd: "<b>Dlaczego to działa.</b> Każda liczba, która dzieli a i b, dzieli też r = a - q × b, a każda, która dzieli b i r, dzieli też a = q × b + r. Pary (a, b) i (b, r) mają więc te same wspólne dzielniki i to samo NWD. <b>Dlaczego to szybkie.</b> Reszta co najmniej maleje o połowę co dwa wiersze, więc dwie liczby po 617 cyfr (2048 bitów) potrzebują najwyżej około 2950 wierszy, a w praktyce około 1200.",
    bezout: (g, s, a, t, b) => "NWD = " + g + " = <span class=\"ca\">" + s + "</span> × " + a + " + <span class=\"tcoef\">" + t + "</span> × " + b,
    bezoutCheck: (sa, tb, g) => "Sprawdzenie: " + sa + " + " + tb + " = " + g + " ✓",
    whyExt: "<b>Dlaczego ta reguła działa.</b> Każdy wiersz dzielenia mówi r = (a z tego wiersza) - q × (b z tego wiersza), a te dwie liczby to reszty z dwóch wierszy wyżej. Jeśli obie są już zapisane jako s × a + t × b, to ich różnica też. Nic więcej nie trzeba: jedno przejście od góry.",
    readT: (t) => "W wierszu z resztą 1 liczba przy b to <b>" + t + "</b>.",
    resNeg: (t, a, d) => t + " jest ujemne, więc dodajemy moduł a: " + t + " + " + a + " = <b>" + d + "</b>. (Można dodać dowolną wielokrotność a: modulo a nic to nie zmienia.)",
    resD: (b, a, d) => "Odwrotność " + b + " modulo " + a + " to <b>" + d + "</b>.",
    resCheck: (b, d, bd, k, a) => "Sprawdzenie: " + b + " × " + d + " = " + bd + " = " + k + " × " + a + " + 1, więc " + b + " × " + d + " mod " + a + " = 1 ✓",
    resPy: (b, a, d) => "W Pythonie: <span class=\"v\">pow(" + b + ", -1, " + a + ")</span> daje " + d + ".",
    resBad: (g, a, b) => "Ostatnia niezerowa reszta to " + g + ", a nie 1. Każda wielokrotność " + b + " jest też wielokrotnością " + g + ", tak samo a = " + a + ", więc b × d mod a nigdy nie da 1: odwrotności nie ma.",
    whyInv: "<b>W RSA.</b> Bob wybiera e z gcd(e, phi) = 1, więc ta tabela zawsze kończy się jedynką, a odwrotność to jego prywatny wykładnik d. Tylko to robi krok „d = odwrotność e mod phi” w eksploratorze RSA. pow(e, -1, phi) w Pythonie liczy dokładnie tym algorytmem.",
    toRsa: "Wróć do eksploratora RSA ▶",
  },
};

/* ===================== the app ===================== */
let lang = "en";
/* one language setting for all the simulators on the site */
try { const s = localStorage.getItem("cryptoSimLang"); if (s === "pl" || s === "en") lang = s; } catch (e) {}
const L = () => T[lang];
const app = { level: 0, aText: "160", bText: "7", a: 160n, b: 7n, inErr: false, k: -1 };   // k: rows shown (-1 = all)
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// the numbers can come in the address: ?a=160&b=7 (the RSA explorer links here with its phi and e)
(function () {
  try {
    const q = new URLSearchParams(location.search), a = q.get("a"), b = q.get("b");
    if (a && b && /^\d{1,60}$/.test(a) && /^\d{1,60}$/.test(b)) { app.aText = a; app.bText = b; }
  } catch (e) {}
})();
function readInputs() {
  const ok = /^\d{1,60}$/.test(app.aText.trim()) && /^\d{1,60}$/.test(app.bText.trim());
  app.inErr = !ok || BigInt(app.aText.trim()) < 2n || BigInt(app.bText.trim()) < 1n;
  if (!app.inErr) { app.a = BigInt(app.aText.trim()); app.b = BigInt(app.bText.trim()); }
  app.k = -1;
}
readInputs();

function inputsCard() {
  const t = L();
  const pre = PRESETS.map((pr, i) => '<button data-action="preset" data-i="' + i + '" aria-pressed="' +
    (app.aText === String(pr[0]) && app.bText === String(pr[1])) + '">' + t.preNames[i] + "</button>").join("");
  const chip = (f, lbl, role, v) => '<label class="chip ' + role + '">' + lbl + '<input data-field="' + f + '" inputmode="numeric" spellcheck="false" value="' + esc(v) + '"></label>';
  return '<div class="card"><h3>' + t.cardIn + '</h3><div class="presets"><span class="note">' + t.presets + "</span>" + pre + "</div>" +
    '<div class="inrow">' + chip("a", t.inA, "role-a", app.aText) + chip("b", t.inB, "role-b", app.bText) +
    '<span class="note">' + t.inLimit + "</span></div></div>";
}
function stepButtons(shown, N) {
  const t = L();
  return '<div class="btns"><button data-action="k-reset">' + t.bReset + '</button><button data-action="k-prev"' + (shown <= 0 ? " disabled" : "") + ">" + t.bPrev +
    '</button><button data-action="k-next"' + (shown >= N ? " disabled" : "") + ">" + t.bNext + '</button><button data-action="k-all"' + (shown >= N ? " disabled" : "") + ">" + t.bAll +
    '</button><span class="note">' + t.rowK(shown, N) + "</span></div>";
}
function fmtMix(r, s, tt, hotT) {
  const tAbs = tt < 0n ? -tt : tt;
  const tStr = hotT ? '<span class="tcoef">' + tAbs + "</span>" : String(tAbs);
  return r + " = " + s + " × a" + (tt < 0n ? " - " : " + ") + tStr + " × b";
}
// the table: plain (step 1) or with the s, t column (steps 2 and 3)
function tableHTML(withMix, stepping) {
  const t = L(), x = extEuclid(app.a, app.b), N = x.rows.length;
  const shown = !stepping || app.k < 0 || app.k > N ? N : app.k;
  const done = shown === N;
  let h = '<div class="tablewrap"><table class="etab"><tr><th>' + t.thRow + "</th><th>" + t.thA + "</th><th>" + t.thB + "</th><th>" + t.thDiv + "</th><th>" +
    (withMix ? t.thMix : t.thR) + "</th></tr>";
  if (withMix) {
    // if b divides a, the gcd is b itself: its start row is the last non-zero remainder
    const bIsG = done && N === 1;
    h += '<tr class="start"><td>' + t.start + "</td><td></td><td></td><td></td><td>" + fmtMix(app.a, 1n, 0n, false) + "</td></tr>";
    h += '<tr class="' + (bIsG ? "one" : "start") + '"><td>' + t.start + "</td><td></td><td></td><td></td><td>" + fmtMix(app.b, 0n, 1n, bIsG && x.g === 1n) + "</td></tr>";
  }
  x.rows.forEach((r, i) => {
    const m = x.mix[i + 2];
    const isG = i === N - 2;
    let cls = i >= shown ? "hide" : (i === shown - 1 && !done ? "cur" : "");
    if (done && isG) cls = "one";
    const last = withMix ? (r.r === 0n ? '<span class="note">' + t.stopRow + "</span>" : fmtMix(r.r, m.s, m.t, isG && x.g === 1n))
                         : (r.r === 0n ? '<span class="note">' + t.stopRow + "</span>" : r.r);
    h += '<tr class="' + cls + '"><td>' + (i + 1) + "</td><td>" + r.a + "</td><td>" + r.b + "</td><td>" + r.a + " = " + r.q + " × " + r.b + " + " + r.r +
      '</td><td class="' + (withMix ? "" : "rr") + '">' + last + "</td></tr>";
  });
  h += "</table></div>";
  if (stepping) h += stepButtons(shown, N);
  return { html: h, x: x, done: done, N: N };
}

/* ---------- step 1 ---------- */
function render0() {
  const t = L();
  let h = inputsCard();
  if (app.inErr) return h + '<div class="card"><p class="err">' + t.errNum + "</p></div>";
  const R = tableHTML(false, true), x = R.x;
  h += '<div class="card"><h3>' + t.cardEuclid(app.a, app.b) + "</h3>" + R.html;
  if (R.done) {
    h += '<div class="result">' + t.gcdRes(app.a, app.b, x.g) + " " + t.rowsCount(R.N) + "<br>" +
      (x.g === 1n ? '<span class="okline">' + t.gcdOne + "</span>" : '<span class="err">' + t.gcdNot(x.g) + "</span>") + "</div>";
  }
  return h + '<div class="why">' + t.whyGcd + "</div></div>";
}
/* ---------- step 2 ---------- */
function render1() {
  const t = L();
  let h = inputsCard();
  if (app.inErr) return h + '<div class="card"><p class="err">' + t.errNum + "</p></div>";
  const R = tableHTML(true, true), x = R.x;
  h += '<div class="card"><h3>' + t.cardExt(app.a, app.b) + "</h3>" + R.html;
  if (R.done) {
    const sa = x.s * app.a, tb = x.t * app.b;
    h += '<div class="result"><span class="big">' + t.bezout(x.g, x.s, app.a, x.t, app.b) + "</span><br>" +
      '<span class="okline">' + t.bezoutCheck(sa, tb, sa + tb) + "</span></div>";
  }
  return h + '<div class="why">' + t.whyExt + "</div></div>";
}
/* ---------- step 3 ---------- */
function render2() {
  const t = L();
  let h = inputsCard();
  if (app.inErr) return h + '<div class="card"><p class="err">' + t.errNum + "</p></div>";
  const R = tableHTML(true, false), x = R.x, a = app.a, b = app.b;
  h += '<div class="card"><h3>' + t.cardInv(b, a) + "</h3>" + R.html + '<div class="result">';
  if (x.g === 1n) {
    const d = x.d, bd = b * d;
    h += t.readT(x.t) + "<br>" + (x.t < 0n ? t.resNeg(x.t, a, d) + "<br>" : "") + '<span class="bigs">' + t.resD(b, a, d) + "</span><br>" +
      '<span class="okline">' + t.resCheck(b, d, bd, bd / a, a) + "</span><br>" + t.resPy(b, a, d);
  } else h += '<span class="err">' + t.resBad(x.g, a, b) + "</span>";
  h += "</div>" + '<div class="why">' + t.whyInv + "</div>" +
    '<div class="btns"><a class="btnlink dark" href="../../rsa/index.html#2">' + t.toRsa + "</a></div></div>";
  return h;
}

/* ---------- frame, navigation ---------- */
function buildSide() {
  const t = L();
  document.getElementById("steps").innerHTML = t.steps.map((s, i) =>
    '<button class="step' + (i < app.level ? " past" : "") + '" data-step="' + i + '" aria-pressed="' + (i === app.level) + '">' +
    '<span class="gnum">' + (i + 1) + "</span><span><b>" + s[0] + "</b><small>" + s[1] + "</small></span></button>").join("");
}
function body() {
  return [render0, render1, render2][app.level]();
}
function render() {
  const t = L();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("home").textContent = "← " + t.home;
  document.getElementById("keys").textContent = t.keys;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const st = document.getElementById("selftest");
  st.textContent = SELF_FAILS.length ? t.selfBad(SELF_FAILS.join(", ")) : t.selfOk;
  st.className = SELF_FAILS.length ? "badt" : "okt";
  buildSide();
  document.getElementById("mhGrp").textContent = t.stepOf(app.level + 1);
  document.getElementById("mhTitle").textContent = t.steps[app.level][0];
  document.getElementById("mhSub").textContent = t.steps[app.level][1];
  const ex = t.explain[app.level];
  view.innerHTML = '<div class="fade"><div class="explain"><b>' + ex[0] + "</b>" + ex[1] + '</div><div id="stepbody">' + body() + "</div></div>";
  document.getElementById("moreTxt").textContent = t.moreBelow;
  updateMore();
  try { history.replaceState(null, "", "#" + (app.level + 1)); } catch (e) {}
}
// redraw only the step, keeping the focus in an input while typing
function update() {
  const el = document.getElementById("stepbody");
  const f = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.field : null;
  const pos = f ? document.activeElement.selectionStart : null;
  el.innerHTML = body();
  if (f) { const inp = el.querySelector('input[data-field="' + f + '"]'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (e) {} } }
  updateMore();
}
function goTo(level) {
  if (level < 0 || level > 2) return;
  app.level = level;
  render();
  view.scrollTop = 0;
}
function rowGo(k) {
  if (app.inErr || app.level === 2) return;
  const N = euclidRows(app.a, app.b).length, cur = app.k < 0 ? N : app.k;
  k = k === "all" ? N : k === "next" ? cur + 1 : k === "prev" ? cur - 1 : k;
  k = Math.max(0, Math.min(N, k));
  app.k = k === N ? -1 : k;
  update();
}

/* ---------- events ---------- */
const view = document.getElementById("view");
/* "more below" button: shown while part of the page is still below the screen */
function scroller() { return view.scrollHeight > view.clientHeight + 1 ? view : document.scrollingElement; }
function updateMore() {
  const b = document.getElementById("more");
  if (!b) return;
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => {
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "preset") {
    const pr = PRESETS[+el.dataset.i];
    app.aText = String(pr[0]); app.bText = String(pr[1]);
    readInputs(); update();
  }
  else if (a === "k-reset") rowGo(0);
  else if (a === "k-prev") rowGo("prev");
  else if (a === "k-next") rowGo("next");
  else if (a === "k-all") rowGo("all");
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (f !== "a" && f !== "b") return;
  app[f + "Text"] = e.target.value;
  readInputs(); update();
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") { e.preventDefault(); goTo(app.level + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(app.level - 1); }
  else if (e.key === "n" || e.key === " ") { e.preventDefault(); rowGo("next"); }
  else if (e.key === "p") rowGo("prev");
});
window.addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= 3 && n - 1 !== app.level) goTo(n - 1);
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
const startStep = parseInt(location.hash.slice(1), 10);
if (startStep >= 1 && startStep <= 3) app.level = startStep - 1;
render();
</script>
</body>
</html>
