<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AES explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  --key-b:#E2A60E;   --key-bg:#FDF3DC;
  --ctr-b:#2FA84F;   --ctr-bg:#E3F4E8;
  --non-b:#2F6FDB;   --non-bg:#E5EDFB;
  --ct-b:#8A5CD8;   --ct-bg:#F1EAFD;
  --tag-b:#0E8F9A;  --tag-bg:#DDF2F4;
  --p:#2F6FDB; --z:#9A6B00; --c:#7446C4;
  --g0:#2F6FDB; --g1:#2FA84F; --g2:#E5484D; --g3:#E2A60E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
    --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
    --ct-b:#B596F5; --ct-bg:#2A2142; --tag-b:#4FCFDA; --tag-bg:#12343A;
    --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
    --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
  --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
  --ct-b:#B596F5; --ct-bg:#2A2142; --tag-b:#4FCFDA; --tag-bg:#12343A;
  --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
  --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}
sub,sup{line-height:0}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.schwrap{overflow-x:auto}
.role-pt{border-color:var(--const-b);background:var(--const-bg)}
.role-key{border-color:var(--key-b);background:var(--key-bg)}
.role-key2{border-color:var(--key-b);background:var(--key-bg);border-style:dashed}
.role-ctr{border-color:var(--ctr-b);background:var(--ctr-bg)}
.role-nonce{border-color:var(--non-b);background:var(--non-bg)}
.role-ct{border-color:var(--ct-b);background:var(--ct-bg)}
.role-tag{border-color:var(--tag-b);background:var(--tag-bg)}
.role-ks{border-color:var(--key-b);background:var(--key-bg)}
.role-aad{border-color:var(--const-b);background:var(--surface);border-style:dashed}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:16px 22px;font-size:21px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:12px;font-weight:400;opacity:.8}
.rnd{position:absolute;top:4px;right:6px;padding:2px 5px;line-height:0;border-radius:5px;color:var(--ink)}
.node{position:absolute;border-radius:10px;padding:8px 12px;border:1.5px solid;color:var(--ink)}
.node .nh{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.node .nb{font-size:14px;margin:4px 0 2px;line-height:1.5}
.node small{font-size:12px;color:var(--muted)}
.inbox{position:absolute;top:0;min-height:70px;border:1.5px solid;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.inbox label{display:block}
.inbox input{display:block;margin-top:3px;width:100%}
.inbox .tline{display:flex;align-items:center;gap:8px;margin-top:5px;font-weight:600}
.inbox .tline input{display:inline-block;margin:0;width:24ch}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs button.soonbtn{border-style:dashed;color:var(--muted);cursor:default}
.tabs button.soonbtn:hover{background:var(--surface)}
.soonb{font-size:11px;padding:1px 7px;margin-left:4px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rlabel{font-weight:600;margin-top:8px}
.pips{display:inline-flex;gap:3px;flex-wrap:wrap}
.pip{min-width:30px;height:30px;padding:0 6px;font-size:12.5px;font-family:var(--mono);border-radius:6px}
.pip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opnow{font-family:var(--mono);background:var(--chg);color:#fff;border-radius:5px;padding:2px 8px}
.btable{border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
.btable td,.btable th{padding:3px 8px;text-align:left}
.btable th{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:600}
.btable td.lbl{font-family:var(--sans);font-weight:600;font-size:13px;white-space:nowrap}
.btable tr.click{cursor:pointer}
.btable tr.click:hover td{background:var(--sunken)}
.btable tr.on td{background:var(--chg-bg)}
.tablewrap{overflow-x:auto}
.inline{font-family:var(--mono);font-size:13.5px}
.dim{opacity:.4}

/* the 4x4 state */
figure{margin:0;text-align:center}
figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.bgrid{display:inline-grid;grid-template-columns:repeat(4,auto);gap:4px}
.bgrid.lbl5{grid-template-columns:repeat(4,auto) 3.6em}
.bc{font-family:var(--mono);font-size:14px;width:2.7em;padding:4px 0;border-radius:5px;border:1.5px solid var(--rule);background:var(--surface);text-align:center;cursor:pointer}
.bgrid.sm .bc{font-size:12.5px;width:2.5em;padding:2px 0}
.bc.chgd{background:var(--chg-bg);border-color:var(--chg)}
.bc.bsel{outline:2.5px solid var(--chg);outline-offset:1px;font-weight:700}
.bc.colsel{border-color:var(--chg);border-width:2px}
.bc.g0{box-shadow:inset 0 -4px 0 var(--g0)}.bc.g1{box-shadow:inset 0 -4px 0 var(--g1)}
.bc.g2{box-shadow:inset 0 -4px 0 var(--g2)}.bc.g3{box-shadow:inset 0 -4px 0 var(--g3)}
.bc.role-pt{border-color:var(--const-b);background:var(--const-bg)}
.bc.role-key{border-color:var(--key-b);background:var(--key-bg)}
.bc.role-ct{border-color:var(--ct-b);background:var(--ct-bg)}
.rowl{font-size:12px;color:var(--chg);font-weight:600;align-self:center;text-align:left;padding-left:4px;white-space:nowrap}
.rflow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.arrow{font-size:24px;color:var(--muted)}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.rbox{font-size:17px;padding:12px 20px;align-items:stretch;min-width:200px}
.rbox .op{font-size:14px;font-weight:500;text-align:left;padding:1px 6px;border-radius:4px}
.rbox .op:hover{background:var(--chg);color:#fff}
.rbox .op.off{text-decoration:line-through;opacity:.55}
.rbox .rt{text-align:center}
.sign{font-size:28px;font-weight:600}
.sign.op{width:42px;height:42px;border-radius:50%;background:var(--chg);color:#fff;line-height:40px;text-align:center}
.oppill{background:var(--chg);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;text-align:center}
.oppill small{display:block;font-weight:400;font-size:12px;opacity:.9}

/* S-box */
.sbox{border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.sbox td,.sbox th{width:25px;height:20px;text-align:center;padding:0}
.sbox th{color:var(--muted);font-weight:600}
.sbox th.hl{color:var(--chg)}
.sbox td{border:1px solid var(--rule)}
.sbox td.rowhl,.sbox td.colhl{background:var(--sunken)}
.sbox td.hit{background:var(--chg);color:#fff;font-weight:700}
.sbrow{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.eqtab{font-family:var(--mono);font-size:14px;border-collapse:collapse}
.eqtab td{padding:3px 6px;white-space:nowrap}
.eqtab td.res{font-weight:700;color:var(--chg)}

/* step 1 schematic */
.sch1{position:relative;width:900px;height:300px;color:var(--muted)}
.sch1 .arrows,.schx .arrows{position:absolute;left:0;top:0}
.s1-key{left:0;width:410px}
.s1-pt{left:426px;width:474px}
.s1-box{position:absolute;left:300px;top:170px;width:200px;height:80px;justify-content:center}
.s1-ct{left:560px;top:158px;width:340px;height:104px}
.s1-bob{position:absolute;left:0;top:268px;width:900px;font-size:13.5px;color:var(--ink)}
.hexrow{font-family:var(--mono);font-size:14px;letter-spacing:.02em}
.hexrow .d{background:var(--chg);color:#fff;border-radius:3px}
.flipctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.flipctl input{width:5em}

/* step 4: modes */
.minputs{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.mi{position:relative;border:1.5px solid;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.mi label{display:block}
.mi input,.mi textarea{display:block;margin-top:3px}
.mi textarea{width:100%;resize:none;height:44px;font-size:13.5px}
.mi .ctrline{display:flex;gap:4px;align-items:center;margin-top:3px}
.mi .ctrline button{padding:3px 10px}
.mi input[type=number]{width:8em}
.mcols{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.mcol{flex:none;width:212px;display:flex;flex-direction:column;align-items:stretch}
.vb{border:1.5px solid;border-radius:8px;padding:4px 8px;font-size:12px;color:var(--ink)}
.vb b{display:block;font-size:12.5px}
.vb .hx{font-family:var(--mono);font-size:12.5px;line-height:1.45;white-space:nowrap}
.vb .tx{font-family:var(--mono);font-size:12.5px;white-space:pre;color:var(--muted)}
.vb.same{outline:3px solid var(--chg);outline-offset:1px}
.vb .pad{text-decoration:underline dotted;opacity:.6}
.va{text-align:center;color:var(--muted);font-size:17px;line-height:20px}
.aesb{background:var(--ink);color:var(--surface);border-radius:8px;text-align:center;padding:5px 6px;font-weight:600;font-size:14px}
.ktag{display:inline-block;background:var(--key-bg);color:var(--ink);border:1.5px solid var(--key-b);border-radius:4px;padding:0 6px;font-size:12px;margin-left:6px;font-weight:600}
.ktag.k2{border-style:dashed}
.xorc{width:30px;height:30px;border-radius:50%;background:var(--chg);color:#fff;text-align:center;line-height:29px;font-size:21px;margin:3px auto}
.eqs{text-align:center;font-weight:700;font-size:17px;line-height:20px;color:var(--muted)}
span.bn{background:var(--non-bg);color:var(--ink);border-radius:2px}
span.bk{background:var(--ctr-bg);color:var(--ink);border-radius:2px;font-weight:700}
span.hit{background:var(--chg);color:#fff;border-radius:2px}
.hflow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.hflow .vb{min-width:200px}
.pics{display:flex;gap:18px;flex-wrap:wrap}
.pics canvas{width:288px;height:180px;image-rendering:pixelated;border:1px solid var(--rule);border-radius:6px;display:block}
.bullets{margin:6px 0 0;padding-left:20px;font-size:13.5px}
.bullets li{margin:3px 0}
.mstrip{display:grid;grid-template-columns:repeat(16,auto);gap:3px;justify-content:start;margin:6px 0}
.mb{font-family:var(--mono);font-size:12.5px;padding:2px 4px;border-color:var(--ct-b);background:var(--ct-bg)}
.mb.on{background:var(--chg);color:#fff;border-color:var(--chg)}
.tagbig{font-family:var(--mono);font-size:15px;font-weight:600}
.verdict{margin-top:8px;font-weight:600}

/* step 5: comparison */
.cmp{border-collapse:collapse;font-size:13.5px;width:100%}
.cmp th,.cmp td{border:1px solid var(--rule);padding:6px 8px;vertical-align:top;text-align:left}
.cmp th.rh{font-weight:600;background:var(--sunken);width:150px}
.cmp thead th{background:var(--sunken)}
.cmp thead button{font-weight:700;padding:4px 10px}
.cmp thead th.ref{color:var(--muted);font-weight:600}
.cmp td.g{background:var(--ctr-bg)}
.cmp td.b{background:var(--chg-bg)}
.cmp td.ref{color:var(--muted)}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" aria-label="Steps">
      <div id="steps"></div>
      <div class="sidefoot"><div id="selftest"></div><div id="keys"></div></div>
    </nav>
    <main class="main">
      <div class="modhead"><span id="mhGrp"></span><h2 id="mhTitle"></h2><p id="mhSub"></p></div>
      <div class="content" id="view"></div>
      <button id="more" class="more" hidden><span id="moreTxt"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v10M3 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </main>
  </div>
</div>

<script>
"use strict";

/* ===================== AES core ===================== */
// CORE-BEGIN
/* AES-128 (FIPS-197) and four modes: ECB and CTR (NIST SP 800-38A), GCM (NIST SP 800-38D, the original

const hx2 = x => x.toString(16).padStart(2, "0");
const sp = b => Array.from(b, hx2).join(" ");
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
const enc = s => new TextEncoder().encode(s);
const MAXMSG = 63;
function msgBytes() { const b = enc(app.msg); return b.length > MAXMSG ? b.slice(0, MAXMSG) : b; }
function chars(b) { return Array.from(b, x => (x >= 32 && x < 127) ? String.fromCharCode(x) : "·").join(""); }
function sameBytes(a, b) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

/* the 4x4 state: byte i is in row i % 4, column i / 4 */
function bgrid(b, o) {
  o = o || {};
  let h = '<div class="bgrid' + (o.sm ? " sm" : "") + (o.rowLbl ? " lbl5" : "") + '">';
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const i = r + 4 * c;
      let cls = "bc";
      if (o.role) cls += " role-" + o.role;
      if (o.chg && o.chg[i]) cls += " chgd";
      if (o.col !== undefined && c === o.col) cls += " colsel";
      if (o.sel === i) cls += " bsel";
      if (o.colorBy) cls += " g" + o.colorBy(r, c);
      h += '<div class="' + cls + '" data-action="byte" data-i="' + i + '">' + hx2(b[i]) + "</div>";
    }
    if (o.rowLbl) h += '<div class="rowl">' + o.rowLbl(r) + "</div>";
  }
  return h + "</div>";
}
const fig = (inner, cap) => "<figure>" + inner + "<figcaption>" + cap + "</figcaption></figure>";
function diff(a, b) { const d = []; for (let i = 0; i < 16; i++) d.push(a[i] !== b[i]); return d; }

/* arrows */
const mk = (id, c) => '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="' + c + '"/></marker>';
const ln = (pts, c, m) => '<polyline fill="none" stroke="' + c + '" stroke-width="2.4" marker-end="url(#' + m + ')" points="' + pts + '"/>';
const DICE_SVG = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="5" r="1.3" fill="currentColor"/><circle cx="11" cy="5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="11" r="1.3" fill="currentColor"/></svg>';
const rndBtn = f => { const t = f === "nonce" ? L().randNonce : L().randKey; return '<button class="rnd" data-action="rand" data-f="' + f + '" title="' + esc(t) + '" aria-label="' + esc(t) + '">' + DICE_SVG + "</button>"; };
function randomize(f) {
  const n = f === "nonce" ? 12 : 16;
  const b = new Uint8Array(n);
  crypto.getRandomValues(b);
  const hex = bytesHex(b);
  if (f === "key") { app.key = b; app.keyText = hex; app.keyErr = false; }
  else if (f === "k2") { app.k2 = b; app.k2Text = hex; app.k2Err = false; }
  else { app.nonce = b; app.nonceText = hex; app.nonceErr = false; }
  view.querySelectorAll('input[data-field="' + f + '"]').forEach(inp => { inp.value = hex; });
  app.tamper = -1; app.xtsTamper = -1;
  inputsChanged();
}

function ptAsText() {
  let s = "";

  return s;

function hexDiffHTML(a, b) {          // b printed, the hex digits that differ from a in orange
  let h = "";
  for (let i = 0; i < 16; i++) {
    const x = hx2(a[i]), y = hx2(b[i]);
    for (let k = 0; k < 2; k++) h += x[k] !== y[k] ? '<span class="d">' + y[k] + "</span>" : y[k];
    if (i < 15) h += " ";
  }
  return h;
}
function updateL0() {
  const ct = document.getElementById("ctbytes");
  if (!ct) return;
  const t = L(), fb = document.getElementById("flipbody"), bl = document.getElementById("bobline");
  if (app.keyErr || app.ptErr) {
    ct.innerHTML = ""; fb.innerHTML = "";
    bl.innerHTML = '<span class="err">' + (app.keyErr ? t.errKey + " " : "") + (app.ptErr ? t.errPt : "") + "</span>";
    return;
  }
  const rk = expandKey(app.key);
  const c = encryptBlock(rk, app.pt);
  ct.innerHTML = sp(c.slice(0, 8)) + "<br>" + sp(c.slice(8));
  const back = decryptBlock(rk, c);
  bl.innerHTML = '<span class="okline">' + esc(t.bob(bytesHex(c).slice(0, 8) + "…", bytesHex(back).slice(0, 8) + "…")) + "</span>";
  const p2 = app.pt.slice();
  p2[app.flip >> 3] ^= 0x80 >> (app.flip & 7);
  const c2 = encryptBlock(rk, p2);
  let n = 0;
  for (let i = 0; i < 16; i++) { let x = c[i] ^ c2[i]; while (x) { n += x & 1; x >>= 1; } }
  const row = (l, html) => '<tr><td class="lbl">' + l + '</td><td class="hexrow">' + html + "</td></tr>";
  fb.innerHTML = '<table class="btable">' + row(t.rowP, sp(app.pt)) + row(t.rowP2, hexDiffHTML(app.pt, p2)) +
    row(t.rowC, sp(c)) + row(t.rowC2, hexDiffHTML(c, c2)) + "</table>" + '<p class="verdict" style="color:var(--chg)">' + t.flipCount(n) + "</p>";
}

  }
  h += '<div class="card"><h3>' + t.xtsTitle + '</h3><div class="mcols">' + cols + "</div>" +
    '<p class="note" style="margin:8px 0 0">' + t.alphaNote + "</p>" + '<p class="note" style="margin:4px 0 0">' + t.sectorNote + "</p></div>";
  // same data, other sectors
  const b1 = sec.slice(0, 16);
  let lines = "";
  for (let d = 0; d < 3; d++) {
    const s = app.sector + d;
    lines += '<tr><td class="lbl">' + t.secN(s) + '</td><td style="color:var(--c)">' + bytesHex(xtsEncrypt(app.key, app.k2, sectorBytes(s), b1).c) + "</td></tr>";
  }
  h += '<div class="card"><h3>' + t.sameTitle + "</h3>" + (pair ? '<p class="verdict" style="margin:0 0 6px">' + t.sameEq(pair[0], pair[1]) + "</p>" : "") +
    '<p style="margin:0 0 4px">' + t.sameTxt + '</p><table class="btable">' + lines + "</table></div>";
  // Mallory, no tag
  const c2 = x.c.slice();
  if (app.xtsTamper >= 0) c2[16 * app.xtsTamper] ^= 1;
  const back = xtsDecrypt(app.key, app.k2, tw, c2);
  let rows = "";
  for (let j = 0; j < 4; j++) {
    const bj = back.slice(16 * j, 16 * j + 16), bad = j === app.xtsTamper;
    rows += '<tr' + (bad ? ' class="on"' : "") + '><td class="lbl">' + t.pLbl(j + 1) + "</td><td>" + bytesHex(bj) + '</td><td style="white-space:pre">"' + esc(chars(bj)) + '"</td></tr>';
  }
  h += '<div class="card"><h3>' + t.noTagTitle + '</h3><p style="margin:0 0 6px">' + t.noTagTxt + '</p><div class="btns" style="margin:0 0 8px">' +
    [0, 1, 2, 3].map(j => '<button data-action="xts-tamper" data-j="' + j + '"' + (j === app.xtsTamper ? ' class="dark"' : "") + ">" + t.malBlock(j + 1) + "</button>").join("") +
    (app.xtsTamper >= 0 ? '<button data-action="xts-tamper" data-j="-1">' + t.undo + "</button>" : "") + "</div>" +
    '<p style="margin:0 0 4px">' + t.bobReads + '</p><table class="btable">' + rows + "</table>" +
    (app.xtsTamper >= 0 ? '<p class="verdict badline">' + t.garbled(app.xtsTamper + 1) + "</p>" : "") +
    '<div class="why">' + t.determ + "</div></div>";
  return h;
}

/* ---------- step 5: comparison ---------- */
function render4() {
  const t = L();
  let h = '<div class="card"><div class="tablewrap"><table class="cmp"><thead><tr><th></th>' +
    MODES.map(m => '<th><button data-action="open-mode" data-m="' + m + '">' + m.toUpperCase() + "</button></th>").join("") + '<th class="ref">' + t.refHead + "</th></tr></thead><tbody>";
  t.cmpRows.forEach((rn, i) => {
    h += '<tr><th class="rh">' + rn + "</th>" + t.cmp[i].map((v, k) => '<td class="' + CMP_GRADE[i][k] + (k === 4 ? " ref" : "") + '">' + v + "</td>").join("") + "</tr>";
  });
  return h + '</tbody></table></div><p class="note" style="margin:8px 0 0">' + t.cmpNote + "</p></div>";
}

/* ---------- frame, navigation ---------- */
function buildSide() {
  const t = L();
  document.getElementById("steps").innerHTML = t.steps.map((s, i) =>
    '<button class="step' + (i < app.level ? " past" : "") + '" data-step="' + i + '" aria-pressed="' + (i === app.level) + '">' +
    '<span class="gnum">' + (i + 1) + "</span><span><b>" + s[0] + "</b><small>" + s[1] + "</small></span></button>").join("");
}
function render() {
  const t = L();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("home").textContent = "← " + t.home;
  document.getElementById("keys").textContent = t.keys;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const st = document.getElementById("selftest");
  st.textContent = SELF_FAILS.length ? t.selfBad(SELF_FAILS.join(", ")) : t.selfOk;
  st.className = SELF_FAILS.length ? "badt" : "okt";
  buildSide();
  document.getElementById("mhGrp").textContent = t.stepOf(app.level + 1);
  document.getElementById("mhTitle").textContent = t.steps[app.level][0];
  document.getElementById("mhSub").textContent = t.steps[app.level][1];
  const ex = t.explain[app.level];
  view.innerHTML = '<div class="fade"><div class="explain"><b>' + ex[0] + "</b>" + ex[1] + "</div>" +
    [render0, render1, render2, render3, render4][app.level]() + "</div>";
  if (app.level === 0) updateL0();
  if (app.level === 3) updateL3();
  document.getElementById("moreTxt").textContent = t.moreBelow;
  updateMore();
  try { history.replaceState(null, "", "#" + (app.level + 1) + (app.level === 3 ? "-" + app.mode : "")); } catch (e) {}
}
function rerender() { const y = view.scrollTop; render(); view.scrollTop = y; const f = view.querySelector(".fade"); if (f) f.classList.remove("fade"); }
function goTo(level) {
  if (level === 2 && app.round < 1) app.round = 1;
  app.level = level;
  render();
  view.scrollTop = 0;
}
function zoomIn() { if (app.level < NSTEPS - 1) goTo(app.level + 1); }
function zoomOut() { if (app.level > 0) goTo(app.level - 1); }
function inputsChanged() { if (app.level === 0) updateL0(); else if (app.level === 3) updateL3(); }
function setRound(r) { app.round = Math.max(app.level === 2 ? 1 : 0, Math.min(10, r)); rerender(); }
function setOp(k) { app.op = Math.max(0, Math.min(3, k)); rerender(); }

/* ---------- events ---------- */
const view = document.getElementById("view");
function scroller() { return view.scrollHeight > view.clientHeight + 1 ? view : document.scrollingElement; }
function updateMore() {
  const b = document.getElementById("more");
  if (!b) return;
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => {
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "op-go") { e.stopPropagation(); if (app.round < 1) app.round = 1; app.op = +el.dataset.op; goTo(2); }
  else if (a === "zoom") { if (app.level === 1 && app.round < 1) app.round = 1; zoomIn(); }
  else if (a === "goto") goTo(+el.dataset.s);
  else if (a === "rand") randomize(el.dataset.f);
  else if (a === "flip-dec" || a === "flip-inc") {
    app.flip = (app.flip + (a === "flip-inc" ? 1 : 127)) % 128;
    const inp = view.querySelector('input[data-field="flip"]'); if (inp) inp.value = app.flip;
    updateL0();
  }
  else if (a === "round-dec" || a === "round-inc") setRound(app.round + (a === "round-inc" ? 1 : -1));
  else if (a === "round-set") setRound(+el.dataset.r);
  else if (a === "op-set") setOp(+el.dataset.op);
  else if (a === "op-prev") { if (app.op > 0) setOp(app.op - 1); else if (app.round > 1) { app.op = 3; setRound(app.round - 1); } }
  else if (a === "op-next") { if (app.op < 3) setOp(app.op + 1); else if (app.round < 10) { app.op = 0; setRound(app.round + 1); } }
  else if (a === "byte" && app.level === 2) {
    const i = +el.dataset.i;
    // in the "after" table of ShiftRows, follow the byte back to where it came from
    if (app.op === 1 && el.closest("figure") && el.closest("figure").previousElementSibling) { const r = i % 4, c = i >> 2; app.sel = r + 4 * ((c + r) % 4); }
    else app.sel = i;
    app.mcCol = i >> 2;
    rerender();
  }
  else if (a === "mode") { app.mode = el.dataset.m; rerender(); }
  else if (a === "cbc-soon") { const n = document.getElementById("cbcnote"); if (n) n.hidden = !n.hidden; }
  else if (a === "open-mode") { app.mode = el.dataset.m; goTo(3); }
  else if (a === "sec-dec" || a === "sec-inc") {
    app.sector = Math.max(0, app.sector + (a === "sec-inc" ? 1 : -1));
    const inp = view.querySelector('input[data-field="sector"]'); if (inp) inp.value = app.sector;
    app.xtsTamper = -1; updateL3();
  }
  else if (a === "tamper") { app.tamper = +el.dataset.i; updateL3(); }
  else if (a === "xts-tamper") { app.xtsTamper = +el.dataset.j; updateL3(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = e.target.value;
  if (f === "key") { const b = parseHex(v, 16); app.keyText = v; app.keyErr = !b; if (b) { app.key = b; app.tamper = -1; app.xtsTamper = -1; } inputsChanged(); }
  else if (f === "k2") { const b = parseHex(v, 16); app.k2Text = v; app.k2Err = !b; if (b) { app.k2 = b; app.xtsTamper = -1; } inputsChanged(); }
  else if (f === "nonce") { const b = parseHex(v, 12); app.nonceText = v; app.nonceErr = !b; if (b) { app.nonce = b; app.tamper = -1; } inputsChanged(); }
  else if (f === "pt") {
    const b = parseHex(v, 16); app.ptText = v; app.ptErr = !b;
    if (b) { app.pt = b; const tx = view.querySelector('input[data-field="pttxt"]'); if (tx) tx.value = ptAsText(); }
    updateL0();
  }
  else if (f === "pttxt") {
    const raw = enc(v), b = new Uint8Array(16);
    b.set(raw.slice(0, 16));
    app.pt = b; app.ptText = bytesHex(b); app.ptErr = false;
    const hx = view.querySelector('input[data-field="pt"]'); if (hx) hx.value = app.ptText;
    updateL0();
  }
  else if (f === "flip") { const n = parseInt(v, 10); if (n >= 0 && n <= 127) { app.flip = n; updateL0(); } }
  else if (f === "msg") { app.msg = v; app.tamper = -1; app.xtsTamper = -1; updateL3(); }
  else if (f === "aad") { app.aad = v; updateL3(); }
  else if (f === "sector") { const n = parseInt(v, 10); if (n >= 0 && n <= 0xffffffff) { app.sector = n; app.xtsTamper = -1; updateL3(); } }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  rerender();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Enter" && tag === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
  else if ((app.level === 1 || app.level === 2) && (e.key === "+" || e.key === "=")) setRound(app.round + 1);
  else if ((app.level === 1 || app.level === 2) && e.key === "-") setRound(app.round - 1);
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
(function () {
  const m = /^#(\d)(?:-(ecb|ctr|gcm|xts))?$/.exec(location.hash);
  if (m && +m[1] >= 1 && +m[1] <= NSTEPS) { app.level = +m[1] - 1; if (m[2]) app.mode = m[2]; }
})();
render();
</script>
</body>
</html>
