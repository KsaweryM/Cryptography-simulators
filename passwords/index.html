<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collisions and passwords explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  /* role colours = the slide colours: password / input sViolet, salt sAmber, digest sBrown,
     Bob / the server sTeal, Mallory sPink, Alice sIndigo; mechanisms neutral dark */
  --pw-b:#7E57C2; --pw-bg:#EBE5F5;
  --salt-b:#FFB300; --salt-bg:#FFE8B2;
  --dig-b:#8D6E63; --dig-bg:#EEE9E7;
  --srv-b:#26A69A; --srv-bg:#DEF2F0;
  --mal-b:#EC407A; --mal-bg:#FCE2EB;
  --alice:#5C6BC0; --bob:#26A69A; --mal:#C2185B;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E; --const-b:#4A5663; --const-bg:#222C37;
    --pw-b:#B39DDB; --pw-bg:#2A2142; --salt-b:#FFCA28; --salt-bg:#3A2E10; --dig-b:#BCAAA4; --dig-bg:#2E2522;
    --srv-b:#4DB6AC; --srv-bg:#12302D; --mal-b:#F48FB1; --mal-bg:#3A1A26; --alice:#9FA8DA; --bob:#4DB6AC; --mal:#F48FB1;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap;margin-right:12px;align-items:center}
.seg .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.r-pw{border-color:var(--pw-b);background:var(--pw-bg)}
.r-salt{border-color:var(--salt-b);background:var(--salt-bg)}
.r-dig{border-color:var(--dig-b);background:var(--dig-bg)}
.r-srv{border-color:var(--srv-b);background:var(--srv-bg)}
.r-mal{border-color:var(--mal-b);background:var(--mal-bg)}
.r-neu{border-color:var(--const-b);background:var(--const-bg)}
.chg{outline:2.5px solid var(--chg);outline-offset:-2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{border:1.5px solid var(--rule);border-radius:8px;padding:6px 12px;min-width:120px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--mono);font-size:18px}
.stat.r-mal{border-color:var(--mal-b)} .stat.r-srv{border-color:var(--srv-b)}
canvas{display:block;max-width:100%}
.days{display:grid;grid-template-columns:repeat(31,18px);gap:2px;margin:6px 0}
.days span{width:18px;height:18px;border-radius:3px;background:var(--sunken);border:1px solid var(--rule)}
.days span.hit{background:var(--pw-bg);border-color:var(--pw-b)}
.days span.rep{background:var(--chg);border-color:var(--chg)}
.days span.tgt{outline:2px solid var(--mal-b);outline-offset:-1px}
table.t{border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.t th{text-align:left;font-size:12px;color:var(--muted);padding:4px 10px;border-bottom:1px solid var(--rule)}
table.t td{padding:4px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t td.m{font-family:var(--mono);font-size:13px}
.cell{display:inline-block;border:1.5px solid;border-radius:5px;padding:0 6px;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.bytes{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;max-width:900px;font-family:var(--mono);font-size:11px}
.bytes span{text-align:center;border-radius:3px;padding:1px 0;background:var(--pw-bg);border:1px solid var(--pw-b)}
.bytes span.d{background:var(--chg);color:#fff;border-color:var(--chg);font-weight:700}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;margin:4px 0}
.chain .arr{color:var(--muted);font-size:11px}
.walk td{font-family:var(--mono);font-size:12.5px}
.walk tr.cur td{background:var(--chg-bg)}
.box{background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;display:inline-block}
.dial{display:flex;align-items:center;gap:12px;font-weight:600}
.dial input[type=range]{width:300px}
.code{font-family:var(--mono);font-size:13.5px;background:#191919;color:#F5F5F5;border-radius:8px;padding:10px 14px;white-space:pre;overflow:auto}
.code .k{color:#50B4FF;font-weight:600} .code .c{color:#50DC50;font-style:italic}
.viewer{border:1.5px solid var(--pw-b);background:var(--pw-bg);border-radius:8px;padding:8px 12px;min-height:44px;font-size:15px}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.flex > div{flex:1 1 320px}
.bar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;max-width:520px;margin:4px 0}
.bar span{display:block;height:100%;background:var(--mal-b);width:0}
@media (max-width:900px){.app{height:auto;display:block}.top{flex-wrap:wrap}.body{display:block}.side{border-right:0;border-bottom:1px solid var(--rule)}.main{display:block}}
</style>

<script>
"use strict";

/* ===================== core: SHA-256, MD5 with its block states, bcrypt, the toy rainbow table ===================== */
// CORE-BEGIN
const enc = s => new TextEncoder().encode(s);
const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
function concat(a, b) { const r = new Uint8Array(a.length + b.length); r.set(a, 0); r.set(b, a.length); return r; }

// ---------- SHA-256 (FIPS 180-4) ----------
const K256 = new Uint32Array([

  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
  0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

function sha256(msg) {
  const n = msg.length, total = ((n + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(msg); m[n] = 0x80;

  m[total - 5] = Math.floor(bits / 4294967296) & 255;

      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));

const sha256hex = s => hex(sha256(typeof s === "string" ? enc(s) : s));

// ---------- MD5 (RFC 1321), keeping the state after every 64-byte block ----------
const MD5_S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,

const MD5_K = new Int32Array(64);
for (let i = 0; i < 64; i++) MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
function md5Compress(st, m, off) {
  const X = new Int32Array(16);
  for (let i = 0; i < 16; i++) X[i] = m[off + 4 * i] | (m[off + 4 * i + 1] << 8) | (m[off + 4 * i + 2] << 16) | (m[off + 4 * i + 3] << 24);
  let a = st[0], b = st[1], c = st[2], d = st[3];

    let f, g;
    if (i < 16) { f = (b & c) | (~b & d); g = i; }
    else if (i < 32) { f = (d & b) | (~d & c); g = (5 * i + 1) & 15; }

// returns the state after every block (the last one is the digest) and the padded message
function md5Trace(msg) {
  const n = msg.length, total = ((n + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(msg); m[n] = 0x80;
  let bits = n * 8;
  for (let k = 0; k < 8; k++) { m[total - 8 + k] = bits & 255; bits = Math.floor(bits / 256); }

  for (let off = 0; off < total; off += 64) { st = md5Compress(st, m, off); states.push(md5StateHex(st)); }

const md5hex = b => md5Trace(b).digest;
// the first MD5 collision (Wang, Feng, Lai, Yu, 2004): B differs from A in 6 bytes (each by 0x80)
const WANG_A = Uint8Array.from(("d131dd02c5e6eec4693d9a0698aff95c2fcab58712467eab4004583eb8fb7f89" +
  "55ad340609f4b30283e488832571415a085125e8f7cdc99fd91dbdf280373c5b" +
  "d8823e3156348f5bae6dacd436c919c6dd53e2b487da03fd02396306d248cda0" +
  "e99f33420f577ee8ce54b67080a80d1ec69821bcb6a8839396f9652b6ff72a70").match(/../g), x => parseInt(x, 16));
const WANG_DIFF = [19, 45, 59, 83, 109, 123];
const WANG_B = WANG_A.slice(); for (const i of WANG_DIFF) WANG_B[i] ^= 0x80;

// ---------- bcrypt ($2b$), a port of the course's pure-Python module ----------
const PI_HEX = (
  "243f6a8885a308d313198a2e03707344a4093822299f31d0082efa98ec4e6c89452821e638d01377be5466cf34e90c6cc0ac29b7c97c50dd3f84d5b5b5470917" +

function rhoPath(x0, bits) {
  const at = new Map(), path = []; let x = x0;
  while (!at.has(x)) { at.set(x, path.length); path.push(x); x = rhoF(x, bits); }
  return { mu: at.get(x), lam: path.length - at.get(x), path: path };
}
// the tortoise and the hare, with two values only
function rhoFloyd(x0, bits) {
  let t = rhoF(x0, bits), h = rhoF(t, bits), calls = 3, meet = 1;
  while (t !== h) { t = rhoF(t, bits); h = rhoF(rhoF(h, bits), bits); calls += 3; meet++; }
  let a = null, b = null; t = x0;
  while (t !== h) { a = t; b = h; t = rhoF(t, bits); h = rhoF(h, bits); calls += 2; }
  return { meet: meet, a: a, b: b, y: t, calls: calls };
}

  if (ta.states[0] === tb.states[0] || ta.states[1] !== tb.states[1]) f.push("Wang: states after blocks 1 and 2");

  if (bcrypt("Kk4DQuMMfZL9o", 4, "cVWp4XaNU8a4v1uMRum2SO") !== "$2b$04$cVWp4XaNU8a4v1uMRum2SO026BWLIoQMD/TXg5uZV.0P.uO8m3YEm") f.push("bcrypt vector");

  if (writes !== 521 || 65 * 521 + 192 !== 34057) f.push("521 encryptions per key setup");

  if (rbWord(rbR(3, 0x9e75)) !== "iai" || rbWord(rbR(2, 0x9e75)) !== "iah") f.push("rainbow lookup");

}

function bReset() { const b = app.b; b.hist = new Map(); b.runs = 0; b.sum = 0; b.all = []; b.last = null; b.stamp = null; }

function bLoop() {

}

function updateMore() {
  const b = document.getElementById("more"); if (!b) return;
  const sc = scroller(), h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => { const sc = scroller(), h = sc === view ? view.clientHeight : window.innerHeight; sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" }); });
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "bn") { app.b.N = +el.dataset.n; app.b.run = false; bReset(); render(); }
  else if (a === "wbits") { rhoInit(+el.dataset.n, 0); render(); }
  else if (a === "wnew") { rhoInit(app.w.bits, Math.floor(Math.random() * Math.pow(2, app.w.bits))); render(); }
  else if (a === "wstep") { app.w.run = false; rhoStep(); updW(); }
  else if (a === "wrun") { app.w.run = !app.w.run; updW(); if (app.w.run) requestAnimationFrame(rhoLoop); }
  else if (a === "wres") { rhoInit(app.w.bits, app.w.x0); render(); }
  else if (a === "cmp") cmpMeasure(el);
  else if (a === "b1") { bOneRun(true); updB(); }
  else if (a === "bgo") { app.b.run = !app.b.run; el.textContent = app.b.run ? L().stop : L().nonstop; if (app.b.run) requestAnimationFrame(bLoop); }
  else if (a === "br") { app.b.run = false; bReset(); render(); }
  else if (a === "tab") { if (app.s.st) app.s.st.running = false; app.s.tab = +el.dataset.i; app.s.st = null; render(); }
  else if (a === "atk") atkStart();
  else if (a === "atkr") { if (app.s.st) app.s.st.running = false; app.s.st = null; updS(); }
  else if (a === "rbbuild") { const r = app.r; r.tab = rbBuild(r.m, r.t, 7); r.look = null; r.shown = 0; updR(); }
  else if (a === "rbrand") { rbNewWord(Math.floor(Math.random() * RB_N)); const i = view.querySelector('input[data-field="rw"]'); if (i) i.value = rbWord(app.r.word); }
  else if (a === "rbnext") { app.r.shown++; updR(); }
  else if (a === "rball") { app.r.shown = 1e9; updR(); }
  else if (a === "measure") measure();
  else if (a === "dev") { app.k.dev = el.dataset.d; if (app.k.dev === "cpu" && app.k.t6 === null) measure(); view.querySelectorAll('[data-action="dev"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === app.k.dev))); updK(); }
  else if (a === "iplay") { insideInit(); const an = app.k.anim; if (an.pos >= an.writes.length) { an.pos = 0; an.vals = PI_WORDS.slice(); } an.play = !an.play; el.textContent = an.play ? L().pause : L().play; if (an.play) requestAnimationFrame(insideLoop); }
  else if (a === "istep") { insideInit(); insideAdvance(1); insideDraw(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field; if (!f) return;
  const v = e.target.value;
  if (f === "suffix" || f === "p1" || f === "p2") { app.c[f] = v.replace(/\0/g, ""); updC(); updV(); }
  else if (f === "rm") app.r.m = Math.max(10, Math.min(3000, +v || 10));
  else if (f === "rt") app.r.t = Math.max(2, Math.min(200, +v || 2));
  else if (f === "rw") { const w = v.toLowerCase(); if (/^[a-z]{3}$/.test(w)) rbNewWord(rbIndex(w)); }
  else if (f === "rsalt") { app.r.salt = e.target.checked; app.r.saltV = Math.floor(Math.random() * 65536); app.r.look = null; app.r.shown = 0; updR(); }
  else if (f === "cost") { app.k.cost = +v; updK(); }
});
document.getElementById("steps").addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b) goTo(+b.dataset.step); });
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowRight" && app.level < SECS.length - 1) { e.preventDefault(); goTo(app.level + 1); }
  else if (e.key === "ArrowLeft" && app.level > 0) { e.preventDefault(); goTo(app.level - 1); }
});

const SELF_FAILS = selfTest();
// #1.2 opens section 1.2; #3 opens the first section of step 3; step 4 is one section, so #4.2 is its 2nd card
function readHash() {
  const hm = /^#(\d)(?:\.(\d+))?$/.exec(location.hash); if (!hm) return;
  const full = hm[2] ? hm[1] + "." + hm[2] : hm[1];
  let i = SECS.indexOf(full);
  app.card = 1;
  if (i < 0) { i = SECS.findIndex(x => x === hm[1] || x.startsWith(hm[1] + ".")); if (hm[1] === "4" && hm[2]) app.card = Math.max(1, +hm[2]); }
  if (i >= 0) app.level = i;
}
window.addEventListener("hashchange", () => { if (location.hash !== hashStr()) { app.b.run = false; if (app.w) app.w.run = false; readHash(); render(); view.scrollTop = 0; scrollToCard(); } });
readHash();
render();
requestAnimationFrame(scrollToCard);
</script>
</body>
