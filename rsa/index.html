<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSA explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  --key-b:#E2A60E;   --key-bg:#FDF3DC;
  --ctr-b:#2FA84F;   --ctr-bg:#E3F4E8;
  --non-b:#2F6FDB;   --non-bg:#E5EDFB;
  --ct-b:#8A5CD8;   --ct-bg:#F1EAFD;
  --p:#2F6FDB; --z:#9A6B00; --c:#7446C4;
  --g0:#2F6FDB; --g1:#2FA84F; --g2:#E5484D; --g3:#E2A60E;
  --eve-bg:#FDE9EA;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
    --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
    --ct-b:#B596F5; --ct-bg:#2A2142;
    --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
    --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
    --eve-bg:#3A1A1C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
  --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
  --ct-b:#B596F5; --ct-bg:#2A2142;
  --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
  --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
  --eve-bg:#3A1A1C;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h3{margin:0}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.schwrap{overflow-x:auto}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:12px 18px;font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:12px;font-weight:400;opacity:.8}
.box .f{font-family:var(--mono);font-size:13.5px;font-weight:500;opacity:.95}

/* roles: one colour per role in every step */
.role-pub{border-color:var(--ctr-b);background:var(--ctr-bg)}
.role-sec{border-color:var(--key-b);background:var(--key-bg)}
.role-msg{border-color:var(--non-b);background:var(--non-bg)}
.role-ct{border-color:var(--ct-b);background:var(--ct-bg)}
.role-eve{border-color:var(--g2);background:var(--eve-bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.v{font-family:var(--mono);font-weight:600}
.vbig{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25;word-break:break-all}

/* step 1: the schematic */
.sch1{position:relative;width:890px;height:484px}
.sch1 .arrows{position:absolute;left:0;top:0}
.node{position:absolute;border-radius:10px;padding:8px 12px;border:1.5px solid;color:var(--ink);overflow:hidden}
.node .nh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.node small{display:block;font-size:12px;color:var(--muted)}
.node input{width:100%;margin-top:6px;font-size:20px;font-weight:600;padding:4px 8px}
.node textarea{width:100%;margin-top:6px;font-size:15px;resize:none;height:44px;padding:5px 8px}
.kbox{position:absolute;border:1.5px solid;border-radius:10px;padding:8px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.kbox:hover{box-shadow:0 0 0 3px var(--chg)}
.kbox.role-pub:hover{background:var(--ctr-bg)} .kbox.role-sec:hover{background:var(--key-bg)}
.kbox .nh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.kbox small{font-size:12px;color:var(--muted)}
.kbox .kv{font-family:var(--mono);font-size:17px;font-weight:600;word-break:break-all}
.s1-pub{left:120px;top:0;width:310px;min-height:84px}
.s1-prv{left:500px;top:0;width:310px;min-height:84px}
.s1-m{left:0;top:146px;width:172px;height:132px}
.s1-enc{position:absolute;left:200px;top:172px;width:150px;height:80px}
.s1-c{left:380px;top:146px;width:170px;height:132px}
.s1-dec{position:absolute;left:580px;top:172px;width:150px;height:80px}
.s1-out{left:758px;top:146px;width:132px;height:132px}
.s1-eve{left:180px;top:326px;width:570px;min-height:134px}
.s1-who{position:absolute;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.clist{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.45;margin-top:4px;word-break:break-word}
.eveline{font-size:13.5px;margin-top:3px}
.ftab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:4px}
.ftab td{padding:3px 10px 3px 0;white-space:nowrap}
.ftab td.lbl{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted)}
.ltab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:6px}
.ltab td{padding:3px 6px;text-align:center;min-width:2.6em;border:1px solid var(--rule)}
.ltab td.lbl{font-family:var(--sans);font-size:12.5px;font-weight:600;text-align:left;border:0;padding-right:12px;white-space:nowrap}
.ltab tr.rm td:not(.lbl){background:var(--non-bg)}
.ltab tr.rc td:not(.lbl){background:var(--ct-bg)}
.ltab td.same{outline:2.5px solid var(--chg);outline-offset:-2px;font-weight:700}
.tablewrap{overflow-x:auto}

/* step 2: the key table and Euclid */
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.presets button{font-size:13px;padding:4px 10px}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.inrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;flex-direction:column;border-radius:8px;padding:6px 10px;border:1.5px solid;font-weight:600;font-size:13.5px}
.chip small{font-weight:400;color:var(--muted);font-size:12px}
.chip input{margin-top:4px;width:12em;font-size:16px;font-weight:600}
.ktab{border-collapse:collapse;width:100%;font-size:14.5px}
.ktab td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ktab td.num{width:40px}
.ktab td.val{font-family:var(--mono)}
.ktab td.val .okline,.ktab td.val .note,.ktab td.val .err{font-family:var(--sans)}
.sumline .st{font-family:var(--sans);font-size:14px}
.ktab tr.todo td{color:var(--muted);opacity:.6}
.badge{display:inline-flex;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--surface);font-family:var(--mono);font-weight:700;align-items:center;justify-content:center}
.etab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:4px}
.etab th{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:4px 22px 4px 0;border-bottom:1.5px solid var(--rule)}
.etab td{padding:4px 22px 4px 0;white-space:nowrap;border-bottom:1px solid var(--rule)}
.etab tr.start td{color:var(--muted)}
.etab tr.cur td{background:var(--chg-bg)}
.etab tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--chg)}
.etab tr.one td{background:var(--ctr-bg)}
.etab tr.hide td{opacity:.35}
.etab tr.hide td:nth-child(n+4){visibility:hidden}
.etab .tcoef{color:var(--chg);font-weight:700}
.result{margin-top:12px;font-size:14.5px;line-height:1.8}
.twokeys{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;margin-top:4px}
.twokeys .kbox{position:static;min-width:300px;flex:1 1 300px}
.trash{margin-top:12px;border:1.5px dashed var(--rule);border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--muted)}

/* step 3: square and multiply */
.formula{font-family:var(--mono);font-size:24px;font-weight:600;margin:6px 0 4px;word-break:break-all}
.formula sup{font-size:15px}
.bits{display:inline-flex;gap:2px;align-items:flex-start;flex-wrap:wrap}
.bitcol{display:flex;flex-direction:column;align-items:center;gap:1px}
.bit{display:inline-block;min-width:22px;height:26px;line-height:26px;text-align:center;font-family:var(--mono);font-size:14px;border-radius:4px;background:var(--sunken);color:var(--muted);padding:0 2px}
.bit.one{background:var(--ink);color:var(--surface)}
.bit.cur{background:var(--chg);color:#fff}
.bitcol small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ptab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:8px}
.ptab th{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:4px 14px 4px 0;border-bottom:1.5px solid var(--rule)}
.ptab td{padding:5px 14px 5px 0;white-space:nowrap;border-bottom:1px solid var(--rule)}
.ptab tr.cur td{background:var(--chg-bg)}
.ptab tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--chg)}
.ptab tr.hide td{opacity:.35}
.ptab tr.hide td:nth-child(n+3){visibility:hidden}
.ptab td.skip{color:var(--muted)}
.ptab td.res{font-weight:700}
.sumline{font-family:var(--mono);font-size:15px;margin-top:12px;line-height:1.8;word-break:break-word}
.sumline b{color:var(--chg)}

/* step 4 */
.evebar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;margin:8px 0 4px;max-width:520px}
.evebar span{display:block;height:100%;background:var(--g2);width:0}
.bign{font-family:var(--mono);font-size:11.5px;line-height:1.35;word-break:break-all;background:var(--sunken);border-radius:8px;padding:8px 10px;max-height:118px;overflow:auto;color:var(--muted)}
.ul{margin:4px 0 0;padding-left:20px}
.ul li{margin:4px 0}
.found{font-size:16px;margin-top:8px}

@media (max-width:900px){
  .app{height:auto;display:block}
  .top{flex-wrap:wrap}
  .body{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main{display:block}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><a class="home" id="home" href="../index.html"></a><h1 id="title"></h1><p id="intro"></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
      <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" aria-label="Steps">
      <div id="steps"></div>
      <div class="sidefoot"><div id="selftest"></div><div id="keys"></div></div>
    </nav>
    <main class="main">
      <div class="modhead"><span id="mhGrp"></span><h2 id="mhTitle"></h2><p id="mhSub"></p></div>
      <div class="content" id="view"></div>
      <button id="more" class="more" hidden><span id="moreTxt"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v10M3 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </main>
  </div>
</div>

<script>
"use strict";

/* ===================== RSA core (textbook RSA, small numbers, BigInt) ===================== */
// CORE-BEGIN
const MAX_PRIME = 1000000000n;   // p and q below 10^9: trial division stays fast

function gcd(a, b) {
  while (b !== 0n) { const r = a % b; a = b; b = r; }
  return a;
}
// the smallest divisor of n > 1 (n itself if n is prime), by trying divisors
function smallestFactor(n) {
  if (n % 2n === 0n) return 2n;
  for (let i = 3n; i * i <= n; i += 2n) if (n % i === 0n) return i;
  return n;
}
function isPrime(n) { return n >= 2n && smallestFactor(n) === n; }

// Euclid's table: a = q * b + r, then (a, b) <- (b, r) until r = 0
function euclidRows(a, b) {
  const rows = [];
  while (b !== 0n) {
    const q = a / b, r = a % b;
    rows.push({ a: a, b: b, q: q, r: r });
    a = b; b = r;
  }
  return rows;
}
// extended Euclid: every remainder is written as r = s * phi + t * e.
// The two start rows: phi = 1 * phi + 0 * e and e = 0 * phi + 1 * e.
// Each next row = (the row two above) - q * (the row above).
function extEuclid(phi, e) {
  const rows = euclidRows(phi, e);
  const mix = [{ r: phi, s: 1n, t: 0n }, { r: e, s: 0n, t: 1n }];
  for (const row of rows) {
    const A = mix[mix.length - 2], B = mix[mix.length - 1];
    mix.push({ r: row.r, s: A.s - row.q * B.s, t: A.t - row.q * B.t });
  }
  const last = mix[mix.length - 2];          // the row with the last non-zero remainder
  const g = last.r;
  let d = null;
  if (g === 1n) { d = last.t % phi; if (d < 0n) d += phi; }
  return { rows: rows, mix: mix, g: g, t: last.t, s: last.s, d: d };
}
function modInverse(e, m) { return extEuclid(m, e).d; }

// base^exp mod n, right to left: square the power every bit, multiply it in where the bit is 1
function modPowTrace(base, exp, n) {
  const rows = [];
  let power = base % n, result = 1n % n, k = 0, prev = null;
  let x = exp;
  while (x > 0n) {
    if (k > 0) { prev = power; power = (power * power) % n; }

let lang = "en";

try { const s = localStorage.getItem("cryptoSimLang"); if (s === "pl" || s === "en") lang = s; } catch (e) {}

const app = {

app.K = makeKeys(17n, 11n, 7n);

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
const keyOK = () => app.K && app.K.ok;
const pubK = () => ({ n: app.K.n, e: app.K.e });
const prvK = () => ({ n: app.K.n, d: app.K.d });
const mOK = () => !app.mErr && keyOK() && app.m < app.K.n;
function textNums() { return textToNums(app.msg); }
function textErr() {
  if (!keyOK()) return null;
  const a = Array.from(app.msg);
  if (a.length === 0) return L().errEmpty;
  for (const ch of a) { const c = BigInt(ch.codePointAt(0)); if (c >= app.K.n) return L().errText(ch, c, app.K.n); }
  return null;
}
const sup = (b, x) => b + "<sup>" + x + "</sup>";

function updateL0() {
  const cEl = document.getElementById("s1c");
  if (!cEl) return;
  const t = L(), K = app.K;
  const out = document.getElementById("s1out"), eve = document.getElementById("s1eve"), det = document.getElementById("s1det"), me = document.getElementById("s1merr");
  me.textContent = "";
  let cShow = "";
  if (app.mode === "num") {
    if (!mOK()) {
      me.textContent = t.errM(K.n - 1n);
      cEl.innerHTML = out.innerHTML = det.innerHTML = ""; cShow = "?";
    } else {
      const c = encrypt(app.m, K), back = decrypt(c, K);
      cEl.innerHTML = '<div class="vbig">' + c + "</div>";
      out.innerHTML = '<div class="vbig">' + back + "</div>";
      cShow = String(c);
      det.innerHTML = '<table class="ftab">' +
        '<tr data-action="pow" data-dir="enc" style="cursor:pointer"><td class="lbl">' + t.rowAlice + "</td><td>c = " + sup(app.m, K.e) + " mod " + K.n + " = <b>" + c + "</b></td></tr>" +
        '<tr data-action="pow" data-dir="dec" style="cursor:pointer"><td class="lbl">' + t.rowBob + "</td><td>m = " + sup(c, K.d) + " mod " + K.n + " = <b>" + back + "</b></td></tr></table>" +
        '<p class="note" style="margin:6px 0 0">' + t.clickPow + "</p>";
    }
  } else {
    const er = textErr();
    if (er) {
      me.textContent = er; cEl.innerHTML = out.innerHTML = det.innerHTML = ""; cShow = "?";
    } else {
      const ms = textNums(), cs = ms.map(m => encrypt(m, K)), back = cs.map(c => decrypt(c, K));
      let k = 0, len = 0;
      while (k < cs.length && (k === 0 || len + String(cs[k]).length + 1 <= 36)) { len += String(cs[k]).length + 1; k++; }
      const shown = cs.slice(0, k).join(" ") + (k < cs.length ? " …" : "");
      cEl.innerHTML = '<div class="clist">' + shown + "</div>";
      out.innerHTML = '<div class="vbig" style="font-size:17px;word-break:break-word">' + esc(numsToText(back)) + "</div>";
      cShow = shown;
      det.innerHTML = '<div class="tablewrap">' + letterTable(ms, cs, back, false) + "</div>" + '<p class="note" style="margin:8px 0 0">' + t.textNote + "</p>";
    }
  }
  eve.innerHTML = '<div class="eveline"><b>' + t.eveSees + ':</b> <span class="v">n = ' + K.n + ", e = " + K.e + ", c = " + esc(cShow) + "</span></div>" +
    '<div class="eveline"><b>' + t.eveNot + ':</b> <span class="v">d</span> ' + t.eveNotWhat + "</div>" +
    '<div class="eveline note">' + t.eveFactor(K.n, K.p < K.q ? K.p : K.q, K.p < K.q ? K.q : K.p) + "</div>";
}
function letterTable(ms, cs, back, markSame) {
  const t = L();
  const cnt = new Map();
  cs.forEach(c => cnt.set(String(c), (cnt.get(String(c)) || 0) + 1));
  const chars = Array.from(app.msg);
  const row = (lbl, cls, arr) => '<tr class="' + cls + '"><td class="lbl">' + lbl + "</td>" + arr.map(x => "<td>" + x + "</td>").join("") + "</tr>";
  const vis = ch => ch === " " ? "␣" : esc(ch);
  let h = '<table class="ltab">' + row(t.rowLetter, "", chars.map(vis)) + row(t.rowCode, "rm", ms.map(String));
  h += '<tr class="rc"><td class="lbl">' + t.rowC + "</td>" + cs.map(c => '<td class="' + (markSame && cnt.get(String(c)) > 1 ? "same" : "") + '">' + c + "</td>").join("") + "</tr>";
  if (back) h += row(t.rowBack, "rm", back.map(String)) + row(t.rowLetter2, "", Array.from(numsToText(back)).map(vis));
  return h + "</table>";
}

function fmtMix(r, s, tt, phi, e, hot) {

function euclidHTML(K) {

  h += '<tr class="start"><td>' + t.start + "</td><td></td><td></td><td></td><td>" + fmtMix(phi, 1n, 0n, phi, e, false) + "</td></tr>";

  x.rows.forEach((r, i) => {
    const m = x.mix[i + 2];

    const isLastNZ = r.r === x.g && i === N - 2;

      (r.r === 0n ? '<span class="note">' + t.stopRow + "</span>" : fmtMix(r.r, m.s, m.t, phi, e, isLastNZ && x.g === 1n)) + "</td></tr>";
  });

  h += "</table></div>";

    '</button><button data-action="eu-next"' + (shown >= N ? " disabled" : "") + ">" + t.bNext + '</button><button data-action="eu-all"' + (shown >= N ? " disabled" : "") + ">" + t.bAll +
    '</button><span class="note">' + t.rowK(shown, N) + "</span></div>";

    if (x.g === 1n) {
      const d = x.d, ed = e * d;
      h += '<div class="result">' + t.resOne(e, phi, x.t) + "<br>" + (x.t < 0n ? t.resNeg(x.t, phi, d) + "<br>" : "") + t.resD(d) + "<br>" +

}

/* ---------- step 3: one power ---------- */
function render2() {
  const t = L();
  if (!keyOK()) return errCard();
  const tab = (d, s) => '<button data-action="dir" data-d="' + d + '" aria-pressed="' + (app.dir === d) + '">' + s + "</button>";
  return '<div class="card"><div class="cardhead"><h3>' + t.cardPow + '</h3><span class="tabs">' + tab("enc", t.tabEnc) + tab("dec", t.tabDec) + "</span></div>" +
    (app.dir === "enc" ? '<label class="chip role-msg" style="display:inline-flex">' + t.baseM + '<input data-field="m" inputmode="numeric" spellcheck="false" value="' + esc(app.mText) + '"></label>' : "") +
    '<div id="s3body"></div></div>';
}
function powSetup() {
  const K = app.K;
  if (!mOK()) return null;
  const c = encrypt(app.m, K);
  return app.dir === "enc" ? { base: app.m, exp: K.e, n: K.n, en: "e", bn: "m", rn: "c", role: "role-ct" }
                           : { base: c, exp: K.d, n: K.n, en: "d", bn: "c", rn: "m", role: "role-msg" };
}
function updateL2() {
  const body = document.getElementById("s3body");
  if (!body) return;
  const t = L(), S = powSetup();
  if (!S) { body.innerHTML = '<p class="err">' + t.errM(app.K.n - 1n) + "</p>"; return; }
  const tr = modPowTrace(S.base, S.exp, S.n), R = tr.rows, N = R.length;
  const shown = app.pStep < 0 || app.pStep > N ? N : app.pStep;
  const cur = shown - 1;
  const bin = S.exp.toString(2);
  const ones = R.filter(r => r.bit).map(r => r.k).reverse();
  const parts = ones.length > 1 && ones.length <= 12 ? ones.map(k => String(1n << BigInt(k))).join(" + ") : "";
  let h = '<div class="formula">' + S.rn + " = " + sup(S.base, S.exp) + " mod " + S.n + "</div>";
  h += "<p style=\"margin:4px 0\">" + t.expIs(S.en, S.exp, bin, parts) + "</p>";
  // bits, the most significant first
  h += '<div class="bits">';
  for (let k = N - 1; k >= 0; k--) {
    const b = R[k].bit;
    h += '<span class="bitcol"><span class="bit' + (k === cur && shown < N ? " cur" : b ? " one" : "") + '">' + b + "</span>" + (N <= 20 ? "<small>" + (1n << BigInt(k)) + "</small>" : "") + "</span>";
  }
  h += "</div>";
  h += '<div class="tablewrap"><table class="ptab"><tr><th>' + t.thK + "</th><th>" + t.thBit + "</th><th>" + t.thPow + "</th><th>" + t.thMul + "</th><th>" + t.thRes + "</th></tr>";
  R.forEach((r, i) => {
    const cls = i >= shown ? "hide" : (i === cur && shown < N ? "cur" : "");
    const pw = sup(S.base, String(1n << BigInt(r.k)));
    const how = r.k === 0 ? pw + " mod " + S.n + " = <b>" + r.power + "</b>" + (S.base >= S.n ? "" : ' <span class="note">(' + t.first + ")</span>")
                          : pw + " = " + r.prev + "² = " + (r.prev * r.prev) + " → " + t.mod + " " + S.n + " = <b>" + r.power + "</b>";
    const mul = r.bit ? r.before + " × " + r.power + " = " + (r.before * r.power) + " → " + t.mod + " " + S.n + " = <b>" + r.result + "</b>" : t.skip;
    h += '<tr class="' + cls + '"><td>' + r.k + "</td><td>" + r.bit + "</td><td>" + how + '</td><td class="' + (r.bit ? "" : "skip") + '">' + mul + '</td><td class="res">' + r.result + "</td></tr>";
  });
  h += "</table></div>";
  h += '<div class="btns"><button data-action="pw-reset">' + t.bReset + '</button><button data-action="pw-prev"' + (shown <= 0 ? " disabled" : "") + ">" + t.bPrev +
    '</button><button data-action="pw-next"' + (shown >= N ? " disabled" : "") + ">" + t.bNext + '</button><button data-action="pw-all"' + (shown >= N ? " disabled" : "") + ">" + t.bAll +
    '</button><span class="note">' + t.rowK(shown, N) + "</span></div>";
  if (shown === N) {
    const used = R.filter(r => r.bit).reverse();
    h += '<div class="sumline"><span class="st">' + t.sumTitle + "</span><br>" + sup(S.base, S.exp) + " = " + used.map(r => sup(S.base, String(1n << BigInt(r.k)))).join(" · ") +
      " → " + used.map(r => String(r.power)).join(" · ") + " " + t.mod + " " + S.n + " = <b>" + tr.result + "</b></div>";
    const sq = N - 1, mul = used.length;
    const naive = S.exp - 1n;
    h += '<p class="note" style="margin:8px 0 0">' + t.count(sq, mul, naive) + " " + t.countBig + "</p>";
    h += '<div class="btns">' + (app.dir === "enc" ? '<button class="dark" data-action="dir" data-d="dec">' + t.goDec + "</button>" : '<button data-action="dir" data-d="enc">' + t.goEnc + "</button>") + "</div>";
  }
  body.innerHTML = h;
}
function pwGo(k) {
  const S = powSetup(); if (!S) return;
  const N = modPowTrace(S.base, S.exp, S.n).rows.length;
  app.pStep = Math.max(0, Math.min(N, k));
  if (app.pStep === N) app.pStep = -1;

}
function curPStep() {
  const S = powSetup(); if (!S) return 0;
  const N = modPowTrace(S.base, S.exp, S.n).rows.length;

/* ---------- step 4: textbook RSA is not enough ---------- */
function render3() {
  const t = L();
  if (!keyOK()) return errCard();
  return '<div class="card"><h3>' + t.cardSame + '</h3><div id="s4same"></div></div>' +
    '<div class="card"><h3>' + t.cardGuess + '</h3><label class="chip role-msg" style="display:inline-flex">' + t.baseM +
      '<input data-field="m" inputmode="numeric" spellcheck="false" value="' + esc(app.mText) + '"></label><div id="s4guess"></div>' +
      '<hr style="border:0;border-top:1px solid var(--rule);margin:14px 0"><p style="margin:0 0 6px">' + t.bigIntro + "</p>" +
      '<details><summary class="note" style="cursor:pointer">' + t.showN + '</summary><div class="bign">' + TASK7_N + "</div></details>" +
      '<div class="btns"><button class="dark" data-action="guess-big" id="bigBtn">' + t.bGuessBig + '</button></div><div id="s4big"></div></div>' +

    '<div class="card"><h3>' + t.cardLeak + '</h3><p style="margin:0 0 6px">' + t.leakIntro + '</p><div id="s4leak"></div></div>';
}
function updateL3() {
  const same = document.getElementById("s4same");
  if (!same) return;
  const t = L(), K = app.K;
  // same message, same ciphertext
  const er = textErr();
  if (er) same.innerHTML = '<p class="err">' + er + "</p>";
  else {
    const ms = textNums(), cs = ms.map(m => encrypt(m, K));
    const rep = new Set(ms.map(String)).size < ms.length;
    same.innerHTML = '<p class="note" style="margin:0 0 4px">' + t.sameNote + '</p><div class="tablewrap">' + letterTable(ms, cs, null, true) + "</div>" +
      (rep ? "" : '<p class="note">' + t.sameNone + "</p>");
  }
  // guess and check
  const g = document.getElementById("s4guess");
  if (!mOK()) g.innerHTML = '<p class="err">' + t.errM(K.n - 1n) + "</p>";
  else {
    const c = encrypt(app.m, K);
    const lim = K.n < 10000n ? K.n : 10000n;
    let h = '<p style="margin:8px 0 4px">' + t.guessIntro(c, K.n, K.e) + ' <span class="note">(' + t.guessRange(lim - 1n) + ")</span></p>" +
      '<div class="btns"><button class="dark" data-action="guess">' + t.bGuess + "</button></div>";
    const G = app.guess;
    if (G && G.c === c && G.n === K.n && G.e === K.e) {
      h += '<div class="found">' + (G.found !== null ? '<span class="okline">' + t.found(G.found, G.tries, G.ms) + "</span>" : '<span class="badline">' + t.notFound(G.tries) + "</span>") + "</div>";
      h += '<p class="note" style="margin:6px 0 2px">' + t.lastTries + '</p><table class="ftab">' + G.last.map(r =>
        "<tr" + (r.hit ? ' style="color:var(--ok);font-weight:700"' : "") + "><td>" + sup(r.g, K.e) + " mod " + K.n + " = " + r.c + "</td><td>" + (r.hit ? "= c ✓" : "≠ c") + "</td></tr>").join("") + "</table>";
    }
    g.innerHTML = h;
  }
  // the 2048-bit run
  const b = document.getElementById("s4big");
  if (b) {
    const B = app.big;
    if (!B) b.innerHTML = "";
    else if (B.found === null) b.innerHTML = '<div class="evebar"><span style="width:' + (B.tries / 100) + '%"></span></div><span class="note">' + t.bigRun(B.tries) + "</span>";
    else b.innerHTML = '<div class="evebar"><span style="width:' + (B.tries / 100) + '%"></span></div><div class="found okline">' + t.bigFound(B.found, B.tries, (B.ms / 1000).toFixed(2)) + "</div>";
    const btn = document.getElementById("bigBtn"); if (btn) btn.disabled = !!(B && B.found === null);
  }
  // a leaked key

  else {
    const cs = textNums().map(m => encrypt(m, K));
    let h = '<table class="ltab"><tr class="rc"><td class="lbl">' + t.leakRec + "</td>" + cs.map(c => "<td>" + c + "</td>").join("") + "</tr>";
    if (app.leaked) {
      const back = cs.map(c => decrypt(c, K));
      h += '<tr class="rm"><td class="lbl">' + t.leakOpen + "</td>" + back.map(m => "<td>" + m + "</td>").join("") + "</tr>" +
        '<tr><td class="lbl"></td>' + Array.from(numsToText(back)).map(ch => "<td><b>" + (ch === " " ? "␣" : esc(ch)) + "</b></td>").join("") + "</tr>";
    }
    h += "</table>";
    lk.innerHTML = '<div class="tablewrap">' + h + '</div><div class="btns"><button class="' + (app.leaked ? "" : "dark") + '" data-action="leak">' + (app.leaked ? t.bUnleak : t.bLeak) + "</button></div>" +
      (app.leaked ? '<div class="why">' + t.leakNote + "</div>" : "");

}
function runGuess() {
  const K = app.K; if (!mOK()) return;
  const c = encrypt(app.m, K), lim = K.n < 10000n ? K.n : 10000n;
  const t0 = performance.now();
  let found = null, tries = 0;
  const last = [];
  for (let g = 0n; g < lim; g++) {
    tries++;
    const cg = encrypt(g, K);
    last.push({ g: g, c: cg, hit: cg === c });
    if (last.length > 4) last.shift();
    if (cg === c) { found = g; break; }
  }
  app.guess = { c: c, n: K.n, e: K.e, found: found, tries: tries, last: last, ms: Math.max(1, Math.round(performance.now() - t0)) };
  updateL3();
}
function runBig() {
  if (app.big && app.big.found === null) return;
  const run = ++app.bigRun;
  app.big = { tries: 0, found: null, ms: 0 };
  const t0 = performance.now();
  let g = 0n;
  const pub = { n: TASK7_N, e: TASK7_E };
  function chunk() {
    if (run !== app.bigRun) return;
    const end = performance.now() + 25;
    while (performance.now() < end && g < 10000n) {
      app.big.tries++;
      if (encrypt(g, pub) === TASK7_C) { app.big.found = g; break; }
      g++;
    }
    app.big.ms = performance.now() - t0;
    if (app.big.found === null && g >= 10000n) app.big.found = "?";
    if (app.level === 3) updateL3();
    if (app.big.found === null) setTimeout(chunk, 0);
  }
  updateL3();
  setTimeout(chunk, 0);
}

function keysChanged() {
  const ok = /^\d{1,12}$/.test(app.pText.trim()) && /^\d{1,12}$/.test(app.qText.trim()) && /^\d{1,24}$/.test(app.eText.trim());
  app.inErr = !ok;
  if (ok) app.K = makeKeys(BigInt(app.pText.trim()), BigInt(app.qText.trim()), BigInt(app.eText.trim()));
  else app.K = { ok: false, err: null };
  app.eStep = -1; app.pStep = -1; app.guess = null;

    const pr = PRESETS[+b.dataset.i];

/* ---------- events ---------- */
const view = document.getElementById("view");
/* "more below" button: shown while part of the page is still below the screen */
function scroller() { return view.scrollHeight > view.clientHeight + 1 ? view : document.scrollingElement; }
function updateMore() {
  const b = document.getElementById("more");
  if (!b) return;
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => {
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "go") goTo(+el.dataset.to);
  else if (a === "pow") { app.dir = el.dataset.dir; app.pStep = -1; goTo(2); }
  else if (a === "mode") { app.mode = el.dataset.m; render(); }
  else if (a === "preset") {
    const pr = PRESETS[+el.dataset.i];
    app.pText = String(pr[0]); app.qText = String(pr[1]); app.eText = String(pr[2]);
    ["p", "q", "e"].forEach((f, i) => { const inp = view.querySelector('input[data-field="' + f + '"]'); if (inp) inp.value = String(pr[i]); });
    keysChanged();
  }
  else if (a === "sete") { app.eText = el.dataset.e; const inp = view.querySelector('input[data-field="e"]'); if (inp) inp.value = app.eText; keysChanged(); }
  else if (a === "eu-reset" || a === "eu-prev" || a === "eu-next" || a === "eu-all") {
    const N = app.K.ext.rows.length, cur = app.eStep < 0 ? N : app.eStep;
    let k = a === "eu-reset" ? 0 : a === "eu-prev" ? cur - 1 : a === "eu-next" ? cur + 1 : N;
    k = Math.max(0, Math.min(N, k));
    app.eStep = k === N ? -1 : k;
    document.getElementById("s2euc").innerHTML = euclidHTML(app.K);
  }
  else if (a === "dir") { app.dir = el.dataset.d; app.pStep = -1; render(); }
  else if (a === "pw-reset") pwGo(0);
  else if (a === "pw-prev") pwGo(curPStep() - 1);
  else if (a === "pw-next") pwGo(curPStep() + 1);
  else if (a === "pw-all") pwGo(1e9);
  else if (a === "guess") runGuess();
  else if (a === "guess-big") runBig();
  else if (a === "leak") { app.leaked = !app.leaked; updateL3(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = e.target.value;
  if (f === "m") setM(v);
  else if (f === "msg") { app.msg = v; updateAll(); }
  else if (f === "p" || f === "q" || f === "e") { app[f + "Text"] = v; keysChanged(); }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Enter" && tag === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
  else if (app.level === 2 && (e.key === "n" || e.key === " ")) { e.preventDefault(); pwGo(curPStep() + 1); }
  else if (app.level === 2 && e.key === "p") pwGo(curPStep() - 1);
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
const startStep = parseInt(location.hash.slice(1), 10);
if (startStep >= 1 && startStep <= 4) app.level = startStep - 1;
render();
</script>
