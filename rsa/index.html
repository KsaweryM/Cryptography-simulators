<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSA explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  /* role colours = the slide colours of the RSA lecture: public key sTeal light, private key sTeal full,
     message sViolet, ciphertext sBrown, shared symmetric key sAmber, Alice sIndigo, Bob sTeal, Eve sPink */
  --key-b:#00796B;   --key-bg:#26A69A;  --key-ink:#0B2421;
  --ctr-b:#26A69A;   --ctr-bg:#DEF2F0;
  --non-b:#7E57C2;   --non-bg:#EBE5F5;
  --ct-b:#8D6E63;   --ct-bg:#EEE9E7;
  --sym-b:#FFB300;  --sym-bg:#FFE8B2;
  --alice:#5C6BC0; --bob:#26A69A; --evec:#EC407A;
  --gok-b:#2FA84F;  --gok-bg:#E3F4E8;
  --p:#2F6FDB; --z:#9A6B00; --c:#7446C4;
  --g0:#2F6FDB; --g1:#2FA84F; --g2:#EC407A; --g3:#E2A60E;
  --eve-bg:#FCE2EB;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --const-b:#4A5663; --const-bg:#222C37; --key-b:#80CBC4; --key-bg:#26A69A; --key-ink:#0B2421;
    --ctr-b:#4DB6AC; --ctr-bg:#12302D; --non-b:#B39DDB; --non-bg:#2A2142;
    --ct-b:#BCAAA4; --ct-bg:#2E2522; --sym-b:#FFCA28; --sym-bg:#3A2E10;
    --alice:#9FA8DA; --bob:#4DB6AC; --evec:#F48FB1; --gok-b:#4CC877; --gok-bg:#15301E;
    --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
    --g0:#7FA8F0; --g1:#4CC877; --g2:#F48FB1; --g3:#F5C044;
    --eve-bg:#3A1A26;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --const-b:#4A5663; --const-bg:#222C37; --key-b:#80CBC4; --key-bg:#26A69A; --key-ink:#0B2421;
  --ctr-b:#4DB6AC; --ctr-bg:#12302D; --non-b:#B39DDB; --non-bg:#2A2142;
  --ct-b:#BCAAA4; --ct-bg:#2E2522; --sym-b:#FFCA28; --sym-bg:#3A2E10;
  --alice:#9FA8DA; --bob:#4DB6AC; --evec:#F48FB1; --gok-b:#4CC877; --gok-bg:#15301E;
  --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
  --g0:#7FA8F0; --g1:#4CC877; --g2:#F48FB1; --g3:#F5C044;
  --eve-bg:#3A1A26;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
.mono{font-family:var(--mono)}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h3{margin:0}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.schwrap{overflow-x:auto}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:12px 18px;font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:12px;font-weight:400;opacity:.8}
.box .f{font-family:var(--mono);font-size:13.5px;font-weight:500;opacity:.95}

/* roles: one colour per role in every step */
.role-pub{border-color:var(--ctr-b);background:var(--ctr-bg)}
.role-sec{border-color:var(--key-b);background:var(--key-bg);color:var(--key-ink)}
.role-sec small,.role-sec .note{color:var(--key-ink);opacity:.8}
.role-sym{border-color:var(--sym-b);background:var(--sym-bg)}
.role-neu{border-color:var(--const-b);background:var(--const-bg)}
.who-a{color:var(--alice)} .who-b{color:var(--bob)} .who-e{color:var(--evec)}
.role-msg{border-color:var(--non-b);background:var(--non-bg)}
.role-ct{border-color:var(--ct-b);background:var(--ct-bg)}
.role-eve{border-color:var(--g2);background:var(--eve-bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.v{font-family:var(--mono);font-weight:600}
.vbig{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25;word-break:break-all}

/* step 1: the schematic, told as a story */
.sch1{position:relative;width:876px;height:520px}
.sch1 .arrows{position:absolute;left:0;top:0}
.node{position:absolute;border-radius:10px;padding:8px 12px;border:1.5px solid;color:var(--ink);overflow:hidden}
.node .nh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.node small{display:block;font-size:12px;color:var(--muted)}
.node input{width:100%;margin-top:6px;font-size:20px;font-weight:600;padding:4px 8px}
.node textarea{width:100%;margin-top:6px;font-size:15px;resize:none;height:44px;padding:5px 8px}
.kbox{position:absolute;border:1.5px solid;border-radius:10px;padding:8px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.kbox:hover{box-shadow:0 0 0 3px var(--chg)}
.kbox.role-pub:hover{background:var(--ctr-bg)} .kbox.role-sec:hover{background:var(--key-bg)}
.kbox .nh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.kbox small{font-size:12px;color:var(--muted)}
.kbox .kv{font-family:var(--mono);font-size:17px;font-weight:600;word-break:break-all}
.zone{position:absolute;top:0;height:306px;border-radius:14px;background:var(--sunken);border:1.5px solid var(--rule)}
.zone-a{left:0;width:350px} .zone-b{left:540px;width:336px}
.zone-c{left:360px;width:170px;background:none;border:2px dashed var(--muted)}
.zh{position:absolute;left:12px;top:8px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.zone-c .zh{left:0;right:0;justify-content:center;flex-direction:column;gap:0;text-align:center;font-size:13.5px;line-height:1.25;color:var(--muted)}
.zone-c .zh small{font-weight:500;font-size:12px}
.bigp{position:absolute;top:110px;width:120px;text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.bigp svg{display:block;margin:0 auto 4px}
.s1-pub{left:10px;top:48px;width:316px;min-height:84px;transition:transform .9s ease-in-out}
.s1-pub.atbob{transform:translate(540px,112px)}
.s1-prv{left:550px;top:48px;width:316px;min-height:84px}
.stays{position:absolute;right:10px;top:-11px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--key-b);background:var(--key-bg);color:var(--ink)}
.s1-m{left:10px;top:160px;width:160px;height:134px}
.s1-enc{position:absolute;left:192px;top:186px;width:148px;height:80px}
.s1-c{left:370px;top:160px;width:150px;height:134px}
.s1-dec{position:absolute;left:550px;top:186px;width:148px;height:80px}
.s1-out{left:714px;top:160px;width:152px;height:134px}
.calc{position:absolute;top:270px;width:160px;font-family:var(--mono);font-size:12px;font-weight:600;text-align:center;line-height:1.3;word-break:break-all;border-radius:4px}
.calc-e{left:186px} .calc-d{left:544px}
.s1-eve{left:165px;top:340px;width:560px;transition:left .5s ease,width .5s ease}
.s1-eve.small{left:345px;width:200px}
.sch1 .hid{opacity:0;visibility:hidden;pointer-events:none}
.sch1 [data-st]{transition:opacity .4s ease,visibility .4s}
.sch1 .s1-pub[data-st]{transition:opacity .4s ease,visibility .4s,transform .9s ease-in-out}
.sch1 .s1-eve[data-st]{transition:opacity .4s ease,visibility .4s,left .5s ease,width .5s ease}
.gone{display:none!important}
.sch1 .new{outline:3px solid var(--chg);outline-offset:3px}
.sch1 .box.new{box-shadow:0 0 0 3px var(--chg),0 0 22px 4px var(--chg)}
.sch1 polyline.new{stroke-width:3.4;outline:none}
.sttext b{display:inline;font-size:inherit;margin:0}
.sch1 .nl.new,.sch1 .calc.new{outline:none;background:var(--chg-bg);box-shadow:0 0 0 2px var(--chg);border-radius:4px}
.sch1 .s1-c.new{animation:cslide .9s ease-out}
@keyframes cslide{from{transform:translateX(-170px);opacity:.3}to{transform:none;opacity:1}}
.okmark{font-size:12.5px;font-weight:700;color:var(--ok);margin-top:2px}
.story{border-left-color:var(--chg)}
.storyhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.storyk{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;border:1.5px solid var(--muted);background:none}
.dots button.on{background:var(--chg);border-color:var(--chg)}
.dots button.past{background:var(--muted)}
.storyhead .btns{margin:0}
.storyhead .btns button{font-size:13.5px;padding:5px 11px}
.sttext{min-height:4.6em}
.sttext sup{font-size:11px}
@media (prefers-reduced-motion:reduce){.sch1 *,.sch1{transition:none!important;animation:none!important}}
.s1-who{position:absolute;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.clist{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.45;margin-top:4px;word-break:break-word}
.eveline{font-size:13.5px;margin-top:3px}
.ftab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:4px}
.ftab td{padding:3px 10px 3px 0;white-space:nowrap}
.ftab td.lbl{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted)}
.ltab{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:6px}
.ltab td{padding:3px 6px;text-align:center;min-width:2.6em;border:1px solid var(--rule)}
.ltab td.lbl{font-family:var(--sans);font-size:12.5px;font-weight:600;text-align:left;border:0;padding-right:12px;white-space:nowrap}
.ltab tr.rm td:not(.lbl){background:var(--non-bg)}
.ltab tr.rc td:not(.lbl){background:var(--ct-bg)}
.ltab td.same{outline:2.5px solid var(--chg);outline-offset:-2px;font-weight:700}
.tablewrap{overflow-x:auto}

/* step 2: the key table */
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.presets button{font-size:13px;padding:4px 10px}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.inrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;flex-direction:column;border-radius:8px;padding:6px 10px;border:1.5px solid;font-weight:600;font-size:13.5px}
.chip small{font-weight:400;color:var(--muted);font-size:12px}
.chip input{margin-top:4px;width:12em;font-size:16px;font-weight:600}
.ktab{border-collapse:collapse;width:100%;font-size:14.5px}
.ktab td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ktab td.num{width:40px}
.ktab td.val{font-family:var(--mono)}
.ktab td.val .okline,.ktab td.val .note,.ktab td.val .err{font-family:var(--sans)}
.sumline .st{font-family:var(--sans);font-size:14px}
.ktab tr.todo td{color:var(--muted);opacity:.6}
.badge{display:inline-flex;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--surface);font-family:var(--mono);font-weight:700;align-items:center;justify-content:center}
.result{margin-top:12px;font-size:14.5px;line-height:1.8}
.golink{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:6px;background:var(--ink);color:var(--surface);font-weight:600;text-decoration:none}
.golink:hover{opacity:.9}
.twokeys{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;margin-top:4px}
.twokeys .kbox{position:static;min-width:300px;flex:1 1 300px}
.trash{margin-top:12px;border:1.5px dashed var(--rule);border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--muted)}

/* step 3: one power */
.formula{font-family:var(--mono);font-size:24px;font-weight:600;margin:6px 0 4px;word-break:break-all}
.formula sup{font-size:15px}
.sumline{font-family:var(--mono);font-size:15px;margin-top:12px;line-height:1.8;word-break:break-word}
.sumline b{color:var(--chg)}

/* step 3: why decryption works */
.powrow{border-left:4px solid;border-radius:6px;padding:6px 12px 8px;margin:10px 0;background:none}
.powrow.role-ct{border-color:var(--ct-b)} .powrow.role-msg{border-color:var(--non-b)}
.powlbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.whyline{font-family:var(--mono);font-size:15px;font-weight:600;margin:3px 0 3px 12px;word-break:break-word;line-height:1.7}
.whyline sup,.sumline sup{font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:3px}
.gc{font-family:var(--mono);font-size:12.5px;padding:3px 0;border-radius:5px;border:1px solid var(--gok-b);background:var(--gok-bg)}
.gc:hover{background:var(--sunken)}
.gc.shared{border:2px solid var(--chg);background:var(--chg-bg);font-weight:700}
.gc.cur{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* step 4: Eve factors n */
.divs{font-family:var(--mono);font-size:14px;line-height:1.55;margin-top:10px;min-height:1.5em}
.drow{color:var(--muted)} .drow:last-child{color:var(--ink);font-weight:600} .drow.hit{color:var(--ok);font-weight:700}
.bitsl{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-right:6px}
.bitsl span{min-width:15em}
.bitsl input{width:220px;padding:0}
.sizen{margin-top:12px;word-break:break-all}
.est{margin-top:12px;padding:10px 14px;background:var(--sunken);border-radius:8px}
.estrow{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.7}
.hist{margin-top:12px;font-size:13.5px} .hist th{text-align:left;font-size:12.5px;color:var(--muted);padding:4px 10px;border-bottom:1px solid var(--rule)}
/* step 5 additions */
h4.sub{margin:14px 0 6px;font-size:14.5px}
h4.sub:first-of-type{margin-top:0}
.bign.inl{display:block;max-height:64px;max-width:640px;white-space:normal}
.e3tab td{white-space:normal;vertical-align:top}
.e3tab td.lbl{white-space:nowrap}

<script>
"use strict";

/* ===================== RSA core (textbook RSA, small numbers, BigInt) ===================== */
// CORE-BEGIN
const MAX_PRIME = 1000000000n;   // p and q below 10^9: trial division stays fast

function gcd(a, b) {
  while (b !== 0n) { const r = a % b; a = b; b = r; }
  return a;
}
// the smallest divisor of n > 1 (n itself if n is prime), by trying divisors
function smallestFactor(n) {
  if (n % 2n === 0n) return 2n;
  for (let i = 3n; i * i <= n; i += 2n) if (n % i === 0n) return i;
  return n;
}
function isPrime(n) { return n >= 2n && smallestFactor(n) === n; }

// Euclid's table: a = q * b + r, then (a, b) <- (b, r) until r = 0
function euclidRows(a, b) {
  const rows = [];
  while (b !== 0n) {
    const q = a / b, r = a % b;
    rows.push({ a: a, b: b, q: q, r: r });
    a = b; b = r;
  }
  return rows;
}
// extended Euclid: every remainder is written as r = s * phi + t * e.
// The two start rows: phi = 1 * phi + 0 * e and e = 0 * phi + 1 * e.
// Each next row = (the row two above) - q * (the row above).
function extEuclid(phi, e) {
  const rows = euclidRows(phi, e);
  const mix = [{ r: phi, s: 1n, t: 0n }, { r: e, s: 0n, t: 1n }];
  for (const row of rows) {
    const A = mix[mix.length - 2], B = mix[mix.length - 1];
    mix.push({ r: row.r, s: A.s - row.q * B.s, t: A.t - row.q * B.t });
  }
  const last = mix[mix.length - 2];          // the row with the last non-zero remainder
  const g = last.r;
  let d = null;
  if (g === 1n) { d = last.t % phi; if (d < 0n) d += phi; }
  return { rows: rows, mix: mix, g: g, t: last.t, s: last.s, d: d };
}
function modInverse(e, m) { return extEuclid(m, e).d; }

// base^exp mod n, right to left: square the power every bit, multiply it in where the bit is 1
function modPowTrace(base, exp, n) {
  const rows = [];
  let power = base % n, result = 1n % n, k = 0, prev = null;
  let x = exp;
  while (x > 0n) {
    if (k > 0) { prev = power; power = (power * power) % n; }
    const bit = Number(x & 1n);
    const before = result;
    if (bit === 1) result = (result * power) % n;
    rows.push({ k: k, bit: bit, prev: prev, power: power, before: before, result: result });
    x >>= 1n; k++;
  }
  return { rows: rows, result: result };
}
function modPow(base, exp, n) {
  let power = base % n, result = 1n % n, x = exp;
  while (x > 0n) {
    if (x & 1n) result = (result * power) % n;
    power = (power * power) % n;
    x >>= 1n;
  }
  return result;
}
function encrypt(m, pub) { return modPow(m, pub.e, pub.n); }    // c = m^e mod n
function decrypt(c, prv) { return modPow(c, prv.d, prv.n); }    // m = c^d mod n

// Bob makes his keys; errors are returned as codes for the page to explain
function makeKeys(p, q, e) {
  const K = { p: p, q: q, e: e, n: null, phi: null, d: null, ext: null, err: null, ok: false };
  if (p < 2n || p >= MAX_PRIME) { K.err = { at: 1, code: "pRange" }; return K; }
  if (q < 2n || q >= MAX_PRIME) { K.err = { at: 1, code: "qRange" }; return K; }
  const fp = smallestFactor(p), fq = smallestFactor(q);
  K.pf = fp; K.qf = fq;
  if (fp !== p) { K.err = { at: 1, code: "pComp", f: fp }; return K; }
  if (fq !== q) { K.err = { at: 1, code: "qComp", f: fq }; return K; }
  if (p === q) { K.err = { at: 1, code: "pq" }; return K; }
  K.n = p * q;
  K.phi = (p - 1n) * (q - 1n);
  if (e <= 1n || e >= K.phi) { K.err = { at: 4, code: "eRange" }; return K; }
  K.ext = extEuclid(K.phi, e);
  if (K.ext.g !== 1n) { K.err = { at: 4, code: "eGcd", g: K.ext.g }; return K; }
  K.d = K.ext.d;
  K.ok = true;
  return K;
}
// the smallest e >= 3 with gcd(e, phi) = 1 (to suggest when the chosen e does not work)
function firstGoodE(phi) { for (let e = 3n; e < phi; e += 2n) if (gcd(e, phi) === 1n) return e; return null; }

// bits in n (2048 for a 2048-bit n)
function bitLen(n) { return n <= 0n ? 0 : n.toString(2).length; }

// Miller-Rabin with the first 12 primes as bases: exact for n < 3.3 * 10^24, a strong test above
const MR_BASES = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
function isProbPrime(n) {
  if (n < 2n) return false;
  for (const b of MR_BASES) { if (n === b) return true; if (n % b === 0n) return false; }
  let d = n - 1n, s = 0;
  while ((d & 1n) === 0n) { d >>= 1n; s++; }
  for (const a of MR_BASES) {
    let x = modPow(a, d, n);
    if (x === 1n || x === n - 1n) continue;
    let comp = true;
    for (let r = 1; r < s; r++) { x = (x * x) % n; if (x === n - 1n) { comp = false; break; } }
    if (comp) return false;
  }
  return true;
}
// a random number with exactly `bits` bits (crypto.getRandomValues), and a random prime of that size
function randBits(bits) {
  const words = new Uint32Array(Math.ceil(bits / 32));
  crypto.getRandomValues(words);
  let x = 0n;
  for (const w of words) x = (x << 32n) | BigInt(w);
  x &= (1n << BigInt(bits)) - 1n;
  return x | (1n << BigInt(bits - 1));
}
function randPrime(bits) {
  for (;;) { const x = randBits(bits) | 1n; if (isProbPrime(x)) return x; }
}
// Eve's random n = p * q with exactly `bits` bits, p and q of about half the size each
function randModulus(bits) {
  for (;;) {
    const p = randPrime(Math.ceil(bits / 2)), q = randPrime(Math.floor(bits / 2));
    const n = p * q;
    if (p !== q && bitLen(n) === bits) return { p: p < q ? p : q, q: p < q ? q : p, n: n };
  }
}
// trial division as Eve does it: 2, then 3, 5, 7, 9, ... up to the square root of n.
// st = { n, i, count, f }; one call does at most `max` divisions; st.f is the factor found (or n if n is prime)
function trialStart(n) { return { n: n, i: 2n, count: 0, f: null }; }
function trialRun(st, max) {
  for (let k = 0; k < max && st.f === null; k++) {
    if (st.i * st.i > st.n) { st.f = st.n; break; }
    st.count++;
    if (st.n % st.i === 0n) { st.f = st.i; break; }
    st.i = st.i === 2n ? 3n : st.i + 2n;
  }
  return st;
}
function trialFactor(n) { const st = trialRun(trialStart(n), Infinity); return { f: st.f, count: st.count }; }
// the integer cube root: the biggest r with r^3 <= x (Newton's method on BigInt)
function icbrt(x) {
  if (x < 2n) return x;
  let r = 1n << BigInt(Math.ceil(bitLen(x) / 3));   // r^3 >= x to start
  for (;;) {
    const y = (2n * r + x / (r * r)) / 3n;
    if (y >= r) break;
    r = y;
  }
  while (r * r * r > x) r--;
  while ((r + 1n) * (r + 1n) * (r + 1n) <= x) r++;
  return r;
}
// a short text as bytes (UTF-8) and as one big number, as rsa_ready.py does
function textToInt(s) { let x = 0n; for (const b of new TextEncoder().encode(s)) x = (x << 8n) | BigInt(b); return x; }
function intToText(x) {
  const a = [];
  while (x > 0n) { a.unshift(Number(x & 255n)); x >>= 8n; }
  try { return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(a)); } catch (e) { return null; }
}
// a fixed 2048-bit test key with e = 3 (p, q: random 1024-bit primes with p, q = 2 mod 3, made with Python 3.12 for this page)
const E3_P = BigInt(
  "1445840031255194361438994004394067314543780838836159443329903330807924322805925626850829" +
  "0419943134254643929987114151740769100929035751971653992063285212439200307504550507080670" +
  "4348580204938132221585315441443728170302527210407307609590946489910378096100531530986546" +
  "142295356286507416298155737929225264295320213");
const E3_Q = BigInt(
  "1566690387199893226212961821264179739039892461842646412836313084915963251476728866203989" +
  "7818951243282292132495297211048779972777011149137137388674178401882458631475649414195193" +
  "0971168562712748572766382178241147221879129736178954127099381400481999340009365227157527" +
  "388002015767194000326314360265764611460821397");

// a short text as numbers: one number per letter (its Unicode code). Only for tiny n, see the page.
function textToNums(s) { return Array.from(s, ch => BigInt(ch.codePointAt(0))); }
function numsToText(a) { return a.map(x => (x < 0x110000n ? String.fromCodePoint(Number(x)) : "?")).join(""); }

/* Test values and where they come from (every one also recomputed with Python 3.12 pow() in a scratch script):
   1. W. Stallings, "Cryptography and Network Security", RSA example; the same numbers are on the lecture 3
      slides "Making the keys" and "The example: 88 -> 11 -> 88" (and on the fast-exponentiation page):
      p = 17, q = 11, n = 187, phi = 160, e = 7, d = 23, 88^7 mod 187 = 11, 11^23 mod 187 = 88,
      88^1, 88^2, 88^4 mod 187 = 88, 77, 132; 11^1, 11^2, 11^4, 11^8, 11^16 mod 187 = 11, 121, 55, 33, 154.
   2. Euclid's algorithm for gcd(160, 7): 160 = 22*7 + 6, 7 = 1*6 + 1, 6 = 6*1 + 0; 1 = 23*7 - 1*160
      (shown step by step on the page math/extended-euclid/, which has its own self-test).
   3. The earlier Lecture 3 exercise: inverse of 23 mod 120 = 47, 1 = 47*23 - 9*120.
   4. Wikipedia "RSA (cryptosystem)", worked example (the version with Euler's phi; the current article uses
      lambda = 780 and d = 413 instead): p = 61, q = 53, n = 3233, phi = 3120, e = 17, d = 2753,
      65^17 mod 3233 = 2790, 2790^2753 mod 3233 = 65.
   5. Lecture 3, Task 5 "your own RSA" (Task5/solution/my_rsa.py): p = 37908704904578413183,
      q = 58606630333925820283, e = 65537, d = 1367151349159148221410861819858768950381,
      2026 -> C = 736246060401132335090489988934276767570.
   6. Lecture 3, Task 4 "does it always work": with n = 187, e = 7, d = 23 every P from 0 to 186 comes back; 17 -> 85 -> 17.
   7. Lecture 3, Task 6 (Task6/pin.py; the constants keep their old name TASK7_): the bank's 2048-bit n, e = 65537,
      and C; PIN 4821 gives C.
   8. Invariant: decrypt(encrypt(m)) = m for every m < n with the preset keys of this page.
   9. to 12. Euler's theorem on n = 187, Eve's trial division (187 = 11 * 17 after 6 divisions, 1022117 = 1009 * 1013),
      Miller-Rabin (561 is a Carmichael number, 2^31 - 1 is prime), the integer cube root and the e = 3 attack on the fixed
      2048-bit key E3_P * E3_Q ("PIN 4821" -> m = 5785241096556130865, c = m^3 checked with Python 3.12), m >= n wrapping. */
const TASK7_N = BigInt(
  "1872841195117846544841412217848882016914999669618551874656442540592245157199172284036666" +
  "4133819670868121337628024215357371088011677213618179225491492308522638260766784577579056" +
  "2503833714947149399785696726501129650715798554202938177179190554594601904751852083122215" +
  "8057947034828253454638553229680182930743346009701935234179308516240818438791244416535117" +
  "4438599548369347346440740878583632951593243478160883166083141596520077822941268222256906" +
  "3007444251582916339284117927636160928694447560172861239100470527351501529873947354944785" +
  "6512761663278694200484166169777618275780233631406978635015286934781219895694598917365383" +
  "3");
const TASK7_C = BigInt(
  "7332072385529698190639629753233484374256896745430252412164314970011183931212726541097741" +
  "8517601857555236271280372126699069139375204601624878637979013676460224617842168808286379" +
  "5857214264834240122145254830440949565363086589962516854173388760424190608057515512132795" +
  "6969317451095860438602167078955063616733772359080776681126370710924434944332506229572697" +
  "0903607216716755528169246962615220088320071217812749942469660037831165985056493785539608" +
  "3503439207009097456414061872740443999816367937732652442509322860944524988225405526067258" +
  "9811720959928951502493599386072038265358314787833313330898379884238139910309050126307341");
const TASK7_E = 65537n;
const PRESETS = [   // [p, q, e]
  [17n, 11n, 7n],          // the slides (Stallings)
  [11n, 13n, 23n],         // phi = 120: the inverse 47 (an earlier Lecture 3 exercise)
  [61n, 53n, 17n],         // Wikipedia
  [1009n, 1013n, 65537n],  // e = 65537 as in practice
];

function selfTest() {
  const fails = [];
  const eq = (a, b) => a === b;
  // 1. Stallings / the slides
  const K = makeKeys(17n, 11n, 7n);
  if (!K.ok || K.n !== 187n || K.phi !== 160n || K.d !== 23n) fails.push("keys 17, 11, 7");
  if (encrypt(88n, { n: 187n, e: 7n }) !== 11n) fails.push("88^7 mod 187");
  if (decrypt(11n, { n: 187n, d: 23n }) !== 88n) fails.push("11^23 mod 187");
  const tr1 = modPowTrace(88n, 7n, 187n).rows.map(r => r.power).join(",");
  if (tr1 !== "88,77,132") fails.push("powers of 88");
  const tr2 = modPowTrace(11n, 23n, 187n);
  if (tr2.rows.map(r => r.power).join(",") !== "11,121,55,33,154" || tr2.result !== 88n) fails.push("powers of 11");
  // 2. Euclid on the slides
  const er = euclidRows(160n, 7n).map(r => [r.a, r.b, r.q, r.r].join(" ")).join("|");
  if (er !== "160 7 22 6|7 6 1 1|6 1 6 0") fails.push("Euclid 160, 7");
  const x1 = extEuclid(160n, 7n);
  if (x1.g !== 1n || x1.t !== 23n || x1.s !== -1n || x1.d !== 23n) fails.push("extended Euclid 160, 7");
  // 3. 23 mod 120
  const x2 = extEuclid(120n, 23n);
  if (x2.d !== 47n || x2.t !== 47n || x2.s !== -9n || euclidRows(120n, 23n).length !== 5) fails.push("23 mod 120");
  // 4. Wikipedia
  const W = makeKeys(61n, 53n, 17n);
  if (!W.ok || W.n !== 3233n || W.phi !== 3120n || W.d !== 2753n) fails.push("keys 61, 53, 17");
  if (encrypt(65n, W) !== 2790n || decrypt(2790n, W) !== 65n) fails.push("65 -> 2790");
  // 5. "your own RSA" (20-digit primes)
  const p5 = 37908704904578413183n, q5 = 58606630333925820283n, phi5 = (p5 - 1n) * (q5 - 1n);
  const d5 = modInverse(65537n, phi5);

  if (modPow(2026n, 65537n, p5 * q5) !== 736246060401132335090489988934276767570n) fails.push("own RSA: C");
  if (modPow(736246060401132335090489988934276767570n, d5, p5 * q5) !== 2026n) fails.push("own RSA: back");
  // 6. "does it always work"

  if (encrypt(17n, { n: 187n, e: 7n }) !== 85n) fails.push("always: 17 -> 85");

  for (const [p, q, e] of PRESETS) {
    const k = makeKeys(p, q, e);

    const step = k.n > 400n ? k.n / 400n : 1n;
    for (let m = 0n; m < k.n; m += step) {
      const c = encrypt(m, k);
      if (decrypt(c, k) !== m || modPowTrace(m, e, k.n).result !== c) { fails.push("round trip " + m + " mod " + k.n); break; }
    }

  for (let m = 1n; m < 187n; m++) if (gcd(m, 187n) === 1n && modPow(m, 160n, 187n) !== 1n) { fails.push("Euler " + m); break; }
  if (modPow(88n, 160n, 187n) === 1n || modPow(88n, 161n, 187n) !== 88n) fails.push("88^160, 88^161 mod 187");
  // 10. Eve's trial division: 187 = 11 * 17 after the divisions 2, 3, 5, 7, 9, 11; the preset 1009 * 1013
  const tf = trialFactor(187n);
  if (tf.f !== 11n || tf.count !== 6) fails.push("factor 187");
  if (trialFactor(1022117n).f !== 1009n || trialFactor(1000000007n).f !== 1000000007n) fails.push("factor 1022117");

function startFactor() {

    F.ms += performance.now() - t0;

  function chunk() {
    if (run !== app.sizeRun) return;
    const t0 = performance.now(), end = t0 + 25;
    while (performance.now() < end && S.st.f === null) trialRun(S.st, 2000);
    S.ms += performance.now() - t0;
    if (S.st.f === null && S.ms > FAC_LIMIT) S.stopped = true;
    if (S.st.f !== null || S.stopped) {
      S.busy = false;
      // the speed: from this run if it was long enough, else from a short extra measurement on the same n
      let k = S.st.count, ms = S.ms;
      if (ms < 300) {
        const c0 = performance.now(); let i = 3n, x = 0n; k = 0;
        while (performance.now() - c0 < 150) { for (let j = 0; j < 500; j++) { x ^= S.n % i; i += 2n; } k += 500; }
        ms = performance.now() - c0;
      }
      app.rate = k / ms * 1000;
      app.sizeHist.unshift({ bits: S.bits, n: S.n, count: S.st.count, ms: S.ms, found: S.st.f !== null });
      if (app.sizeHist.length > 8) app.sizeHist.pop();

}

  if (!app.e3key) { const n = E3_P * E3_Q; app.e3key = { n: n, d: modInverse(3n, (E3_P - 1n) * (E3_Q - 1n)) }; }
  const n = app.e3key.n;
  if (app.e3msg.length === 0) { el.innerHTML = '<p class="err">' + t.errEmpty + "</p>"; return; }
  const m = textToInt(app.e3msg), c = modPow(m, 3n, n), r = icbrt(c), read = intToText(r), ok = r === m;
  const row = (a, b, cls) => "<tr><td class=\"lbl\">" + a + '</td><td class="' + (cls || "") + '">' + b + "</td></tr>";
  el.innerHTML = '<table class="ftab e3tab">' + row(t.e3n, '<span class="bign inl">' + n + "</span>") +
    row(t.e3m, String(m)) + row(t.e3c, '<span class="bign inl">' + c + "</span>") + row(t.e3r, '<span class="bign inl">' + r + "</span>") +
    row(t.e3read, read === null ? "?" : "“" + esc(read) + "”", ok ? "okline" : "badline") + "</table>" +
    '<p style="margin:8px 0 0">' + t.e3Bits(bitLen(m ** 3n), bitLen(n)) + ' <b class="' + (ok ? "okline" : "badline") + '">' + (ok ? t.e3Ok : t.e3Fail) + "</b></p>" +
    '<div class="why">' + t.e3Fix + "</div>";
}
// two common mistakes: m >= n, and e that shares a factor with phi
function mBigText() { return app.mBigText !== null ? app.mBigText : String(app.K.n + (mOK() ? app.m : 5n)); }
function updateMist() {
  const el = document.getElementById("s5ma");
  if (!el) return;
  const t = L(), K = app.K, v = mBigText().trim();
  if (!/^\d{1,40}$/.test(v)) el.innerHTML = '<p class="err">' + t.errNum + "</p>";
  else {
    const m = BigInt(v), c = encrypt(m, K), back = decrypt(c, K);
    el.innerHTML = m < K.n ? '<p class="note">' + t.mistAOk + "</p>"
      : '<p class="badline" style="margin:8px 0 4px">' + t.mistARes(m, K.n, c, back) + ' ✗</p><p class="note" style="margin:0">' + t.mistANote + "</p>";
  }
  let eb = null;
  for (let e = 3n; e < K.phi && e < 1000n; e += 2n) if (gcd(e, K.phi) > 1n) { eb = e; break; }
  document.getElementById("s5mb").innerHTML = eb === null ? '<p class="note">' + t.mistBNone + "</p>"
    : '<p style="margin:4px 0">' + t.mistBRes(eb, K.phi, gcd(eb, K.phi)) + '</p><button data-action="bade" data-e="' + eb + '">' + t.mistBTry(eb) + "</button>";
}
// hybrid encryption with real sizes: a fresh random 256-bit key K
function updateHyb() {
  const el = document.getElementById("s5hyb");
  if (!el) return;
  const t = L();
  if (!app.hybKey) { const b = new Uint8Array(32); crypto.getRandomValues(b); app.hybKey = Array.from(b, x => x.toString(16).padStart(2, "0")).join(""); }
  const mb = new TextEncoder().encode(app.msg).length, parts = t.hybParts(mb), sizes = [256, 12, mb, 16], roles = ["role-ct", "role-neu", "role-ct", "role-neu"];
  el.innerHTML = '<div class="hyb">' +
    '<div class="hrow"><div class="hn role-sym"><b>' + t.hybKey + '</b><span class="mono hk">' + app.hybKey + '</span></div><span class="harr">→</span><div class="hbox">RSA-2048<small>' + t.hybRsa + '</small></div><span class="harr">→</span><div class="hn role-ct"><b>' + parts[0] + "</b></div></div>" +
    '<div class="hrow"><div class="hn role-msg"><b>' + t.hybMsg(mb) + '</b><span class="mono">' + esc(app.msg) + '</span></div><span class="harr">→</span><div class="hbox">AES-256-GCM / ChaCha20<small>' + t.hybSym + '</small></div><span class="harr">→</span><div class="hn role-ct"><b>' + parts[2] + "</b></div></div>" +
    '<p style="margin:10px 0 4px"><b>' + t.hybOut + '</b></p><div class="hbar">' +
      parts.map((x, i) => '<span class="' + roles[i] + '" style="flex:' + sizes[i] + ' 0 auto">' + x + "</span>").join("") + "</div>" +
    '<p class="note" style="margin:8px 0 0">' + t.hybBob + "</p></div>";
}
function runGuess() {
  const K = app.K; if (!mOK()) return;
  const c = encrypt(app.m, K), lim = K.n < 10000n ? K.n : 10000n;
  const t0 = performance.now();
  let found = null, tries = 0;
  const last = [];
  for (let g = 0n; g < lim; g++) {
    tries++;
    const cg = encrypt(g, K);
    last.push({ g: g, c: cg, hit: cg === c });
    if (last.length > 4) last.shift();
    if (cg === c) { found = g; break; }
  }
  app.guess = { c: c, n: K.n, e: K.e, found: found, tries: tries, last: last, ms: Math.max(1, Math.round(performance.now() - t0)) };
  updateL4();
}
function runBig() {
  if (app.big && app.big.found === null) return;
  const run = ++app.bigRun;
  app.big = { tries: 0, found: null, ms: 0 };
  const t0 = performance.now();
  let g = 0n;
  const pub = { n: TASK7_N, e: TASK7_E };
  function chunk() {
    if (run !== app.bigRun) return;
    const end = performance.now() + 25;
    while (performance.now() < end && g < 10000n) {
      app.big.tries++;
      if (encrypt(g, pub) === TASK7_C) { app.big.found = g; break; }
      g++;
    }
    app.big.ms = performance.now() - t0;
    if (app.big.found === null && g >= 10000n) app.big.found = "?";
    if (app.level === 4) updateL4();
    if (app.big.found === null) setTimeout(chunk, 0);
  }
  updateL4();
  setTimeout(chunk, 0);
}

/* ---------- frame, navigation ---------- */
function buildSide() {
  const t = L();
  document.getElementById("steps").innerHTML = t.steps.map((s, i) =>
    '<button class="step' + (i < app.level ? " past" : "") + '" data-step="' + i + '" aria-pressed="' + (i === app.level) + '">' +
    '<span class="gnum">' + (i + 1) + "</span><span><b>" + s[0] + "</b><small>" + s[1] + "</small></span></button>").join("");
}
function updateAll() {
  [updateL0, updateL1, updateL2, updateL3, updateL4][app.level]();
}
function hashStr() { return "#" + (app.level + 1) + (app.level === 0 && app.story > 1 ? "." + app.story : app.level > 0 && app.card > 1 ? "." + app.card : ""); }
// #5.5 scrolls step 5 to its 5th card (hybrid encryption), #4.2 step 4 to its 2nd card (a bigger n)
function scrollToCard() {
  if (app.level === 0 || app.card < 2) return;
  const c = view.querySelectorAll(".fade > .card")[app.card - 1];
  if (c) c.scrollIntoView({ block: "start" });
}
function render() {
  const t = L();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("home").textContent = "← " + t.home;
  document.getElementById("keys").textContent = t.keys;
  document.getElementById("keys2").textContent = t.keysStory;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const st = document.getElementById("selftest");
  st.textContent = SELF_FAILS.length ? t.selfBad(SELF_FAILS.join(", ")) : t.selfOk;
  st.className = SELF_FAILS.length ? "badt" : "okt";
  buildSide();
  document.getElementById("mhGrp").textContent = t.stepOf(app.level + 1);
  document.getElementById("mhTitle").textContent = t.steps[app.level][0];
  document.getElementById("mhSub").textContent = t.steps[app.level][1];
  const ex = t.explain[app.level];
  const head = app.level === 0 && keyOK() ? storyBarHTML() : '<div class="explain"><b>' + ex[0] + "</b>" + ex[1] + "</div>";
  view.innerHTML = '<div class="fade">' + head + [render0, render1, render2, render3, render4][app.level]() + "</div>";
  updateAll();
  document.getElementById("moreTxt").textContent = t.moreBelow;
  updateMore();
  try { history.replaceState(null, "", hashStr()); } catch (e) {}
}
function goTo(level) {
  app.level = level;
  app.card = 1;
  render();
  view.scrollTop = 0;
}
function zoomIn() { if (app.level < 4) goTo(app.level + 1); }
function zoomOut() { if (app.level > 0) goTo(app.level - 1); }

function keysChanged() {
  const ok = /^\d{1,12}$/.test(app.pText.trim()) && /^\d{1,12}$/.test(app.qText.trim()) && /^\d{1,24}$/.test(app.eText.trim());
  app.inErr = !ok;
  if (ok) app.K = makeKeys(BigInt(app.pText.trim()), BigInt(app.qText.trim()), BigInt(app.eText.trim()));
  else app.K = { ok: false, err: null };
  app.guess = null;
  updateL1();
  document.querySelectorAll(".presets button").forEach(b => {
    const pr = PRESETS[+b.dataset.i];
    b.setAttribute("aria-pressed", String(app.pText === String(pr[0]) && app.qText === String(pr[1]) && app.eText === String(pr[2])));
  });
}
function setM(v, sync) {
  app.mText = v;
  if (sync) view.querySelectorAll('input[data-field="m"]').forEach(i => { i.value = v; });
  const s = v.trim();
  if (/^\d{1,40}$/.test(s)) { app.m = BigInt(s); app.mErr = false; } else app.mErr = true;
  updateAll();
}

/* ---------- events ---------- */
const view = document.getElementById("view");
/* "more below" button: shown while part of the page is still below the screen */
function scroller() { return view.scrollHeight > view.clientHeight + 1 ? view : document.scrollingElement; }
function updateMore() {
  const b = document.getElementById("more");
  if (!b) return;
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  b.hidden = sc.scrollHeight - sc.scrollTop - h < 40;
}
document.getElementById("more").addEventListener("click", () => {
  const sc = scroller();
  const h = sc === view ? view.clientHeight : window.innerHeight;
  sc.scrollBy({ top: Math.round(h * 0.8), behavior: "smooth" });
});
view.addEventListener("scroll", updateMore);
window.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);
new MutationObserver(() => requestAnimationFrame(updateMore)).observe(view, { childList: true, subtree: true });
view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "go") goTo(+el.dataset.to);
  else if (a === "pow") goTo(2);
  else if (a === "story") storyGo(el.dataset.k === "next" ? app.story + 1 : el.dataset.k === "prev" ? app.story - 1 : +el.dataset.k);
  else if (a === "setm") setM(el.dataset.m, true);
  else if (a === "factor") startFactor();
  else if (a === "size") startSize();
  else if (a === "newkey") { app.hybKey = null; updateHyb(); }
  else if (a === "bade") { app.eText = el.dataset.e; keysChanged(); goTo(1); }
  else if (a === "mode") { app.mode = el.dataset.m; render(); }
  else if (a === "preset") {
    const pr = PRESETS[+el.dataset.i];
    app.pText = String(pr[0]); app.qText = String(pr[1]); app.eText = String(pr[2]);
    ["p", "q", "e"].forEach((f, i) => { const inp = view.querySelector('input[data-field="' + f + '"]'); if (inp) inp.value = String(pr[i]); });
    keysChanged();
  }
  else if (a === "sete") { app.eText = el.dataset.e; const inp = view.querySelector('input[data-field="e"]'); if (inp) inp.value = app.eText; keysChanged(); }
  else if (a === "guess") runGuess();
  else if (a === "guess-big") runBig();
  else if (a === "leak") { app.leaked = !app.leaked; updateL4(); }
});
view.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = e.target.value;
  if (f === "m") setM(v);
  else if (f === "msg") { app.msg = v; updateAll(); }
  else if (f === "bits") { app.bits = +v; updateL3(); }
  else if (f === "e3") { app.e3msg = v; updateE3(); }
  else if (f === "mbig") { app.mBigText = v; updateMist(); }
  else if (f === "p" || f === "q" || f === "e") { app[f + "Text"] = v; keysChanged(); }
});
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]");
  if (b) goTo(+b.dataset.step);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cryptoSimLang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && tag === "BUTTON") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (app.level === 0 && (e.key === "n" || e.key === "N" || e.key === " ")) { e.preventDefault(); storyGo(app.story + 1); return; }
  if (app.level === 0 && (e.key === "p" || e.key === "P")) { e.preventDefault(); storyGo(app.story - 1); return; }
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
});

/* ---------- start ---------- */
const SELF_FAILS = selfTest();
// #3 opens step 3; #1.5 opens step 1 at story step 5; #5.5 opens step 5 at its 5th card
function readHash() {
  const hm = /^#(\d)(?:\.(\d+))?$/.exec(location.hash);
  if (hm && +hm[1] >= 1 && +hm[1] <= 5) app.level = +hm[1] - 1;
  if (hm && app.level === 0) app.story = hm[2] ? Math.max(1, Math.min(STORY_N, +hm[2])) : 1;
  if (hm && app.level > 0) app.card = hm[2] ? Math.max(1, +hm[2]) : 1;
}
// a link from a slide opens the right step even in a tab that is already open
window.addEventListener("hashchange", () => { if (location.hash !== hashStr()) { readHash(); render(); view.scrollTop = 0; scrollToCard(); } });
readHash();
render();
requestAnimationFrame(scrollToCard);
</script>
</body>
