<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RC4 explorer</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --chg:#D9621C; --chg-bg:#FCE8DA; --ok:#1E7E4F; --bad:#B8372B;
  --const-b:#BCC4CC; --const-bg:#EEF1F4;
  --key-b:#E2A60E;   --key-bg:#FDF3DC;
  --ctr-b:#2FA84F;   --ctr-bg:#E3F4E8;
  --non-b:#2F6FDB;   --non-bg:#E5EDFB;
  --ct-b:#8A5CD8;   --ct-bg:#F1EAFD;
  --p:#2F6FDB; --z:#9A6B00; --c:#7446C4;
  --g0:#2F6FDB; --g1:#2FA84F; --g2:#E5484D; --g3:#E2A60E;
  --mv1:#E9F0FC; --mv2:#CCDCF7; --mv3:#A9C4F0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
    --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
    --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
    --ct-b:#B596F5; --ct-bg:#2A2142;
    --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
    --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
    --mv1:#1B2638; --mv2:#203856; --mv3:#2A4D80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --chg:#F29A5C; --chg-bg:#3D2414; --ok:#5FD19A; --bad:#F08A7E;
  --const-b:#4A5663; --const-bg:#222C37; --key-b:#F5C044; --key-bg:#3A2E10;
  --ctr-b:#4CC877; --ctr-bg:#15301E; --non-b:#7FA8F0; --non-bg:#1A2740;
  --ct-b:#B596F5; --ct-bg:#2A2142;
  --p:#7FA8F0; --z:#F5C044; --c:#B596F5;
  --g0:#7FA8F0; --g1:#4CC877; --g2:#FF6B6F; --g3:#F5C044;
  --mv1:#1B2638; --mv2:#203856; --mv3:#2A4D80;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,textarea,select{font-family:var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;font-size:13.5px}
select{font-family:var(--sans)}
.mono{font-family:var(--mono)}

/* frame: the same as the ChaCha20 explorer */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.home{display:inline-block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.home:hover{color:var(--ink);text-decoration:underline}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.langs{display:flex;gap:6px;flex:none}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px;font-weight:500}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:12px 10px 16px;border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.step{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.step:hover{background:var(--sunken)}
.step b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.step .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.step[aria-pressed="true"] .gnum{background:var(--surface);color:var(--ink)}
.step.past .gnum{background:var(--ink);color:var(--surface)}
.step.open{background:var(--sunken)}
.step.sub{padding:6px 10px 6px 26px;gap:9px}
.step.sub b{font-size:13.5px;font-weight:600}
.step.sub .gnum{width:34px;height:24px;font-size:12px;border-radius:6px}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#selftest.okt{color:var(--ok);font-weight:600}
#selftest.badt{color:var(--bad);font-weight:600}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.modhead{padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.modhead span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:20px;margin:1px 0 0;font-weight:600}
.modhead p{margin:0;color:var(--muted);font-size:13.5px}
.content{overflow:auto;padding:16px 20px 24px}
.more{position:fixed;right:24px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:0;background:var(--chg);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:nudge 1.6s ease-in-out infinite}
.more:hover{filter:brightness(1.08)}
.more[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.fade{animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* cards and the explanation box */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.explain{background:var(--sunken);border-left:4px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.explain b{display:block;font-size:15px;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.badline{color:var(--bad);font-weight:600}
.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dark:hover{background:var(--ink);opacity:.9}
.why{margin-top:10px;padding:8px 12px;border-left:3px solid var(--chg);background:var(--chg-bg);border-radius:4px;font-size:13.5px}
.legend{margin-top:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend span{padding:2px 8px;border-radius:5px;border:1.5px solid}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.role-key{border-color:var(--key-b);background:var(--key-bg)}
.role-pt{border-color:var(--non-b);background:var(--non-bg)}
.role-ct{border-color:var(--ct-b);background:var(--ct-bg)}
.role-const{border-color:var(--const-b);background:var(--const-bg)}
.box{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:16px 22px;font-size:21px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.box:hover{background:var(--ink);box-shadow:0 0 0 3px var(--chg)}
.box small{font-size:12px;font-weight:400;opacity:.8}
.rnd{padding:2px 5px;line-height:0;border-radius:5px;color:var(--ink)}
textarea{width:100%;font-size:14px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}

/* step 1: the black box */
.schwrap{overflow-x:auto}
.sch{position:relative;width:900px;height:432px;color:var(--muted)}
.sch .arrows{position:absolute;left:0;top:0;color:var(--ink)}
.sg-key{position:absolute;left:8px;top:0;width:560px;height:118px;border:1.5px solid;border-radius:8px;padding:6px 10px;color:var(--ink)}
.sg-key .lblrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600}
.sg-key input.khex{width:100%;margin-top:3px;font-size:13px}
.sg-key .krow{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;font-weight:600}
.sg-key .krow input{flex:1 1 auto;min-width:0;font-size:13px}
.sg-key .krow button{padding:3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.sg-non{position:absolute;left:592px;top:0;width:300px;height:118px;border:2px dashed var(--muted);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink)}
.sg-non b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.sg-non .x{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--chg);color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sg-non p{margin:3px 0 0;color:var(--muted);line-height:1.4}
.sg-box{position:absolute;left:30px;top:166px;width:180px;height:76px;justify-content:center}
.node{position:absolute;border-radius:10px;padding:8px 12px;border:1.5px solid;color:var(--ink)}
.node .nh{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.node .nb{font-size:13.5px;margin:4px 0 2px;line-height:1.5}
.node small{font-size:12px;color:var(--muted)}
.sg-ks{left:258px;top:151px;width:270px;height:106px;background:var(--key-bg);border-color:var(--key-b)}
.sg-ks .nh svg{color:var(--key-b)}
.sg-ct{left:652px;top:151px;width:242px;height:106px;background:var(--ct-bg);border-color:var(--ct-b)}
.sg-pt{left:400px;top:296px;width:492px;height:132px;background:var(--non-bg);border-color:var(--non-b)}
.sg-pt textarea{margin-top:6px;font-size:13.5px;resize:none;line-height:19px;height:80px;padding:6px 9px 0}
.sg-xor{position:absolute;left:562px;top:172px;width:64px;height:64px;border-radius:50%;background:var(--chg);color:#fff;font-size:40px;line-height:62px;text-align:center}
.tablewrap{overflow-x:auto}
.btable{border-collapse:collapse;font-family:var(--mono);font-size:13.5px;margin-top:6px}
.btable td{padding:1px 4px}
.btable td.lbl{font-weight:600;padding-right:10px;font-family:var(--sans);font-size:13px;white-space:nowrap}
.btable td.b{padding:1px 2px;text-align:center;min-width:1.9em;font-size:12.5px}
.btable tr.rt td{color:var(--muted)}
.btable tr.rp td{color:var(--p)}
.btable tr.rz td{color:var(--z)}
.btable tr.rc td{color:var(--c)}
.btable tr.zrow td.b{background:var(--key-bg)}
.btable tr.xorrow td{font-family:var(--sans);font-size:12.5px;color:var(--muted);text-align:center;padding:3px 0}
.btable td.hot{outline:2px solid var(--chg);outline-offset:-2px}
.btable td.eqz{background:var(--chg-bg);color:var(--chg);font-weight:700}
.xorline{font-family:var(--mono);font-size:13.5px;margin:8px 0 0;min-height:1.5em}
.chips8{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.zb{font-family:var(--mono);font-size:13px;min-width:2.3em;text-align:center;padding:2px 4px;border-radius:5px;border:1.5px solid var(--key-b);background:var(--key-bg)}
.zb.same{background:var(--chg);border-color:var(--chg);color:#fff}
.zb.new{outline:2.5px solid var(--chg);outline-offset:1px}
.cmprow{display:flex;gap:10px;align-items:center;margin:4px 0;flex-wrap:wrap}
.cmprow .lbl{width:17em;font-size:13px;font-weight:600}

/* steps 2 and 3: the flow strip, the 256-cell table */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .arrow{font-size:20px;color:var(--muted)}
.fchip{border:1.5px solid;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;line-height:1.25}
.fchip small{font-weight:400;font-size:11.5px;color:var(--muted)}
.fbox{border-radius:9px;padding:6px 14px;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.25;border:2px solid var(--ink)}
.fbox small{font-weight:400;font-size:11.5px;opacity:.8}
.fbox.on{background:var(--ink);color:var(--surface)}
.fbox.on:hover{background:var(--ink)}
.fbox.off{background:var(--surface);color:var(--ink)}
.fbox.off:hover{box-shadow:0 0 0 3px var(--chg)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls input[type=range]{width:200px;accent-color:var(--chg)}
.pos{font-family:var(--mono);font-weight:600;font-size:14px}
.split{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sidepanel{flex:1 1 320px;min-width:320px;max-width:380px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;align-self:flex-start}
.sgrid{display:grid;grid-template-columns:28px repeat(16,30px);gap:3px;font-family:var(--mono)}
.sgrid .hd{font-size:10.5px;color:var(--muted);text-align:center;align-self:end;line-height:1.1}
.sgrid .rh{font-size:10.5px;color:var(--muted);text-align:right;padding-right:3px;align-self:center}
.sc{position:relative;height:34px;border:1.5px solid var(--rule);border-radius:5px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.sc b{font-size:12.5px;font-weight:600}
.sc i{font-style:normal;font-size:9.5px;color:var(--z);font-weight:600}
.sc.idle b{color:var(--muted);font-weight:400}
.sc.mv1{background:var(--mv1)}.sc.mv2{background:var(--mv2)}.sc.mv3{background:var(--mv3)}
.lg-mv0{border-color:var(--rule)!important;color:var(--muted)}
.lg-mv1{border-color:var(--rule)!important;background:var(--mv1)}.lg-mv2{border-color:var(--rule)!important;background:var(--mv2)}.lg-mv3{border-color:var(--rule)!important;background:var(--mv3)}
.gridwrap{position:relative;width:max-content}
.gridwrap svg.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:4}
.sc.sw{background:var(--chg-bg);border-color:var(--chg)}
.sc.pi{outline:3px solid var(--g1);outline-offset:0;z-index:2}
.sc.pj{box-shadow:inset 0 0 0 3px var(--g2);z-index:2}
.sc.pt{background:var(--key-bg);border:2.5px dashed var(--z);z-index:1}
.sc.ptout{background:var(--z);border-color:var(--z)}
.sc.ptout b{color:var(--surface)}
.sc .tag{position:absolute;top:-11px;left:-7px;font-family:var(--sans);font-size:11.5px;font-weight:700;line-height:1;padding:2px 5px;border-radius:4px;color:#fff;z-index:3;white-space:nowrap;box-shadow:0 0 0 1.5px var(--surface)}
.tag.ti{background:var(--g1)}.tag.tj{background:var(--g2)}.tag.tt{background:var(--z)}
.tag.tij{background:linear-gradient(90deg,var(--g1) 50%,var(--g2) 50%)}
.code{font-family:var(--mono);font-size:12px;background:var(--sunken);border-radius:8px;padding:8px 10px;line-height:1.7;white-space:pre;overflow-x:auto}
.code .ln{display:block;padding:0 6px;border-radius:4px;color:var(--muted)}
.code .ln.cur{background:var(--chg);color:#fff}
.code .ln.act{color:var(--ink)}
.calc{font-family:var(--mono);font-size:13.5px;background:var(--chg-bg);border-left:3px solid var(--chg);border-radius:4px;padding:8px 10px;line-height:1.55;word-break:break-word}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.var{font-family:var(--mono);font-size:14px;padding:3px 9px;border-radius:6px;border:2px solid var(--rule);background:var(--surface)}
.var.vi{border-color:var(--g1)}.var.vj{border-color:var(--g2)}.var.vt{border-color:var(--z);border-style:dashed}.var.vo{border-color:var(--key-b);background:var(--key-bg)}
.lg-i{border-color:var(--g1)!important}.lg-j{border-color:var(--g2)!important}.lg-t{border-color:var(--z)!important;border-style:dashed!important;background:var(--key-bg)}
.lg-sw{border-color:var(--chg)!important;background:var(--chg-bg)}.lg-idle{border-color:var(--rule)!important;color:var(--muted)}
.lg-T{border-color:var(--key-b)!important;color:var(--z);font-weight:600}
.htable{border-collapse:collapse;font-size:13px;margin-top:6px}
.htable th{font-weight:600;text-align:left;padding:3px 10px;border-bottom:1.5px solid var(--rule);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.htable td{padding:2px 10px;font-family:var(--mono);white-space:nowrap}
.htable tr.now td{background:var(--chg-bg)}
.htable td.out{background:var(--key-bg);font-weight:600}

/* step 4: the weaknesses */
.chart{display:block;width:100%;max-width:860px;height:auto;font-family:var(--sans)}
.chart text{fill:var(--muted);font-size:11px}
.chart .ax{stroke:var(--rule);stroke-width:1}
.chart .ux{stroke:var(--non-b);stroke-width:1.5;stroke-dasharray:5 4}
.chart text.ul{fill:var(--non-b);font-weight:600}
.chart .bar{fill:var(--muted)}
.chart .bar.hl{fill:var(--chg)}
.chart .bar.real{fill:var(--ok)}
.chart text.hlt{fill:var(--chg);font-weight:700;font-size:12px}
.chart text.okt{fill:var(--ok);font-weight:700;font-size:12px}
.chart .curve{fill:none;stroke:var(--chg);stroke-width:2.5}
.chart .ptr{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
.chart circle.ptr{fill:var(--chg);stroke:var(--surface);stroke-width:2;stroke-dasharray:none}
.chart .mark{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart text.mk{fill:var(--ink);font-weight:600;font-size:12px}
.chart .run{fill:var(--non-b)}
.posbtns{display:inline-flex;gap:4px}
.posbtns button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pkts{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:2px;min-height:150px;margin-top:4px}
.pkts div{display:flex;gap:8px;padding:2px 8px;border-radius:5px;white-space:nowrap;overflow:hidden}
.pkts div.weak{background:var(--chg-bg)}
.pkts div.skip{color:var(--muted)}
.pkts .ivb{border:1.5px solid var(--key-b);border-radius:4px;padding:0 4px}
.kchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.kchip{font-family:var(--mono);font-size:14px;padding:3px 9px;border-radius:6px;border:1.5px solid var(--key-b);background:var(--key-bg);min-width:4.6em;text-align:center}
.kchip small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--muted)}
.kchip.unk{background:var(--surface);color:var(--muted);border-style:dashed}
.kchip.now{outline:2.5px solid var(--chg);outline-offset:1px}
.kchip.found{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.kchip.found small{color:var(--surface);opacity:.85}
.chachaline{margin:0 0 14px;font-size:14px}
.chachaline a,.note a{color:var(--focus)}
.mtag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--chg);border-radius:5px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;max-width:760px;margin-top:8px}

<script>
"use strict";

/* ===================== RC4 core ===================== */
// CORE-BEGIN
// RC4 exactly as on the slide "All of RC4 on one slide" (Lecture 1): KSA, then PRGA.

// KSA: S starts in order, T is the key repeated, 256 swaps.
function ksa(key) {
  const S = new Uint8Array(256);
  for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0;
  for (let i = 0; i < 256; i++) {
    j = (j + S[i] + key[i % key.length]) % 256;
    const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
  }
  return S;
}

// PRGA: n bytes of keystream from a copy of S, after throwing away the first `skip` bytes.
function prga(S0, n, skip) {
  const S = Uint8Array.from(S0);
  const out = new Uint8Array(n);
  let i = 0, j = 0;
  skip = skip || 0;
  for (let k = 0; k < skip + n; k++) {
    i = (i + 1) % 256;
    j = (j + S[i]) % 256;
    const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
    const t = (S[i] + S[j]) % 256;
    if (k >= skip) out[k - skip] = S[t];
  }
  return out;
}
function keystream(key, n, skip) { return prga(ksa(key), n, skip || 0); }

// the helper table T: T[i] = key[i % len(key)]
function tableT(key) {
  const T = new Uint8Array(256);
  for (let i = 0; i < 256; i++) T[i] = key[i % key.length];
  return T;
}

// KSA step by step: S and j after the loops i = 0 .. steps-1 (steps = 0 .. 256).
// row = the loop i = steps: old j, S[i], T[i] and the new j (before its swap).
function ksaAt(key, steps) {
  const S = new Uint8Array(256);
  for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0;
  for (let i = 0; i < steps; i++) {
    j = (j + S[i] + key[i % key.length]) % 256;
    const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
  }
  let row = null;
  if (steps < 256) {
    const i = steps, ti = key[i % key.length];
    row = { i: i, jOld: j, si: S[i], ti: ti, j: (j + S[i] + ti) % 256 };
  }
  return { S: S, j: j, row: row };
}

// PRGA step by step: S, i, j after `bytes` full loops, the rows of the loops done,
// and `next`, the loop that comes now (all its values, computed before its swap).
function prgaAt(S0, bytes) {
  const S = Uint8Array.from(S0);
  let i = 0, j = 0;
  const rows = [];
  for (let k = 0; k < bytes; k++) {
    const r = prgaLoop(S, i, j);
    rows.push(r);
    i = r.i; j = r.j;
  }
  const before = Uint8Array.from(S);
  const next = prgaLoop(Uint8Array.from(S), i, j);
  return { S: before, i: i, j: j, rows: rows, next: next };
}
// one PRGA loop on S (changes S); returns everything a slide shows about it
function prgaLoop(S, i0, j0) {
  const i = (i0 + 1) % 256;
  const si = S[i];
  const j = (j0 + si) % 256;
  const vi = S[i], vj = S[j];
  const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
  const a = S[i], b = S[j];
  const t = (a + b) % 256;
  return { iOld: i0, i: i, jOld: j0, si: si, j: j, vi: vi, vj: vj, a: a, b: b, t: t, out: S[t] };
}
function isPermutation(S) {
  const seen = new Uint8Array(256);
  for (let k = 0; k < 256; k++) seen[S[k]]++;
  for (let k = 0; k < 256; k++) if (seen[k] !== 1) return false;
  return true;
}

// statistics, in chunks (the UI calls them with fresh random bytes)
// mistake 1: how often S[0] == key[0] after the KSA, and after a fair shuffle (Fisher-Yates)
function countS0(keys16, rnd32, n, res) {
  const S = new Uint8Array(256);
  let r = 0;
  for (let k = 0; k < n; k++) {
    const o = 16 * k;
    for (let x = 0; x < 256; x++) S[x] = x;
    let j = 0;
    for (let i = 0; i < 256; i++) {
      j = (j + S[i] + keys16[o + (i % 16)]) % 256;
      const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
    }
    if (S[0] === keys16[o]) res.ksa++;
    for (let x = 0; x < 256; x++) S[x] = x;
    for (let i = 255; i > 0; i--) {
      const p = Math.floor(rnd32[r++] / 4294967296 * (i + 1));
      const tmp = S[i]; S[i] = S[p]; S[p] = tmp;
    }
    if (S[0] === keys16[o]) res.shuffle++;
    res.n++;
  }
}
// 4.2: the full count of keystream bytes 1, 2 and 3 over many keys: res.hist[b][z], b = 0, 1, 2
function countZeros(keys16, n, res) {
  const S = new Uint8Array(256);
  for (let k = 0; k < n; k++) {
    const o = 16 * k;
    for (let x = 0; x < 256; x++) S[x] = x;
    let j = 0;
    for (let i = 0; i < 256; i++) {
      j = (j + S[i] + keys16[o + (i % 16)]) % 256;
      const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
    }
    let i = 0; j = 0;
    for (let b = 0; b < 3; b++) {
      i = (i + 1) % 256;
      j = (j + S[i]) % 256;
      const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
      res.hist[b][S[(S[i] + S[j]) % 256]]++;
    }
    res.n++;
  }
}
// WEP: the RC4 key of a packet is IV (3 public bytes) followed by the secret Wi-Fi key
function wepKey(iv, secret) {
  const k = new Uint8Array(iv.length + secret.length);
  k.set(iv, 0); k.set(secret, iv.length);
  return k;
}
function xorBytes(a, b) {
  const n = Math.min(a.length, b.length), out = new Uint8Array(n);
  for (let k = 0; k < n; k++) out[k] = a[k] ^ b[k];
  return out;
}

/* 4.3: the FMS attack exactly as in Lecture 1, example2 (wep.py, fms.py, attack.py).
   The packets come from Python's random.Random(2): a port of Python's Mersenne Twister
   (seeding with init_by_array, getrandbits, randrange = _randbelow, shuffle), so the packets are byte for byte
   the ones wep.capture() makes. */
function PyRandom(seed) {
  const N = 624, mt = new Uint32Array(N);
  let mti = N;
  const initGenrand = s => {
    mt[0] = s >>> 0;
    for (let i = 1; i < N; i++) mt[i] = (Math.imul(1812433253, mt[i - 1] ^ (mt[i - 1] >>> 30)) + i) >>> 0;
  };
  // Python: an int seed becomes its 32-bit words, lowest first (seed < 2^32 here: one word)
  const key = [seed >>> 0];
  initGenrand(19650218);
  let i = 1, j = 0;
  for (let k = Math.max(N, key.length); k > 0; k--) {
    mt[i] = ((mt[i] ^ Math.imul(mt[i - 1] ^ (mt[i - 1] >>> 30), 1664525)) + key[j] + j) >>> 0;
    i++; j++;
    if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
    if (j >= key.length) j = 0;
  }
  for (let k = N - 1; k > 0; k--) {
    mt[i] = ((mt[i] ^ Math.imul(mt[i - 1] ^ (mt[i - 1] >>> 30), 1566083941)) - i) >>> 0;
    i++;
    if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
  }
  mt[0] = 0x80000000;
  const u32 = () => {
    if (mti >= N) {
      for (let k = 0; k < N; k++) {
        const y = (mt[k] & 0x80000000) | (mt[(k + 1) % N] & 0x7fffffff);
        mt[k] = mt[(k + 397) % N] ^ (y >>> 1) ^ (y & 1 ? 0x9908b0df : 0);
      }
      mti = 0;
    }
    let y = mt[mti++];
    y ^= y >>> 11; y ^= (y << 7) & 0x9d2c5680; y ^= (y << 15) & 0xefc60000; y ^= y >>> 18;
    return y >>> 0;
  };
  const getrandbits = k => u32() >>> (32 - k);   // k = 1 .. 32
  const randbelow = n => {                      // Python's _randbelow_with_getrandbits
    const k = 32 - Math.clz32(n);
    let r = getrandbits(k);
    while (r >= n) r = getrandbits(k);
    return r;
  };
  return {
    getrandbits: getrandbits, randrange: randbelow,
    shuffle: x => { for (let a = x.length - 1; a > 0; a--) { const b = randbelow(a + 1); const t = x[a]; x[a] = x[b]; x[b] = t; } },
  };
}
// wep.capture(seed=2, per_byte=3000): packets = IV (A+3, 255, x) followed by the RC4 ciphertext of AA + 8 random bytes.
// Made in pieces: next(count) adds up to `count` packets and returns true when all are there (then shuffled).
function wepCapture(secret, seed, perByte) {
  const rng = PyRandom(seed), total = secret.length * perByte, packets = [];
  let A = 0, k = 0;
  return {
    packets: packets, total: total,
    next(count) {
      while (count-- > 0 && A < secret.length) {
        const iv = Uint8Array.from([A + 3, 255, rng.randrange(256)]);
        const plain = new Uint8Array(9); plain[0] = 0xAA;
        for (let b = 1; b < 9; b++) plain[b] = rng.randrange(256);
        const c = xorBytes(plain, keystream(wepKey(iv, secret), 9));
        const pk = new Uint8Array(12); pk.set(iv, 0); pk.set(c, 3);
        packets.push(pk);
        if (++k === perByte) { k = 0; A++; }
      }
      if (A < secret.length) return false;
      if (!this.shuffled) { rng.shuffle(packets); this.shuffled = true; }
      return true;
    },
  };
}
// fms.fms_guess: one guess for the next secret key byte, from a weak IV, the first keystream byte and the bytes found so far
function fmsGuess(iv, z1, known) {
  const key = Array.from(iv).concat(Array.from(known));
  const A = key.length;
  const S = new Uint8Array(256);
  for (let x = 0; x < 256; x++) S[x] = x;
  let j = 0;
  for (let i = 0; i < A; i++) {
    j = (j + S[i] + key[i]) % 256;
    const tmp = S[i]; S[i] = S[j]; S[j] = tmp;
  }
  const inverse = new Uint8Array(256);
  for (let x = 0; x < 256; x++) inverse[S[x]] = x;
  return ((inverse[z1] - j - S[A]) % 256 + 256) % 256;
}
// attack.py, for one packet and the key byte A: null if the IV is not weak for A, else the vote
function fmsVote(pk, A, recovered) {
  if (pk[0] !== A + 3 || pk[1] !== 255) return null;
  return fmsGuess(pk.subarray(0, 3), pk[3] ^ 0xAA, recovered);
}
// attack.py's ranking: sorted(range(256), key=votes, reverse=True) is stable, so ties keep the smaller value first
function rankVotes(votes) { return Array.from({ length: 256 }, (_, v) => v).sort((a, b) => votes[b] - votes[a] || a - b); }

function parseKeyHex(text) {
  const s = text.replace(/[\s:,]/g, "").replace(/^0x/i, "");
  if (!/^[0-9a-fA-F]*$/.test(s) || s.length % 2 !== 0 || s.length < 2 || s.length > 512) return null;
  const b = new Uint8Array(s.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(s.substr(2 * i, 2), 16);
  return b;
}
function bytesHex(b, sep) { return Array.from(b, x => x.toString(16).padStart(2, "0")).join(sep || ""); }

/* Test vectors.
   RFC 6229 ("Test Vectors for the Stream Cipher RC4", 2011), section 2, keys 0x0102030405 (40 bits),
   0x0102030405060708 (64 bits) and 0x0102030405060708090a0b0c0d0e0f10 (128 bits), offsets 0, 16, 240, 4080.
   All copied from the RFC text and also recomputed with an independent Python 3 RC4 (same values).
   Wikipedia "RC4", test vectors: key "Key", keystream EB9F7781B734CA72A7 (also in the lecture plan, section 7.1).
   Lecture 1 slides (main.tex), all recomputed in Python 3:
   - "KSA, step 2": key 01 02 03 04 05, j = 1, 3, 8, 12 for i = 0..3;
   - "KSA: the result after i = 255": j = 103, S[0..12] = 1 3 8 201 21 27 35 67 242 145 207 89 92, S[254] = 186, S[255] = 88;
   - "Step 2: PRGA": S[204] = 178;  "PRGA: four bytes": j 3 11 14 35, t 204 97 34 47, output 178 57 99 5;
   - "Solution: use RC4" (Task 2): key "Kangaroo" -> 69 9d da 7e fe 61 73 62, "Kangarop" -> 97 c5 8c ab f1 d1 2e 8d,
     the ciphertext decrypts to "Meet me at the library at 5.";
   - "WEP, packet by packet": Wi-Fi key 1F 8A 3C 77 D2, IV 4F 12 A0 -> keystream EC 56 B2 AC, ciphertext 46 FC B1 AC. */
const RFC6229 = [
  { key: "0102030405", off: 0, ks: "b2396305f03dc027ccc3524a0a1118a8" },
  { key: "0102030405", off: 16, ks: "6982944f18fc82d589c403a47a0d0919" },
  { key: "0102030405", off: 240, ks: "28cb1132c96ce286421dcaadb8b69eae" },
  { key: "0102030405", off: 4080, ks: "068326a2118416d21f9d04b2cd1ca050" },
  { key: "0102030405060708", off: 0, ks: "97ab8a1bf0afb96132f2f67258da15a8" },
  { key: "0102030405060708090a0b0c0d0e0f10", off: 0, ks: "9ac7cc9a609d1ef7b2932899cde41b97" },
  { key: "0102030405060708090a0b0c0d0e0f10", off: 240, ks: "065902e4b620f6cc36c8589f66432f2b" },
];
const SLIDE_KEY = "0102030405";
const TASK2_CT = "24F8BF0ADE0C16426D343A28F5558755720EF505F96EB7C0972B61E7";
const WEP_SECRET = Uint8Array.from([0x1F, 0x8A, 0x3C, 0x77, 0xD2]);   // slides "WEP, packet by packet" and example1
const SNAP = Uint8Array.from([0xAA, 0xAA, 0x03, 0x00]);               // every WEP data packet starts with this header

function selfTest() {
  const fails = [];
  const enc = s => new TextEncoder().encode(s);
  for (const v of RFC6229)
    if (bytesHex(keystream(parseKeyHex(v.key), 16, v.off)) !== v.ks) fails.push("RFC 6229, key " + v.key + ", offset " + v.off);
  if (bytesHex(keystream(enc("Key"), 9)) !== "eb9f7781b734ca72a7") fails.push("key \"Key\"");
  const k5 = parseKeyHex(SLIDE_KEY);
  // the KSA on the slides, step by step
  const js = [0, 1, 2, 3].map(i => ksaAt(k5, i).row.j);
  if (js.join(" ") !== "1 3 8 12") fails.push("KSA i = 0..3");
  const end = ksaAt(k5, 256);
  if (end.j !== 103 || Array.from(end.S.slice(0, 13)).join(" ") !== "1 3 8 201 21 27 35 67 242 145 207 89 92" ||
      end.S[204] !== 178 || end.S[254] !== 186 || end.S[255] !== 88) fails.push("KSA result");
  if (bytesHex(end.S) !== bytesHex(ksa(k5)) || !isPermutation(end.S)) fails.push("KSA step by step");
  // "PRGA: four bytes"
  const p = prgaAt(end.S, 4).rows;
  if (p.map(r => r.j).join(" ") !== "3 11 14 35" || p.map(r => r.t).join(" ") !== "204 97 34 47" ||
      p.map(r => r.out).join(" ") !== "178 57 99 5") fails.push("PRGA, four bytes");
  if (bytesHex(prgaAt(end.S, 300).rows.map(r => r.out)) !== bytesHex(keystream(k5, 300))) fails.push("PRGA step by step");
  // Task 2
  if (bytesHex(keystream(enc("Kangaroo"), 8)) !== "699dda7efe617362" || bytesHex(keystream(enc("Kangarop"), 8)) !== "97c58cabf1d12e8d") fails.push("Task 2 keystreams");
  const ct = parseKeyHex(TASK2_CT);
  if (new TextDecoder().decode(xorBytes(ct, keystream(enc("Kangaroo"), ct.length))) !== "Meet me at the library at 5.") fails.push("Task 2 message");
  // WEP slide
  const zw = keystream(wepKey(parseKeyHex("4F12A0"), WEP_SECRET), 4);
  if (bytesHex(zw) !== "ec56b2ac" || bytesHex(xorBytes(zw, SNAP)) !== "46fcb1ac") fails.push("WEP packet");
  // the statistics code is the same RC4
  const r = { hist: [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)], n: 0 };
  const k16 = parseKeyHex("0102030405060708090a0b0c0d0e0f10");
  countZeros(k16, 1, r);
  const z3 = keystream(k16, 3);
  if (z3[1] !== 0xc7 || r.hist[0][z3[0]] !== 1 || r.hist[1][z3[1]] !== 1 || r.hist[2][z3[2]] !== 1) fails.push("statistics code");
  // Python's random.Random(2), recomputed in Python 3.12: getrandbits(32) x 3 and randrange(256) x 5
  const r1 = PyRandom(2), r2 = PyRandom(2);
  if ([0, 1, 2].map(() => r1.getrandbits(32)).join(" ") !== "4106135923 3707026329 4070888059" ||
      [0, 1, 2, 3, 4].map(() => r2.randrange(256)).join(" ") !== "28 46 43 184 86") fails.push("Python random");
  return fails;
}
/* example2: python3 attack.py prints (Python 3.12, seed 2, 15 000 packets):
   first packet 06ffc3086258ce1bb152ee63, last packet 05ff2c5366f638c5b227ceb7,
   K[0] 1F (147) 85 (76) 95 (59); K[1] 8A (96) 5C (66) 92 (59); K[2] 3C (124) 94 (82) BD (48);
   K[3] 77 (210) 12 (58) 05 (51); K[4] D2 (245) 45 (70) 36 (46); recovered 1f 8a 3c 77 d2, match True. */
const FMS_SEED = 2, FMS_PER_BYTE = 3000;
const FMS_TOP3 = ["1F 147 85 76 95 59", "8A 96 5C 66 92 59", "3C 124 94 82 BD 48", "77 210 12 58 05 51", "D2 245 45 70 36 46"];
// the same check in pieces (about 10 million small steps: the page must not freeze); done(fails) at the end
function fmsSelfTest(done) {
  const hex = v => v.toString(16).padStart(2, "0").toUpperCase();
  const cap = wepCapture(WEP_SECRET, FMS_SEED, FMS_PER_BYTE);
  const recovered = [], fails = [];
  let A = 0, p = 0, votes = new Uint32Array(256), top = [];
  const step = () => {
    const t0 = performance.now();

function updateL0() {
  const out = document.getElementById("l0out");
  if (!out) return;
  const t = L();
  L0DATA = null;
  const ids = ["ksbytes", "ctbytes", "kscap", "ctcap"];
  if (app.keyErr) {
    ids.forEach(id => { document.getElementById(id).textContent = ""; });
    out.innerHTML = '<p class="err">' + t.errKey + "</p>";
    document.getElementById("l0chg").innerHTML = "";
    return;
  }
  // one small change in the key
  const kb = Uint8Array.from(app.key); kb[kb.length - 1] = (kb[kb.length - 1] + 1) % 256;
  const za = keystream(app.key, 8), zb = keystream(kb, 8);
  let same = 0; for (let k = 0; k < 8; k++) if (za[k] === zb[k]) same++;
  const chips = (z, o) => '<span class="chips8">' + Array.from(z, (x, k) => '<span class="zb' + (x === o[k] ? " same" : "") + '">' + hx2(x) + "</span>").join("") + "</span>";

    '<div class="cmprow"><span class="lbl">' + t.keyB + ': <span class="mono">' + esc(keyShortHex(kb)) + "</span></span>" + chips(zb, za) + "</div>" +
    '<p style="margin:4px 0 0;font-weight:600">' + t.sameN(same, 8) + "</p>";
  const p = new TextEncoder().encode(app.msg);
  const n = p.length;
  if (n === 0) { ids.forEach(id => { document.getElementById(id).textContent = ""; }); out.innerHTML = '<p class="note">' + t.typeMsg + "</p>"; return; }
  const z = keystream(app.key, n);
  const c = xorBytes(p, z);
  const firstBytes = arr => Array.from(arr.slice(0, 16), hx2).join(" ").replace(/^((?:\S+ ){7}\S+) /, "$1<br>") + (arr.length > 16 ? " …" : "");
  document.getElementById("ksbytes").innerHTML = firstBytes(z);
  document.getElementById("kscap").textContent = t.ksCap(n);
  document.getElementById("ctbytes").innerHTML = firstBytes(c);
  document.getElementById("ctcap").textContent = t.ctCap(n);

    '<tr class="xorrow"><td class="lbl"></td><td colspan="' + SHOW + '">↓ ' + t.xorRow + " ↓</td></tr>" + rowOf("rc", t.rowC, i => hx2(c[i]));
  out.innerHTML = '<div class="tablewrap"><table class="btable">' + rows + "</table></div>" +
    (n > SHOW ? '<p class="note">' + t.more(n - SHOW) + "</p>" : "") +
    '<p class="xorline" id="xorline">' + t.xorHint + "</p>";
  L0DATA = { p: p, z: z, c: c };
}

/* ---------- the 256-cell table ---------- */
// marks: { i, j, t, sw: [x, y], tout } ; T: the helper table or null ; idle: grey the cells with S[x] = x
function sgridHTML(S, T, marks) {
  let h = '<div class="sgrid"><span></span>';
  for (let c = 0; c < 16; c++) h += '<span class="hd">' + c + "</span>";
  for (let r = 0; r < 16; r++) {
    h += '<span class="rh">' + (16 * r) + "</span>";
    for (let c = 0; c < 16; c++) {
      const x = 16 * r + c;
      let cls = "sc", tag = "";
      if (marks.idle && S[x] === x) cls += " idle";
      if (marks.mv) { const d = Math.abs(S[x] - x); if (d > 0) cls += d < 16 ? " mv1" : d < 64 ? " mv2" : " mv3"; }
      if (marks.sw && marks.sw.indexOf(x) >= 0) cls += " sw";
      if (marks.t === x) cls += marks.tout ? " pt ptout" : " pt";
      if (marks.i === x) cls += " pi";
      if (marks.j === x) cls += " pj";
      if (marks.i === x && marks.j === x) tag = '<span class="tag tij">i,j</span>';
      else if (marks.i === x) tag = '<span class="tag ti">i</span>';
      else if (marks.j === x) tag = '<span class="tag tj">j</span>';
      else if (marks.t === x) tag = '<span class="tag tt">t</span>';
      h += '<div class="' + cls + '" title="S[' + x + "] = " + S[x] + (T ? ", T[" + x + "] = " + T[x] : "") + '">' + tag + "<b>" + S[x] + "</b>" + (T ? "<i>" + T[x] + "</i>" : "") + "</div>";
    }
  }
  return h + "</div>";
}

}

    '<marker id="arJ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--g2)"/></marker></defs>';

      '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="3.5" fill="' + col + '"/>';

const IV_N = Math.pow(2, 24), IV_N50 = Math.round(Math.sqrt(2 * Math.log(2) * IV_N));   // 4 823

function ivRun() {
  const seen = new Set();

}

// 4.3: the FMS attack of example2, packet by packet. The same packets, the same rule, the same votes as attack.py.
const FMS_SPEEDS = [20, 200, 2000, 20000];   // packets per second
const FMS = { cap: null, ready: false, A: 0, p: 0, votes: new Uint32Array(256), weak: 0, recovered: [], lines: [], log: [],

function fmsPrepare() {

  const step = () => {
    const t0 = performance.now();

  FMS.log.push({ k: FMS.p, pk: pk, v: v, A: FMS.A });
  if (FMS.log.length > 6) FMS.log.shift();
  if (FMS.p === FMS.cap.total) {   // the end of the packets: the winner is this key byte
    const rk = rankVotes(FMS.votes);
    FMS.recovered.push(rk[0]);
    const hx = x => hx2(x).toUpperCase();
    FMS.lines.push("K[" + FMS.A + "]: top guesses  " + hx(rk[0]) + " (" + FMS.votes[rk[0]] + " votes), " + hx(rk[1]) + " (" + FMS.votes[rk[1]] + "), " + hx(rk[2]) + " (" + FMS.votes[rk[2]] + ")");

    FMS.hold = 0; FMS.A++; FMS.p = 0; FMS.votes = new Uint32Array(256); FMS.weak = 0; FMS.log = [];
  }

  } else if (f === "ktext") {
    const b = new TextEncoder().encode(v);
    if (b.length >= 1 && b.length <= 256) setKey(b, "ktext");
    else { app.keyErr = true; keyChanged(); }
  }
  else if (f === "msg") { app.msg = v; updateL0(); }
  else if (f === "ksapos") ksaGo(+v);
  else if (f === "iv1" || f === "iv2") { app[f] = v; updateM3(); }
  else if (f === "s2n") app.s2n = +v;
  else if (f === "ivn") { app.ivN = +v; updateIvChart(); }
  else if (f === "fmsspeed") FMS.speed = +v;
});

  if (!td || !L0DATA) return;

  view.querySelectorAll("td.hot").forEach(x => x.classList.remove("hot"));

  const xl = document.getElementById("xorline");
  if (xl) xl.textContent = L().xorByte(i, hx2(L0DATA.p[i]), hx2(L0DATA.z[i]), hx2(L0DATA.c[i]));
});

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Enter" && tag === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); zoomIn(); }
  else if (e.key === "ArrowLeft" || e.key === "Escape") { e.preventDefault(); zoomOut(); }
  else if (app.level === 1 && (e.key === "n" || e.key === " ")) { e.preventDefault(); ksaGo(app.ksaPos + 1); }
  else if (app.level === 1 && e.key === "p") ksaGo(app.ksaPos - 1);
  else if (app.level === 2 && (e.key === "n" || e.key === " ")) { e.preventDefault(); prgaGo(app.prgaPos + 1); }
  else if (app.level === 2 && e.key === "p") prgaGo(app.prgaPos - 1);
});

window.addEventListener("hashchange", () => {
  const lv = levelOfHash(location.hash);
  if (lv !== null && lv !== app.level) goTo(lv);
});
